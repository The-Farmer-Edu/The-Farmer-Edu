name: Auto Reviewer Assign
on:
  pull_request:
    types: [opened, review_requested]

permissions:
  pull-requests: write
  contents: read
  id-token: write 

jobs:
  auto-reviewer-assign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: johnmanjiro13/auto-reviewer-assign@v0.2.0
        with:
          token: ${{ secrets.ORGANIZATION_TEAM_PAT }}
          config-file-path: .github/auto-reviewer-assign.yml