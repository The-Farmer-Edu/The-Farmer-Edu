name: Auto Reviewer Assign

on:
  pull_request_target:
    types: [opened, review_requested]

permissions:
  contents: read
  pull-requests: write

jobs:
  auto-reviewer-assign:
    runs-on: ubuntu-latest

    steps:
      - name: Check out trusted workflow configuration
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Assign reviewers
        uses: johnmanjiro13/auto-reviewer-assign@v0.2.0
        with:
          token: ${{ secrets.ORGANIZATION_TEAM_PAT }}
          config-file-path: .github/auto-reviewer-assign.yml