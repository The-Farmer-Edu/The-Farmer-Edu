name: Proteger Fechamento de PR

on:
  pull_request:
    types: [closed]

permissions:
  pull-requests: write
  contents: read

jobs:
  verificar-fechamento:
    if: github.event.pull_request.merged == false
    runs-on: ubuntu-latest
    
    steps:
      - name: Validar permissão por Time da Org
        env:
          GH_TOKEN: ${{ secrets.ORGANIZATION_TEAM_PAT }}
          QUEM_FECHOU: ${{ github.actor }}
          CRIADOR_DO_PR: ${{ github.event.pull_request.user.login }}
          NOME_DA_ORGANIZACAO: "The-Farmer-Edu"
          SLUG_DO_TIME: "tech-leads"
          
        run: |
          echo "PR fechado por: $QUEM_FECHOU"
          echo "Criador do PR: $CRIADOR_DO_PR"
          
          if [ "$QUEM_FECHOU" = "$CRIADOR_DO_PR" ]; then
            echo "Permitido: O criador do PR pode fechar o próprio PR."
            exit 0
          fi
          
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://github.com")
          
          if [ "$HTTP_STATUS" = "204" ]; then
            echo "Permitido: $QUEM_FECHOU faz parte do time @$NOME_DA_ORGANIZACAO/$SLUG_DO_TIME."
            exit 0
          fi
          
          echo "Bloqueado: Status retornado da API foi $HTTP_STATUS. Usuário não autorizado."
          
          gh pr comment ${{ github.event.pull_request.number }} --body "⚠️ Olá @$QUEM_FECHOU, este Pull Request foi reaberto automaticamente. Apenas o criador do PR (@$CRIADOR_DO_PR) ou membros do time aprovado (@$NOME_DA_ORGANIZACAO/$SLUG_DO_TIME) podem cancelá-lo."
          
          gh pr reopen ${{ github.event.pull_request.number }}
