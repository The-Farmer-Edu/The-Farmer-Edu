<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minha Fazenda 3D</title>
<style>
:root{--fundo-card:#fffdf5;--texto:#3b2a1a;--destaque:#4a8f3a;--desativado:#a89a82}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--fundo-card:#2b3424;--texto:#f1e8d0;--destaque:#7fc15f;--desativado:#6f7a62}}
:root[data-theme="dark"]{--fundo-card:#2b3424;--texto:#f1e8d0;--destaque:#7fc15f;--desativado:#6f7a62}
html,body{height:100%;margin:0;overflow:hidden;background:#9fd8f5;font-family:system-ui,sans-serif}
canvas{position:fixed;inset:0;touch-action:none}
#barra-topo{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 8px;pointer-events:none}
#barra-topo>*{pointer-events:auto;background:var(--fundo-card);color:var(--texto);border-radius:20px;padding:8px 14px;font-size:15px;box-shadow:0 2px 8px #0003;border:0}
#lista-cards{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;overflow-x:auto;padding:8px 12px calc(env(safe-area-inset-bottom,0px) + 10px)}
.card{flex:0 0 150px;background:var(--fundo-card);color:var(--texto);border-radius:14px;padding:10px;box-shadow:0 2px 8px #0003}
.pontos-nivel{letter-spacing:2px;color:var(--destaque);margin:4px 0 8px;font-size:13px}
.card button{width:100%;min-height:36px;border:0;border-radius:10px;background:var(--destaque);color:#fff;font-weight:600;font-size:13px}
.card button:disabled{background:var(--desativado);opacity:.7}
#aviso{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--fundo-card);color:var(--texto);padding:10px 16px;border-radius:20px;box-shadow:0 2px 10px #0004;opacity:0;transition:opacity .3s;pointer-events:none;font-size:14px;text-align:center}
</style></head><body>
<div id="barra-topo"><b>⭐ <span id="valor-xp">0</span> XP</b><button id="botao-teste-xp">+50 XP (teste)</button></div>
<div id="lista-cards"></div><div id="aviso"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const selecionar = seletor => document.querySelector(seletor);

// ======================= CONFIGURAÇÃO DO JOGO =======================
const AREAS = [
  { id: 'animais',    nome: 'Animais',    icone: '🐄', posicao: { x: 9,  z: 5 } },
  { id: 'casa',       nome: 'Casa',       icone: '🏠', posicao: { x: -8, z: -6 } },
  { id: 'celeiro',    nome: 'Celeiro',    icone: '🛖', posicao: { x: 7,  z: -6 } },
  { id: 'maquinario', nome: 'Maquinário', icone: '🚜', posicao: { x: -9, z: 5 } },
  { id: 'plantacao',  nome: 'Plantação',  icone: '🌽', posicao: { x: 0,  z: 6.5 } },
];
const NIVEL_MAXIMO = 5;
const CUSTO_PARA_PROXIMO_NIVEL = [100, 250, 500, 1000]; // posição 0 = custo do nível 1 → 2
const COR = { madeira: 0x8a5a2a, janela: 0xffe08a, vidro: 0xbfe3f2, cinzaClaro: 0xcfd4d8, feno: 0xe8c04a, pneu: 0x222222 };

// ======================= PROGRESSO (XP E NÍVEIS) =======================
const CHAVE_SALVAMENTO = 'fazenda3d-progresso';
let estado = { xp: 0, niveis: { animais: 1, casa: 1, celeiro: 1, maquinario: 1, plantacao: 1 } };
try {
  const progressoSalvo = JSON.parse(localStorage.getItem(CHAVE_SALVAMENTO));
  if (progressoSalvo && progressoSalvo.niveis) estado = progressoSalvo;
} catch (erro) {}
function salvarProgresso() {
  try { localStorage.setItem(CHAVE_SALVAMENTO, JSON.stringify(estado)); } catch (erro) {}
}

// ======================= CENA 3D BÁSICA =======================
const renderizador = new THREE.WebGLRenderer({ antialias: true });
const canvas = renderizador.domElement;
renderizador.setPixelRatio(Math.min(devicePixelRatio, 2));
renderizador.shadowMap.enabled = true;
document.body.prepend(canvas);

const cena = new THREE.Scene();
cena.background = new THREE.Color(0x9fd8f5);
cena.fog = new THREE.Fog(0x9fd8f5, 45, 100);
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 200);

cena.add(new THREE.HemisphereLight(0xffffff, 0x6a8f4a, 0.75)); // luz ambiente (céu + chão)
const sol = new THREE.DirectionalLight(0xfff2cc, 0.9);
sol.position.set(12, 22, 10);
sol.castShadow = true;
sol.shadow.mapSize.set(1024, 1024);
Object.assign(sol.shadow.camera, { left: -24, right: 24, top: 24, bottom: -24, near: 1, far: 70 });
cena.add(sol);

// ======================= FUNÇÕES AUXILIARES DE MODELAGEM =======================
const cacheDeMateriais = {};
function material(cor) {
  if (!cacheDeMateriais[cor]) cacheDeMateriais[cor] = new THREE.MeshLambertMaterial({ color: cor });
  return cacheDeMateriais[cor];
}
function criarCaixa(largura, altura, profundidade, cor, x, y, z, pai) {
  const caixa = new THREE.Mesh(new THREE.BoxGeometry(largura, altura, profundidade), material(cor));
  caixa.position.set(x, y, z);
  caixa.castShadow = caixa.receiveShadow = true;
  pai.add(caixa);
  return caixa;
}
function criarCilindro(raioTopo, raioBase, altura, cor, x, y, z, pai, segmentos = 14) {
  const cilindro = new THREE.Mesh(new THREE.CylinderGeometry(raioTopo, raioBase, altura, segmentos), material(cor));
  cilindro.position.set(x, y, z);
  cilindro.castShadow = true;
  pai.add(cilindro);
  return cilindro;
}
function criarRoda(raio, largura, x, y, z, pai) {
  const roda = criarCilindro(raio, raio, largura, COR.pneu, x, y, z, pai);
  roda.rotation.z = Math.PI / 2; // deita o cilindro para virar roda
}

// ======================= CENÁRIO FIXO (chão, caminho, árvores, nuvens) =======================
const chao = new THREE.Mesh(new THREE.PlaneGeometry(70, 70), material(0x78b24a));
chao.rotation.x = -Math.PI / 2;
chao.receiveShadow = true;
cena.add(chao);
criarCaixa(2.4, 0.05, 16, 0xd9b97a, 0, 0.03, -1, cena); // caminho de terra

const POSICOES_ARVORES = [[-16, -2], [16, 0], [-15, 13], [15, 14], [-3, -13], [2, -14], [-17, -12], [17, -12]];
POSICOES_ARVORES.forEach(([x, z]) => {
  criarCaixa(0.4, 1, 0.4, 0x6b4a2b, x, 0.5, z, cena); // tronco
  const copa = new THREE.Mesh(new THREE.ConeGeometry(1.2, 2.6, 7), material(0x2f7d32));
  copa.position.set(x, 2.2, z);
  copa.castShadow = true;
  cena.add(copa);
});

const nuvens = [];
for (let i = 0; i < 5; i++) {
  const nuvem = new THREE.Group();
  for (let parte = 0; parte < 3; parte++) criarCaixa(3 + parte, 1, 2, 0xffffff, parte * 2 - 2, (parte % 2) * 0.4, 0, nuvem);
  nuvem.position.set(-30 + i * 14, 16, -20 + i * 9);
  cena.add(nuvem);
  nuvens.push(nuvem);
}

// ======================= MODELOS REUTILIZÁVEIS (trator e animais) =======================
function criarTrator(pai, x, z, escala, corCarroceria) {
  const trator = new THREE.Group();
  criarCaixa(1.1, 0.7, 2, corCarroceria, 0, 0.95, 0, trator);   // carroceria
  criarCaixa(0.9, 0.9, 0.9, COR.vidro, 0, 1.7, -0.45, trator);  // cabine
  criarCaixa(0.1, 0.6, 0.1, 0x333333, 0.35, 1.6, 0.7, trator);  // escapamento
  criarRoda(0.6, 0.4, -0.8, 0.6, -0.5, trator);  criarRoda(0.6, 0.4, 0.8, 0.6, -0.5, trator);   // rodas traseiras
  criarRoda(0.38, 0.3, -0.7, 0.38, 0.8, trator); criarRoda(0.38, 0.3, 0.7, 0.38, 0.8, trator);  // rodas dianteiras
  trator.scale.setScalar(escala);
  trator.position.set(x, 0, z);
  pai.add(trator);
  return trator;
}

// tipo: 'galinha' | 'porco' | 'vaca' | 'ovelha'. Cada animal passeia em círculos dentro do cercado.
function criarAnimal(pai, animacoes, tipo, centroX, centroZ) {
  const animal = new THREE.Group();
  if (tipo === 'galinha') {
    criarCaixa(0.4, 0.35, 0.5, 0xffffff, 0, 0.35, 0, animal);
    criarCaixa(0.12, 0.12, 0.12, 0xe03a2a, 0, 0.62, 0.22, animal);  // crista
    criarCaixa(0.1, 0.08, 0.15, 0xf2a93b, 0, 0.5, 0.34, animal);    // bico
  }
  if (tipo === 'porco') {
    criarCaixa(0.7, 0.5, 1, 0xf2a0b5, 0, 0.5, 0, animal);
    criarCaixa(0.45, 0.4, 0.4, 0xf2a0b5, 0, 0.55, 0.65, animal);    // cabeça
  }
  if (tipo === 'vaca') {
    criarCaixa(0.9, 0.8, 1.6, 0xffffff, 0, 0.9, 0, animal);
    criarCaixa(0.6, 0.6, 0.6, 0xffffff, 0, 1.1, 1, animal);         // cabeça
    criarCaixa(0.5, 0.3, 0.05, 0x222222, 0.46, 1, 0.1, animal);     // manchas
    criarCaixa(0.5, 0.3, 0.05, 0x222222, -0.46, 0.8, -0.3, animal);
  }
  if (tipo === 'ovelha') {
    criarCaixa(0.7, 0.55, 0.9, 0xeeeeee, 0, 0.55, 0, animal);
    criarCaixa(0.35, 0.35, 0.35, 0x444444, 0, 0.7, 0.55, animal);   // cabeça
  }
  pai.add(animal);

  const raioDoPasseio = 0.3 + Math.random() * 0.4;
  const velocidade = 0.3 + Math.random() * 0.4;
  const faseInicial = Math.random() * 6;
  animacoes.push(tempo => {
    const angulo = tempo * velocidade + faseInicial;
    animal.position.set(
      centroX + Math.sin(angulo) * raioDoPasseio * 2,
      Math.abs(Math.sin(tempo * 5 + faseInicial)) * 0.05, // pulinho ao andar
      centroZ + Math.cos(angulo) * raioDoPasseio * 1.4
    );
    animal.rotation.y = Math.atan2(Math.cos(angulo) * raioDoPasseio * 2, -Math.sin(angulo) * raioDoPasseio * 1.4);
  });
}

// ======================= CONSTRUTORES DAS 5 ÁREAS =======================
// Cada construtor recebe: grupo (onde desenhar), nivel (1 a 5) e animacoes (lista de funções chamadas a cada frame).
const construtoresDasAreas = {

  casa(grupo, nivel, animacoes) {
    const lado = 3 + nivel * 0.5;
    const andares = nivel >= 3 ? 2 : 1;
    const alturaParedes = 1.8 * andares;
    criarCaixa(lado, alturaParedes, lado, 0xf3e3c0, 0, alturaParedes / 2, 0, grupo); // paredes

    const telhado = new THREE.Mesh(new THREE.ConeGeometry(lado * 0.78, 1.6 + nivel * 0.1, 4), material(0xb5532f));
    telhado.rotation.y = Math.PI / 4;
    telhado.position.y = alturaParedes + 0.8;
    telhado.castShadow = true;
    grupo.add(telhado);

    criarCaixa(0.7, 1.2, 0.1, 0x7a4a2a, 0, 0.6, lado / 2 + 0.05, grupo); // porta
    for (let andar = 0; andar < andares; andar++) {
      for (const ladoDaJanela of [-1, 1]) {
        criarCaixa(0.6, 0.6, 0.1, COR.janela, ladoDaJanela * lado * 0.3, 1 + andar * 1.8, lado / 2 + 0.05, grupo);   // janela da frente
        criarCaixa(0.1, 0.6, 0.6, COR.janela, ladoDaJanela * (lado / 2 + 0.05), 1 + andar * 1.8, 0, grupo);          // janela lateral
      }
    }

    if (nivel >= 2) { // chaminé com fumaça
      const chamineX = lado * 0.25, chamineY = alturaParedes + 1, chamineZ = -lado * 0.15;
      criarCaixa(0.5, 1.4, 0.5, 0x8a5a44, chamineX, chamineY, chamineZ, grupo);
      for (let i = 0; i < 4; i++) {
        const baforada = new THREE.Mesh(new THREE.SphereGeometry(0.25, 8, 8), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true }));
        grupo.add(baforada);
        animacoes.push(tempo => {
          const progresso = (tempo * 0.3 + i / 4) % 1; // 0 = saindo da chaminé, 1 = sumindo no ar
          baforada.position.set(chamineX + progresso * 0.8, chamineY + 0.8 + progresso * 2.2, chamineZ);
          baforada.scale.setScalar(0.5 + progresso);
          baforada.material.opacity = 0.7 * (1 - progresso);
        });
      }
    }
    if (nivel >= 4) { // varanda
      criarCaixa(lado, 0.15, 1.2, 0x9a6b3f, 0, 0.08, lado / 2 + 0.6, grupo);
      for (const ladoDoPoste of [-1, 1]) criarCaixa(0.12, 1.2, 0.12, 0x9a6b3f, ladoDoPoste * lado * 0.45, 0.6, lado / 2 + 1.1, grupo);
    }
    if (nivel >= 5) { // jardim de flores
      const coresDasFlores = [0xe84a5f, 0xffd23f, 0xff8fb1];
      for (let i = 0; i < 8; i++) {
        criarCaixa(0.22, 0.22, 0.22, coresDasFlores[i % 3], -lado / 2 - 0.8 + (i % 4) * 0.4, 0.15, lado / 2 + 0.4 + Math.floor(i / 4) * 0.5, grupo);
      }
    }
  },

  celeiro(grupo, nivel) {
    const largura = 4 + nivel * 0.6;
    const altura = 2.4 + nivel * 0.2;
    const profundidade = 4.5;
    criarCaixa(largura, altura, profundidade, 0xb23a2e, 0, altura / 2, 0, grupo);                           // paredes
    criarCaixa(1.6, altura * 0.7, 0.1, 0x6b2118, 0, altura * 0.35, profundidade / 2 + 0.05, grupo);        // portão
    criarCaixa(1.7, 0.12, 0.12, 0xffffff, 0, altura * 0.7, profundidade / 2 + 0.1, grupo);                  // detalhe branco

    // telhado de duas águas: prisma triangular (cilindro de 3 lados deitado)
    const raioDoTelhado = (largura + 0.5) / 1.732;
    const telhado = new THREE.Mesh(new THREE.CylinderGeometry(raioDoTelhado, raioDoTelhado, profundidade + 0.5, 3), material(0x6e6e78));
    telhado.rotation.x = -Math.PI / 2;
    telhado.position.y = altura + raioDoTelhado * 0.5;
    telhado.castShadow = true;
    grupo.add(telhado);

    const quantidadeDeFardos = Math.min(nivel - 1, 3);
    for (let i = 0; i < quantidadeDeFardos; i++) {
      const fardo = criarCilindro(0.45, 0.45, 0.8, COR.feno, largura / 2 + 1, 0.45, -1.2 + i * 1.1, grupo);
      fardo.rotation.x = Math.PI / 2;
    }
    if (nivel >= 3) { // silo com cúpula
      criarCilindro(0.9, 0.9, altura + 1.5, COR.cinzaClaro, -largura / 2 - 1.2, (altura + 1.5) / 2, 0, grupo, 16);
      const cupula = new THREE.Mesh(new THREE.SphereGeometry(0.9, 16, 8, 0, Math.PI * 2, 0, Math.PI / 2), material(0x8f98a0));
      cupula.position.set(-largura / 2 - 1.2, altura + 1.5, 0);
      grupo.add(cupula);
    }
    if (nivel >= 5) { // segundo silo e ala extra
      criarCilindro(0.8, 0.8, altura + 0.8, COR.cinzaClaro, -largura / 2 - 1.2, (altura + 0.8) / 2, -1.9, grupo, 16);
      criarCaixa(largura * 0.6, altura * 0.7, 2, 0xb23a2e, 0, altura * 0.35, -profundidade / 2 - 1, grupo);
    }
  },

  animais(grupo, nivel, animacoes) {
    criarCaixa(7.4, 0.05, 6.4, 0x8fc45a, 0, 0.03, 0, grupo); // grama do cercado
    for (let x = -3.5; x <= 3.5; x++) for (const z of [-3.2, 3.2]) criarCaixa(0.14, 0.8, 0.14, COR.madeira, x, 0.4, z, grupo); // postes (frente/trás)
    for (let z = -2.2; z <= 2.3; z += 1.1) for (const x of [-3.5, 3.5]) criarCaixa(0.14, 0.8, 0.14, COR.madeira, x, 0.4, z, grupo); // postes (laterais)
    for (const z of [-3.2, 3.2]) criarCaixa(7.2, 0.1, 0.08, 0xb07a45, 0, 0.55, z, grupo); // travessas
    for (const x of [-3.5, 3.5]) criarCaixa(0.08, 0.1, 6.4, 0xb07a45, x, 0.55, 0, grupo);
    if (nivel >= 3) criarCaixa(1.6, 0.3, 0.5, COR.madeira, 0, 0.15, -2.6, grupo); // cocho

    // posição no array = nível - 1
    const quantidadePorTipo = {
      galinha: [2, 4, 5, 6, 8][nivel - 1],
      porco:   [0, 1, 2, 3, 3][nivel - 1],
      vaca:    [0, 0, 1, 2, 3][nivel - 1],
      ovelha:  [0, 0, 0, 2, 4][nivel - 1],
    };
    for (const tipo in quantidadePorTipo) {
      for (let i = 0; i < quantidadePorTipo[tipo]; i++) {
        criarAnimal(grupo, animacoes, tipo, (Math.random() - 0.5) * 4, (Math.random() - 0.5) * 3);
      }
    }
  },

  maquinario(grupo, nivel, animacoes) {
    if (nivel === 1) { // carrinho de mão
      criarCaixa(0.8, 0.35, 1.1, 0x777777, 0, 0.5, 0, grupo);
      criarCilindro(0.3, 0.3, 0.12, COR.pneu, 0, 0.3, 0.7, grupo).rotation.z = Math.PI / 2;
      criarCaixa(0.1, 0.1, 0.9, COR.madeira, -0.3, 0.7, -0.9, grupo);
      criarCaixa(0.1, 0.1, 0.9, COR.madeira, 0.3, 0.7, -0.9, grupo);
    } else {
      const trator = criarTrator(grupo, 0, 0, 1 + (nivel - 2) * 0.12, 0x3f8f3a);
      animacoes.push(tempo => { trator.position.y = Math.sin(tempo * 40) * 0.01; }); // vibração do motor
      if (nivel >= 3) { // reboque
        criarCaixa(1.6, 0.6, 2.2, 0xc9a24a, 0, 0.7, -2.8, grupo);
        criarRoda(0.4, 0.3, -0.9, 0.4, -3.2, grupo);
        criarRoda(0.4, 0.3, 0.9, 0.4, -3.2, grupo);
      }
    }
    if (nivel >= 4) { // colheitadeira
      criarCaixa(1.8, 1.3, 3, 0xe0b72a, 3.4, 1.2, 1, grupo);
      criarCaixa(1.2, 0.9, 1, COR.vidro, 3.4, 2.2, 0.2, grupo);
      criarCaixa(3, 0.5, 0.8, 0xc43a2a, 3.4, 0.6, 3, grupo);  // plataforma de corte
      criarRoda(0.6, 0.4, 2.6, 0.6, 0.4, grupo);
      criarRoda(0.6, 0.4, 4.2, 0.6, 0.4, grupo);
    }
    if (nivel >= 5) { // cata-vento com hélice girando
      criarCilindro(0.2, 0.45, 4, 0xeeeeee, -3.2, 2, -2.5, grupo);
      const helice = new THREE.Group();
      helice.position.set(-3.2, 4.1, -2.1);
      grupo.add(helice);
      for (let pa = 0; pa < 4; pa++) {
        const bracoDaHelice = new THREE.Group();
        bracoDaHelice.rotation.z = pa * Math.PI / 2;
        criarCaixa(0.25, 1.8, 0.05, 0xffffff, 0, 0.9, 0, bracoDaHelice);
        helice.add(bracoDaHelice);
      }
      animacoes.push(tempo => { helice.rotation.z = tempo * 1.2; });
    }
  },

  plantacao(grupo, nivel, animacoes) {
    const colunas = 3 + nivel;
    const linhas = 2 + nivel;
    criarCaixa(colunas * 1.2 + 0.4, 0.12, linhas * 1.1 + 0.4, 0x7a4f2a, 0, 0.06, 0, grupo); // terra

    for (let coluna = 0; coluna < colunas; coluna++) {
      for (let linha = 0; linha < linhas; linha++) {
        // cada planta fica num grupo próprio para balançar a partir da base
        const planta = new THREE.Group();
        planta.position.set((coluna - (colunas - 1) / 2) * 1.2, 0.12, (linha - (linhas - 1) / 2) * 1.1);
        grupo.add(planta);

        const ehLinhaDeMilho = nivel >= 3 && linha % 2 === 1;
        if (ehLinhaDeMilho) {
          criarCaixa(0.12, 1.1, 0.12, 0x3d8f3a, 0, 0.55, 0, planta);  // caule
          criarCaixa(0.22, 0.32, 0.22, 0xf2c94c, 0, 1.2, 0, planta);  // espiga
        } else {
          const corDoTrigo = nivel === 1 ? 0x7fbf4a : 0xd9b44a;       // verde no início, dourado depois
          for (const deslocamentoX of [-0.2, 0, 0.2]) criarCaixa(0.08, 0.6, 0.08, corDoTrigo, deslocamentoX, 0.3, 0, planta);
        }
        animacoes.push(tempo => { planta.rotation.z = Math.sin(tempo * 1.5 + coluna * 0.5 + linha * 0.3) * 0.07; });
      }
    }

    if (nivel >= 5) { // espantalho + aspersores
      const bordaX = colunas * 0.6 + 0.5;
      criarCaixa(0.1, 2, 0.1, COR.madeira, bordaX, 1, 0, grupo);        // poste
      criarCaixa(1.2, 0.1, 0.1, COR.madeira, bordaX, 1.6, 0, grupo);    // braços
      criarCaixa(0.5, 0.7, 0.3, 0xc0392b, bordaX, 1.2, 0, grupo);       // camisa
      criarCaixa(0.4, 0.4, 0.4, 0xf2c28e, bordaX, 1.9, 0, grupo);       // cabeça
      criarCaixa(0.8, 0.1, 0.8, 0x5a3a1a, bordaX, 2.15, 0, grupo);      // chapéu
      for (const lado of [-1, 1]) {
        criarCilindro(0.08, 0.08, 1, 0x999999, -bordaX, 0.5, lado * linhas * 0.5, grupo, 6);
        criarCaixa(0.3, 0.3, 0.3, 0x4aa3df, -bordaX, 1.1, lado * linhas * 0.5, grupo);
      }
    }
  },
};

// ======================= GRUPOS 3D DAS ÁREAS =======================
const grupoDaArea = {};          // id da área → grupo 3D com os modelos
const animacoesDaArea = {};      // id da área → lista de funções animadas a cada frame

for (const area of AREAS) {
  grupoDaArea[area.id] = new THREE.Group();
  grupoDaArea[area.id].position.set(area.posicao.x, 0, area.posicao.z);
  cena.add(grupoDaArea[area.id]);
}

// Apaga e redesenha uma área de acordo com seu nível atual.
function reconstruirArea(idDaArea) {
  const grupo = grupoDaArea[idDaArea];
  while (grupo.children.length) {
    const modelo = grupo.children[0];
    grupo.remove(modelo);
    modelo.traverse(objeto => { if (objeto.geometry) objeto.geometry.dispose(); });
  }
  animacoesDaArea[idDaArea] = [];
  construtoresDasAreas[idDaArea](grupo, estado.niveis[idDaArea], animacoesDaArea[idDaArea]);
  grupo.userData.progressoDoEfeitoDeEvolucao = 1; // dispara o "pulinho" de crescimento
}
AREAS.forEach(area => reconstruirArea(area.id));

// ======================= CÂMERA E CONTROLES (arrastar, zoom) =======================
let anguloHorizontal = 0.7;
let anguloVertical = 0.85;
let distanciaDaCamera = innerWidth < innerHeight ? 48 : 34;
const DISTANCIA_MINIMA = 14, DISTANCIA_MAXIMA = 60;
const alvoAtualDaCamera = new THREE.Vector3(0, 0, 1);
const alvoDestinoDaCamera = alvoAtualDaCamera.clone();

function focarCameraNaArea(idDaArea) {
  const area = AREAS.find(a => a.id === idDaArea);
  alvoDestinoDaCamera.set(area.posicao.x * 0.7, 0, area.posicao.z * 0.7);
}
function ajustarTamanhoDaTela() {
  renderizador.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener('resize', ajustarTamanhoDaTela);
ajustarTamanhoDaTela();

const dedosNaTela = new Map(); // id do ponteiro → [x, y]
canvas.addEventListener('pointerdown', evento => {
  canvas.setPointerCapture(evento.pointerId);
  dedosNaTela.set(evento.pointerId, [evento.clientX, evento.clientY]);
});
canvas.addEventListener('pointermove', evento => {
  const posicaoAnterior = dedosNaTela.get(evento.pointerId);
  if (!posicaoAnterior) return;
  if (dedosNaTela.size === 1) { // 1 dedo: gira a câmera
    anguloHorizontal -= (evento.clientX - posicaoAnterior[0]) * 0.006;
    anguloVertical = Math.min(1.35, Math.max(0.35, anguloVertical + (evento.clientY - posicaoAnterior[1]) * 0.005));
  } else { // 2 dedos: zoom (pinça)
    const outroDedo = [...dedosNaTela.entries()].find(([id]) => id !== evento.pointerId)[1];
    const distanciaAntes = Math.hypot(posicaoAnterior[0] - outroDedo[0], posicaoAnterior[1] - outroDedo[1]);
    const distanciaAgora = Math.hypot(evento.clientX - outroDedo[0], evento.clientY - outroDedo[1]);
    distanciaDaCamera = Math.min(DISTANCIA_MAXIMA, Math.max(DISTANCIA_MINIMA, distanciaDaCamera * distanciaAntes / distanciaAgora));
  }
  dedosNaTela.set(evento.pointerId, [evento.clientX, evento.clientY]);
});
['pointerup', 'pointercancel'].forEach(nome => canvas.addEventListener(nome, evento => dedosNaTela.delete(evento.pointerId)));
canvas.addEventListener('wheel', evento => {
  distanciaDaCamera = Math.min(DISTANCIA_MAXIMA, Math.max(DISTANCIA_MINIMA, distanciaDaCamera + evento.deltaY * 0.03));
});

// ======================= LOOP PRINCIPAL (roda a cada frame) =======================
const relogio = new THREE.Clock();
function animarCena() {
  requestAnimationFrame(animarCena);
  const tempoDesdeUltimoFrame = Math.min(relogio.getDelta(), 0.05);
  const tempoTotal = relogio.elapsedTime;

  for (const idDaArea in animacoesDaArea) for (const animar of animacoesDaArea[idDaArea]) animar(tempoTotal);

  for (const idDaArea in grupoDaArea) { // "pulinho" ao evoluir: cresce 20% e volta ao normal
    const grupo = grupoDaArea[idDaArea];
    if (grupo.userData.progressoDoEfeitoDeEvolucao > 0) {
      grupo.userData.progressoDoEfeitoDeEvolucao = Math.max(0, grupo.userData.progressoDoEfeitoDeEvolucao - tempoDesdeUltimoFrame * 1.5);
      grupo.scale.setScalar(1 + 0.2 * Math.sin(grupo.userData.progressoDoEfeitoDeEvolucao * Math.PI));
    }
  }
  nuvens.forEach(nuvem => { nuvem.position.x += tempoDesdeUltimoFrame * 0.6; if (nuvem.position.x > 38) nuvem.position.x = -38; });

  alvoAtualDaCamera.lerp(alvoDestinoDaCamera, 0.06); // movimento suave até a área focada
  camera.position.set(
    alvoAtualDaCamera.x + distanciaDaCamera * Math.cos(anguloVertical) * Math.sin(anguloHorizontal),
    distanciaDaCamera * Math.sin(anguloVertical),
    alvoAtualDaCamera.z + distanciaDaCamera * Math.cos(anguloVertical) * Math.cos(anguloHorizontal)
  );
  camera.lookAt(alvoAtualDaCamera);
  renderizador.render(cena, camera);
}
animarCena();

// ======================= INTERFACE (XP, cards, avisos) =======================
let temporizadorDoAviso;
function mostrarAviso(mensagem) {
  const elementoAviso = selecionar('#aviso');
  elementoAviso.textContent = mensagem;
  elementoAviso.style.opacity = 1;
  clearTimeout(temporizadorDoAviso);
  temporizadorDoAviso = setTimeout(() => { elementoAviso.style.opacity = 0; }, 2200);
}

function evoluirArea(idDaArea) {
  const nivelAtual = estado.niveis[idDaArea];
  const custo = CUSTO_PARA_PROXIMO_NIVEL[nivelAtual - 1];
  if (nivelAtual >= NIVEL_MAXIMO || estado.xp < custo) return;

  estado.xp -= custo;
  estado.niveis[idDaArea]++;
  salvarProgresso();
  reconstruirArea(idDaArea);
  focarCameraNaArea(idDaArea);
  desenharCards();
  const nomeDaArea = AREAS.find(a => a.id === idDaArea).nome;
  mostrarAviso(nomeDaArea + ' evoluiu para o nível ' + (nivelAtual + 1) + '! 🎉');
}

function desenharCards() {
  const listaDeCards = selecionar('#lista-cards');
  const rolagemAnterior = listaDeCards.scrollLeft; // mantém a posição da rolagem ao redesenhar
  selecionar('#valor-xp').textContent = estado.xp;

  listaDeCards.innerHTML = AREAS.map(area => {
    const nivel = estado.niveis[area.id];
    const estaNoMaximo = nivel >= NIVEL_MAXIMO;
    const custo = CUSTO_PARA_PROXIMO_NIVEL[nivel - 1];
    const botaoDesativado = estaNoMaximo || estado.xp < custo;
    const textoDoBotao = estaNoMaximo ? 'Nível máximo' : 'Evoluir · ' + custo + ' XP';
    return `<div class="card" onclick="focarCameraNaArea('${area.id}')">
      <div>${area.icone} <b>${area.nome}</b></div>
      <div class="pontos-nivel">${'●'.repeat(nivel) + '○'.repeat(NIVEL_MAXIMO - nivel)}</div>
      <button ${botaoDesativado ? 'disabled' : ''} onclick="event.stopPropagation(); evoluirArea('${area.id}')">${textoDoBotao}</button>
    </div>`;
  }).join('');
  listaDeCards.scrollLeft = rolagemAnterior;
}

// O sistema de atividades deve chamar window.adicionarXP(quantidade) para creditar XP.
window.adicionarXP = quantidade => { estado.xp += quantidade; salvarProgresso(); desenharCards(); };
selecionar('#botao-teste-xp').onclick = () => window.adicionarXP(50);
desenharCards();
</script></body></html>
