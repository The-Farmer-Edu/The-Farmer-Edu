<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Minha Fazenda 3D</title>
  <style>
    :root {
      --fundo-card: #fffdf5;
      --texto: #3b2a1a;
      --destaque: #4a8f3a;
      --desativado: #a89a82
    }

    @media(prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --fundo-card: #2b3424;
        --texto: #f1e8d0;
        --destaque: #7fc15f;
        --desativado: #6f7a62
      }
    }

    :root[data-theme="dark"] {
      --fundo-card: #2b3424;
      --texto: #f1e8d0;
      --destaque: #7fc15f;
      --desativado: #6f7a62
    }

    html,
    body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #9fd8f5;
      font-family: system-ui, sans-serif
    }

    canvas {
      position: fixed;
      inset: 0;
      display: block;
      z-index: 0;
      touch-action: none
    }

    #barra-topo {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: calc(env(safe-area-inset-top, 0px) + 10px) 12px 8px;
      z-index: 10;
      pointer-events: none
    }

    #barra-topo>* {
      pointer-events: auto;
      background: var(--fundo-card);
      color: var(--texto);
      border-radius: 20px;
      padding: 8px 14px;
      font-size: 15px;
      box-shadow: 0 2px 8px #0003;
      border: 0
    }

    #lista-cards {
      position: fixed;
      z-index: 10;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 8px 12px calc(env(safe-area-inset-bottom, 0px) + 10px)
    }

    .card {
      flex: 0 0 150px;
      background: var(--fundo-card);
      color: var(--texto);
      border-radius: 14px;
      padding: 10px;
      box-shadow: 0 2px 8px #0003
    }

    .pontos-nivel {
      letter-spacing: 2px;
      color: var(--destaque);
      margin: 4px 0 8px;
      font-size: 13px
    }

    .card button {
      width: 100%;
      min-height: 36px;
      border: 0;
      border-radius: 10px;
      background: var(--destaque);
      color: #fff;
      font-weight: 600;
      font-size: 13px
    }

    .card button:disabled {
      background: var(--desativado);
      opacity: .7
    }

    #atalhos {
      display: flex;
      gap: 2px;
      padding: 3px 5px !important
    }

    #atalhos button {
      background: none;
      border: 0;
      color: inherit;
      font-size: 18px;
      padding: 4px 9px;
      border-radius: 14px;
      cursor: pointer
    }

    #atalhos button.ativo {
      background: var(--destaque)
    }

    .painel {
      position: fixed;
      z-index: 12;
      top: calc(env(safe-area-inset-top, 0px) + 58px);
      left: 50%;
      transform: translateX(-50%);
      width: min(92vw, 330px);
      max-height: calc(100vh - 190px);
      overflow-y: auto;
      box-sizing: border-box;
      background: var(--fundo-card);
      color: var(--texto);
      border-radius: 16px;
      padding: 12px 14px;
      box-shadow: 0 4px 16px #0005;
      font-size: 13px
    }

    .painel[hidden] {
      display: none
    }

    .painel h3 {
      margin: 0 0 8px;
      font-size: 14px
    }

    .painel .estado {
      margin: 0 0 8px;
      font-weight: 600;
      color: var(--destaque)
    }

    .painel .seg {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px
    }

    .painel button.botao {
      min-height: 36px;
      border: 0;
      border-radius: 10px;
      background: var(--desativado);
      color: #fff;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer
    }

    .painel button.botao.ativo {
      background: var(--destaque)
    }

    .painel button.botao:disabled {
      opacity: .5;
      cursor: default
    }

    .linha-audio {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 2px 10px;
      align-items: center;
      margin: 10px 0 0
    }

    .linha-audio label {
      font-weight: 600;
      display: flex;
      gap: 6px;
      align-items: center
    }

    .linha-audio input[type=range] {
      width: 100%
    }

    .linha-audio small {
      grid-column: 1 / -1;
      opacity: .75
    }

    #aviso {
      position: fixed;
      z-index: 11;
      left: 50%;
      top: 70px;
      transform: translateX(-50%);
      background: var(--fundo-card);
      color: var(--texto);
      padding: 10px 16px;
      border-radius: 20px;
      box-shadow: 0 2px 10px #0004;
      opacity: 0;
      transition: opacity .3s;
      pointer-events: none;
      font-size: 14px;
      text-align: center
    }
  </style>
</head>

<body>
  <div id="barra-topo"><b>⭐ <span id="valor-xp">0</span> XP</b>
    <div id="atalhos"><button id="botao-ceu" title="Dia e noite" aria-label="Dia e noite">🌗</button><button id="botao-audio" title="Áudio" aria-label="Áudio">🔊</button></div>
    <button id="botao-teste-xp">+5000 XP (teste)</button>
  </div>
  <div id="painel-ceu" class="painel" hidden>
    <h3>🌗 Dia e noite</h3>
    <p class="estado" id="ceu-status">Modo: Automático</p>
    <div class="seg">
      <button class="botao" data-modo="auto">▶ Automático</button>
      <button class="botao" data-modo="pausa">⏸ Pausar</button>
      <button class="botao" data-modo="dia">☀️ Dia fixo</button>
      <button class="botao" data-modo="noite">🌙 Noite fixa</button>
    </div>
  </div>
  <div id="painel-audio" class="painel" hidden>
    <h3>🔊 Áudio</h3>
    <button class="botao" id="audio-ativar" style="width:100%">Ativar áudio</button>
    <div id="audio-linhas"></div>
  </div>
  <div id="lista-cards"></div>
  <div id="aviso"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    const selecionar = seletor => document.querySelector(seletor);

    // ======================= CONFIGURAÇÃO DO JOGO =======================
    const AREAS = [
      { id: 'curral', nome: 'Curral das vacas', icone: '🐄', posicao: { x: 7, z: 6 } },
      { id: 'ovelhal', nome: 'Ovelhal', icone: '🐑', posicao: { x: 7, z: 21 } },
      { id: 'casa', nome: 'Casa', icone: '🏠', posicao: { x: -8, z: -9 } },
      { id: 'celeiro', nome: 'Celeiro', icone: '🛖', posicao: { x: 7, z: -9 } },
      { id: 'maquinario', nome: 'Maquinário', icone: '🚜', posicao: { x: -8, z: 6 } },
      { id: 'plantacao', nome: 'Plantação', icone: '🥬', posicao: { x: 35, z: -8 } },
      { id: 'plantacaoGrande', nome: 'Grande plantação', icone: '🌾', posicao: { x: 43, z: 12 } },
      { id: 'galinheiro', nome: 'Galinheiro', icone: '🐔', posicao: { x: 19, z: 6 } },
      { id: 'chiqueiro', nome: 'Chiqueiro', icone: '🐖', posicao: { x: 19, z: -9 } },
      { id: 'estabulo', nome: 'Estábulo', icone: '🐎', posicao: { x: 19, z: 21 } },
      { id: 'ponte', nome: 'Ponte do rio', icone: '🌉', posicao: { x: -20.4, z: -1 } },
    ];
    const NIVEL_MAXIMO = 3;
    const CUSTO_PARA_PROXIMO_NIVEL = [100, 250]; // posição 0 = custo do nível 1 → 2
    const COR = { madeira: 0x8a5a2a, ripa: 0xb07a45, janela: 0xffe08a, vidro: 0xbfe3f2, feno: 0xe8c04a, pneu: 0x222222, telhaCasa: 0xd9532f, branco: 0xf2f2ea };

    // ======================= PROGRESSO (XP E NÍVEIS) =======================
    const CHAVE_SALVAMENTO = 'fazenda3d-progresso-v3';
    let estado = { xp: 0, niveis: Object.fromEntries(AREAS.map(a => [a.id, 1])) };
    try {
      const salvo = JSON.parse(localStorage.getItem(CHAVE_SALVAMENTO));
      if (salvo && salvo.niveis) {
        estado = salvo;
        for (const id in estado.niveis) estado.niveis[id] = Math.min(NIVEL_MAXIMO, Math.max(1, estado.niveis[id] | 0));
      }
    } catch (erro) { }
    // Compatibilidade com saves antigos: as áreas novas começam no nível 1.
    if (!estado.niveis) estado.niveis = {};
    for (const area of AREAS) {
      const nivelSalvo = Number(estado.niveis[area.id]);
      estado.niveis[area.id] = Number.isFinite(nivelSalvo) ? Math.min(NIVEL_MAXIMO, Math.max(1, nivelSalvo | 0)) : 1;
    }
    if (!Number.isFinite(estado.xp)) estado.xp = 0;
    function salvarProgresso() { try { localStorage.setItem(CHAVE_SALVAMENTO, JSON.stringify(estado)); } catch (erro) { } }

    // ======================= CENA 3D BÁSICA =======================
    const renderizador = new THREE.WebGLRenderer({ antialias: true });
    const canvas = renderizador.domElement;
    renderizador.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderizador.shadowMap.enabled = true;
    document.body.prepend(canvas);

    const cena = new THREE.Scene();
    cena.background = new THREE.Color(0x9fd8f5);
    cena.fog = new THREE.Fog(0x9fd8f5, 110, 260);
    const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 400);
    const luzHemisferio = new THREE.HemisphereLight(0xffffff, 0x6a8f4a, 0.75); cena.add(luzHemisferio);
    // materiais sem iluminação (água da cachoeira, névoa, gotas…) são escurecidos pelo ciclo dia/noite
    const MATERIAIS_DE_BRILHO = [];
    const brilhoNoturno = m => { m.userData.base = m.color.clone(); MATERIAIS_DE_BRILHO.push(m); return m; };
    const sol = new THREE.DirectionalLight(0xfff2cc, 0.9);
    sol.position.set(26, 24, 18); sol.target.position.set(12, 0, 6); cena.add(sol.target);
    sol.castShadow = true;
    sol.shadow.mapSize.set(2048, 2048);
    Object.assign(sol.shadow.camera, { left: -44, right: 44, top: 44, bottom: -44, near: 1, far: 100 });
    cena.add(sol);
    const luaLuz = new THREE.DirectionalLight(0x9db8ff, 0); luaLuz.target = sol.target; cena.add(luaLuz); // luar (sem sombras)

    // ======================= FUNÇÕES AUXILIARES DE MODELAGEM =======================
    const cacheDeMateriais = {};

    function criarTexturaProcedural(cor) {
      const tamanho = 128;
      const canvasTextura = document.createElement('canvas');
      canvasTextura.width = canvasTextura.height = tamanho;
      const ctx = canvasTextura.getContext('2d');

      ctx.fillStyle = '#' + cor.toString(16).padStart(6, '0');
      ctx.fillRect(0, 0, tamanho, tamanho);

      let semente = cor || 1;
      function aleatorio() {
        semente = (semente * 1664525 + 1013904223) >>> 0;
        return semente / 4294967296;
      }

      for (let i = 0; i < 450; i++) {
        const alpha = 0.04 + aleatorio() * 0.13;
        ctx.fillStyle = aleatorio() > 0.5
          ? `rgba(255,255,255,${alpha})`
          : `rgba(0,0,0,${alpha})`;
        ctx.beginPath();
        ctx.arc(aleatorio() * tamanho, aleatorio() * tamanho, 1 + aleatorio() * 5, 0, Math.PI * 2);
        ctx.fill();
      }

      const textura = new THREE.CanvasTexture(canvasTextura);
      textura.wrapS = textura.wrapT = THREE.RepeatWrapping;
      textura.repeat.set(2, 2);
      return textura;
    }

    function material(cor, textura = false) {
      if (!cacheDeMateriais[cor]) {
        cacheDeMateriais[cor] = new THREE.MeshLambertMaterial({
          color: cor
        });
        if(textura) {
          cacheDeMateriais[cor].map = criarTexturaProcedural(cor)
        }
      }

      return cacheDeMateriais[cor];
    }
    function criarCaixa(largura, altura, profundidade, cor, x, y, z, pai) {
      const caixa = new THREE.Mesh(new THREE.BoxGeometry(largura, altura, profundidade), material(cor));
      caixa.position.set(x, y, z);
      caixa.castShadow = caixa.receiveShadow = true;
      pai.add(caixa);
      return caixa;
    }
    function criarCilindro(raioTopo, raioBase, altura, cor, x, y, z, pai, segmentos = 14) {
      const c = new THREE.Mesh(new THREE.CylinderGeometry(raioTopo, raioBase, altura, segmentos), material(cor));
      c.position.set(x, y, z);
      c.castShadow = true;
      pai.add(c);
      return c;
    }
    function criarEsfera(raio, cor, x, y, z, pai, escalaY = 1) {
      const e = new THREE.Mesh(new THREE.SphereGeometry(raio, 8, 6), material(cor));
      e.position.set(x, y, z);
      e.scale.y = escalaY;
      e.castShadow = true;
      pai.add(e);
      return e;
    }
    function criarRoda(raio, largura, x, y, z, pai, aro) {
      const roda = criarCilindro(raio, raio, largura, COR.pneu, x, y, z, pai);
      roda.rotation.z = Math.PI / 2;
      if (aro) criarCilindro(raio * 0.55, raio * 0.55, largura + 0.04, aro, x, y, z, pai).rotation.z = Math.PI / 2;
    }
    // base de grama sob cada área (como nas ilustrações isométricas)
    function base(g, largura, profundidade, cor = 0x8fd05a) { criarCaixa(largura, 0.15, profundidade, cor, 0, 0.02, 0, g); }
    // telhado de duas águas (prisma). largura = vão entre as águas; comprimento = ao longo do cume.
    function telhado(g, largura, comprimento, altura, cor, x, y, z, giro = 0) {
      const r = altura / 1.5;
      const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, comprimento, 3), material(cor));
      m.rotation.x = -Math.PI / 2;
      m.scale.x = largura / (r * 1.732);
      m.position.y = r / 2;
      m.castShadow = true;
      const p = new THREE.Group();
      p.add(m);
      p.position.set(x, y, z);
      p.rotation.y = giro;
      g.add(p);
    }
    function cercaLinha(g, x1, z1, x2, z2) {
      const comp = Math.hypot(x2 - x1, z2 - z1), n = Math.ceil(comp), ang = Math.atan2(x2 - x1, z2 - z1);
      for (let i = 0; i <= n; i++) criarCaixa(0.14, 0.8, 0.14, COR.madeira, x1 + (x2 - x1) * i / n, 0.5, z1 + (z2 - z1) * i / n, g);
      for (const y of [0.68, 0.42]) criarCaixa(0.07, 0.09, comp, COR.ripa, (x1 + x2) / 2, y, (z1 + z2) / 2, g).rotation.y = ang;
    }
    function portao(g, cx, z, larg = 1.7) { // portão fechado de duas folhas, com mourões altos e travessa em diagonal
      const mad = 0xb9824a;
      for (const sd of [-1, 1]) { criarCaixa(0.18, 1.15, 0.18, COR.madeira, cx + sd * larg / 2, 0.58, z, g); criarEsfera(0.1, 0xc98a4a, cx + sd * larg / 2, 1.22, z, g); }
      const f = larg / 2 - 0.14, ang = Math.atan2(0.35, f);
      for (const sd of [-1, 1]) {
        const x = cx + sd * (f / 2 + 0.07);
        for (const y of [0.4, 0.75]) criarCaixa(f, 0.09, 0.06, mad, x, y, z, g);
        for (const e of [-1, 1]) criarCaixa(0.07, 0.44, 0.06, mad, x + e * (f / 2 - 0.035), 0.575, z, g);
        criarCaixa(Math.hypot(f, 0.35), 0.06, 0.05, mad, x, 0.575, z + 0.01, g).rotation.z = -sd * ang;
      }
    }
    // portoes: { N: deslocamentoX, S: deslocamentoX } abre uma passagem de 1,7 na cerca norte (z−) ou sul (z+)
    function cerca(g, w, d, portoes = {}) {
      const horiz = (z, ox) => ox === undefined ? cercaLinha(g, -w / 2, z, w / 2, z) : (cercaLinha(g, -w / 2, z, ox - 0.85, z), cercaLinha(g, ox + 0.85, z, w / 2, z));
      horiz(-d / 2, portoes.N); horiz(d / 2, portoes.S);
      if (portoes.N !== undefined) portao(g, portoes.N, -d / 2);
      if (portoes.S !== undefined) portao(g, portoes.S, d / 2);
      cercaLinha(g, -w / 2, -d / 2, -w / 2, d / 2); cercaLinha(g, w / 2, -d / 2, w / 2, d / 2);
    }
    // Cerca retangular regular: postes igualmente espaçados, trilhos exatos entre os cantos; portão central opcional.
    function cercaRetangular(g, w, d, portoes = []) {
      const trecho = (x1, z1, x2, z2, fim) => {
        const L = Math.hypot(x2 - x1, z2 - z1), n = Math.max(1, Math.round(L / 1.1)), horiz = Math.abs(x2 - x1) > Math.abs(z2 - z1);
        for (let i = 0; i < n + (fim ? 1 : 0); i++) criarCaixa(0.14, 0.85, 0.14, COR.madeira, x1 + (x2 - x1) * i / n, 0.43, z1 + (z2 - z1) * i / n, g);
        for (const y of [0.4, 0.7]) criarCaixa(horiz ? L : 0.07, 0.09, horiz ? 0.07 : L, COR.ripa, (x1 + x2) / 2, y, (z1 + z2) / 2, g);
      };
      const lado = (x1, z1, x2, z2, aberto) => {
        if (!aberto) return trecho(x1, z1, x2, z2, false);
        const mx = 0.85 * Math.sign(x2 - x1);
        trecho(x1, z1, -mx, z2, true); trecho(mx, z1, x2, z2, false);
        portao(g, 0, z1);
      };
      lado(-w / 2, -d / 2, w / 2, -d / 2, portoes.includes('N')); trecho(w / 2, -d / 2, w / 2, d / 2, false);
      lado(w / 2, d / 2, -w / 2, d / 2, portoes.includes('S')); trecho(-w / 2, d / 2, -w / 2, -d / 2, false);
    }
    function arvore (g, x, z, s = 1, y = 0) { // árvore de montanha (3 cones empilhados)
      criarCilindro(0.12 * s, 0.18 * s, 1.1 * s, 0x6b4a2b, x, y + 0.55 * s, z, g, 6);
      [[1.1, 1.5, 1.4], [0.85, 1.3, 2.2], [0.55, 1.1, 3.0]].forEach(([r, h, yy], i) => {
      const c = new THREE.Mesh(new THREE.ConeGeometry(r * s, h * s, 7), material(i % 2 ? 0x2f7a4a : 0x2a6b40));
      c.position.set(x, y + yy * s, z); c.castShadow = true; g.add(c);
      });
    }

const cacheDePlano = {};
function materialPlano(cor) { // faces "facetadas" (visual low-poly) para montanhas
  return cacheDePlano[cor] || (cacheDePlano[cor] = new THREE.MeshLambertMaterial({ color: cor, flatShading: true }));
}
function pinheiro(g, x, z, s = 1, y = 0) { // árvore de montanha (3 cones empilhados)
  criarCilindro(0.12 * s, 0.18 * s, 1.1 * s, 0x6b4a2b, x, y + 0.55 * s, z, g, 6);
  [[1.1, 1.5, 1.4], [0.85, 1.3, 2.2], [0.55, 1.1, 3.0]].forEach(([r, h, yy], i) => {
    const c = new THREE.Mesh(new THREE.ConeGeometry(r * s, h * s, 7), material(i % 2 ? 0x2f7a4a : 0x2a6b40));
    c.position.set(x, y + yy * s, z); c.castShadow = true; g.add(c);
  });
}
function capim(g, x, z) {
  for (let i = 0; i < 4; i++) criarCaixa(0.05, 0.55, 0.05, 0x4f9e3a, x + (i - 1.5) * 0.08, 0.27, z + (i % 2) * 0.06, g).rotation.z = (i - 1.5) * 0.18;
}
    function arbusto(g, x, z, flores = true) {
      criarEsfera(0.4, 0x4a9e3a, x, 0.35, z, g, 0.8);
      if (flores) [0xe84a5f, 0xffd23f, 0xff8fb1].forEach((c, i) => criarCaixa(0.12, 0.12, 0.12, c, x + (i - 1) * 0.22, 0.6, z + 0.25, g));
    }
    function pedra(g, x, z, s = 0.4) {
      const p = new THREE.Mesh(new THREE.DodecahedronGeometry(s), material(0xb4b4aa));
      p.position.set(x, s * 0.5, z); p.scale.y = 0.7; p.castShadow = true; g.add(p);
    }
    function criarMontanha(x, z, largura, altura, profundidade, cor) {
      const montanha = new THREE.Mesh(
        new THREE.ConeGeometry(largura, altura, 5),
        material(cor, true)
      );
      montanha.position.set(x, altura / 2 - 0.2, z);
      montanha.scale.z = profundidade / largura;
      montanha.castShadow = true;
      montanha.receiveShadow = true;
      cena.add(montanha);
    }

    function criarLago(x, z, largura, profundidade) {
      const agua = new THREE.Mesh(
        new THREE.CircleGeometry(1, 32),
        new THREE.MeshLambertMaterial({
          color: 0x55bddd,
          transparent: true,
          opacity: 0.88
        })
      );
      agua.rotation.x = -Math.PI / 2;
      agua.position.set(x, 0.07, z);
      agua.scale.set(largura, profundidade, 1);
      cena.add(agua);

      for (let i = 0; i < 36; i++) {
        const angulo = (i / 36) * Math.PI * 2;
        pedra(
          cena,
          x + Math.cos(angulo) * largura * 0.95,
          z + Math.sin(angulo) * profundidade * 0.95,
          0.3
        );
      }
    }

    function criarCachoeira() {
      const rocha = new THREE.Mesh(
        new THREE.ConeGeometry(9, 18, 5),
        material(0x777d70)
      );
      rocha.position.set(-24, 8.8, -36);

    function posicaoEstaLivre(cercado, animalAtual, x, z, raio) {
      if (Math.abs(x) > cercado.limiteX - raio || Math.abs(z) > cercado.limiteZ - raio) return false; // cerca
      for (const o of cercado.obstaculos) { // retângulos (abrigo, cocho...)
        const pontoMaisProximoX = Math.min(o.maxX, Math.max(o.minX, x));
        const pontoMaisProximoZ = Math.min(o.maxZ, Math.max(o.minZ, z));
        if (Math.hypot(x - pontoMaisProximoX, z - pontoMaisProximoZ) < raio) return false;

      alvoDestinoDaCamera.set(area.posicao.x, 0, area.posicao.z);
      let zoomInterval = setInterval((e) => {
        if (distanciaDaCamera > 20) {
          distanciaDaCamera -= 2;
        } else if (anguloHorizontal > -0.38600000000000023) {
          anguloHorizontal -= 0.05;
          if (anguloVertical > 0.38499999999999956) {
            anguloVertical -= 0.05;
          }
        } else {
          clearInterval(zoomInterval);
        }
      }, 10);
    }
    // Inclinação vertical contínua: arrastar para baixo/cima primeiro move a câmera (órbita), e ao chegar na elevação
    // mínima passa a inclinar o olhar para o céu (rotação real da câmera, sem entrar no chão). delta > 0 = olhar mais para baixo.
    function ajustarInclinacao(delta) {
      if (!delta) return;
      jogadorMexeu = true;
      if (delta > 0) {
        const r = Math.min(olharParaCima, delta); olharParaCima -= r; delta -= r;
        anguloVertical = Math.min(ELEVACAO_MAXIMA, anguloVertical + delta);
      } else {
        const r = Math.min(anguloVertical - ELEVACAO_MINIMA, -delta); anguloVertical -= r; delta += r;
        olharParaCima = Math.min(OLHAR_MAXIMO, olharParaCima - delta);
      }
    }
    function posicionarCamera() {
      camera.position.set(
        alvoAtualDaCamera.x + distanciaDaCamera * Math.cos(anguloVertical) * Math.sin(anguloHorizontal),
        alvoAtualDaCamera.y + distanciaDaCamera * Math.sin(anguloVertical), // acompanha a altura do alvo (Espaço/Ctrl)
        alvoAtualDaCamera.z + distanciaDaCamera * Math.cos(anguloVertical) * Math.cos(anguloHorizontal)
      );
      camera.lookAt(alvoAtualDaCamera);
      if (olharParaCima) camera.rotateX(olharParaCima);
    }
    // Posição inicial fixa (alvo, ângulos e altura); só a distância muda conforme a tela (retrato precisa de mais recuo).
    // Câmera a ~22 de altura sobre o gramado: acima de qualquer árvore/edifício e fora de montanhas.
    function enquadrarInicio() { distanciaDaCamera = camera.aspect < 0.9 ? 66 : 47; }
    function ajustarTamanhoDaTela() {
      renderizador.setSize(innerWidth, innerHeight);
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      if (!jogadorMexeu) enquadrarInicio();
    }
    addEventListener('resize', ajustarTamanhoDaTela);
    ajustarTamanhoDaTela();

    const dedosNaTela = new Map();
    canvas.addEventListener('pointerdown', e => { jogadorMexeu = true; canvas.setPointerCapture(e.pointerId); dedosNaTela.set(e.pointerId, [e.clientX, e.clientY]); });
    canvas.addEventListener('pointermove', e => {
      const anterior = dedosNaTela.get(e.pointerId);
      if (!anterior) return;
      if (dedosNaTela.size === 1) {
        anguloHorizontal -= (e.clientX - anterior[0]) * 0.006;
        ajustarInclinacao((e.clientY - anterior[1]) * 0.005);
      } else {
        const outro = [...dedosNaTela.entries()].find(([id]) => id !== e.pointerId)[1];
        const antes = Math.hypot(anterior[0] - outro[0], anterior[1] - outro[1]);
        const agora = Math.hypot(e.clientX - outro[0], e.clientY - outro[1]);
        distanciaDaCamera = Math.min(DISTANCIA_MAXIMA, Math.max(DISTANCIA_MINIMA, distanciaDaCamera * antes / agora));
      }
      dedosNaTela.set(e.pointerId, [e.clientX, e.clientY]);
    });
    ['pointerup', 'pointercancel'].forEach(nome => canvas.addEventListener(nome, e => dedosNaTela.delete(e.pointerId)));
    canvas.addEventListener('wheel', e => { jogadorMexeu = true; distanciaDaCamera = Math.min(DISTANCIA_MAXIMA, Math.max(DISTANCIA_MINIMA, distanciaDaCamera + e.deltaY * 0.03)); });

    // ======================= MOVIMENTO WASD DO ALVO DA CÂMERA =======================
    const teclas = { KeyW: false, KeyA: false, KeyS: false, KeyD: false, ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false, Space: false, ControlLeft: false, ControlRight: false, KeyC: false };
    const ALTURA_MAXIMA_DO_ALVO = 45, VELOCIDADE_VERTICAL = 14; // Espaço sobe · Ctrl (ou C) desce
    const LIMITE_DO_MAPA = 75;       // limite reduzido para acompanhar o mapa compacto
    const VELOCIDADE_BASE = 0.6;     // unidades/s para cada unidade de distância da câmera
    const VELOCIDADE_COM_SHIFT = 1.8; // multiplicador ao segurar Shift

    addEventListener('keydown', e => {
      if (e.code in teclas) {
        jogadorMexeu = true; teclas[e.code] = true; e.preventDefault();
        if (e.code === 'Space' && document.activeElement && document.activeElement.blur) document.activeElement.blur(); // Espaço não aciona o botão focado
      }
    });
    addEventListener('keyup', e => { if (e.code in teclas) { teclas[e.code] = false; if (e.code === 'Space') e.preventDefault(); } });
    addEventListener('blur', () => { for (const k in teclas) teclas[k] = false; }); // evita tecla "presa" ao trocar de aba

    const frente = new THREE.Vector3(), direita = new THREE.Vector3(), deslocamento = new THREE.Vector3();

    function atualizarMovimento(dt, shift) {
      anguloHorizontal += ((teclas.ArrowLeft ? 1 : 0) - (teclas.ArrowRight ? 1 : 0)) * 1.4 * dt;   // setas: girar e inclinar
      ajustarInclinacao(((teclas.ArrowDown ? 1 : 0) - (teclas.ArrowUp ? 1 : 0)) * 1.2 * dt);
      const vertical = (teclas.Space ? 1 : 0) - ((teclas.ControlLeft || teclas.ControlRight || teclas.KeyC) ? 1 : 0);
      if (vertical) for (const alvo of [alvoDestinoDaCamera, alvoAtualDaCamera]) // altura do alvo ≥ 0: a câmera nunca desce abaixo do chão
        alvo.y = Math.max(0, Math.min(ALTURA_MAXIMA_DO_ALVO, alvo.y + vertical * VELOCIDADE_VERTICAL * (shift ? VELOCIDADE_COM_SHIFT : 1) * dt));
      let avanco = (teclas.KeyW ? 1 : 0) - (teclas.KeyS ? 1 : 0);
      let lateral = (teclas.KeyD ? 1 : 0) - (teclas.KeyA ? 1 : 0);
      if (!avanco && !lateral) return;

      // A câmera fica em (sin h, cos h) em relação ao alvo, então "para frente" é o oposto disso
      frente.set(-Math.sin(anguloHorizontal), 0, -Math.cos(anguloHorizontal));
      direita.set(Math.cos(anguloHorizontal), 0, -Math.sin(anguloHorizontal));

      deslocamento.set(0, 0, 0).addScaledVector(frente, avanco).addScaledVector(direita, lateral);
      deslocamento.normalize(); // diagonal não fica mais rápida

      // Quanto mais longe a câmera, mais rápido anda (sensação constante na tela)
      const velocidade = distanciaDaCamera * VELOCIDADE_BASE * (shift ? VELOCIDADE_COM_SHIFT : 1);
      deslocamento.multiplyScalar(velocidade * dt);

      // Move destino e atual juntos: resposta imediata e sem brigar com o focarCameraNaArea
      for (const alvo of [alvoDestinoDaCamera, alvoAtualDaCamera]) {
        alvo.add(deslocamento);
        alvo.x = Math.max(-LIMITE_DO_MAPA, Math.min(LIMITE_DO_MAPA, alvo.x));
        alvo.z = Math.max(-LIMITE_DO_MAPA, Math.min(LIMITE_DO_MAPA, alvo.z));
      }
    }
    let shiftPressionado = false;
    addEventListener('keydown', e => { if (e.key === 'Shift') shiftPressionado = true; });
    addEventListener('keyup', e => { if (e.key === 'Shift') shiftPressionado = false; });

    // ======================= CONFIGURAÇÃO DOS ÁUDIOS — ADICIONE SEUS ARQUIVOS AQUI =======================
    // Nenhum arquivo de áudio acompanha o jogo: coloque os seus nestes caminhos (relativos a este HTML) ou edite os caminhos abaixo.
    // Se um arquivo não existir, o jogo continua normalmente: aquele som fica "indisponível" e o painel avisa. Nada é simulado.
    const AUDIO_CONFIG = {
      musica: { arquivo: 'assets/audio/musica-fundo.mp3', volume: 0.5 },                              // trilha sonora de fundo (em loop)
      animais: {
        volume: 0.7,                    // volume inicial da categoria "Animais"
        intervaloEntreSons: [4, 11],    // segundos (mín., máx.) entre dois sons de animais quaisquer
        maxSimultaneos: 2,              // no máximo dois animais fazendo barulho ao mesmo tempo
        tipos: {                        // arquivo · volume relativo · intervalo (s) entre sons do MESMO tipo · alcance (distância da câmera)
          vaca: { arquivo: 'assets/audio/animais/vaca.mp3', volume: 1.0, intervalo: [20, 45], alcance: 80 },        // mugido
          galinha: { arquivo: 'assets/audio/animais/galinha.mp3', volume: 0.8, intervalo: [12, 30], alcance: 60 },  // cacarejo
          ovelha: { arquivo: 'assets/audio/animais/ovelha.mp3', volume: 0.9, intervalo: [18, 40], alcance: 70 },    // balido
          porco: { arquivo: 'assets/audio/animais/porco.mp3', volume: 0.9, intervalo: [20, 45], alcance: 70 },      // grunhido
          cavalo: { arquivo: 'assets/audio/animais/cavalo.mp3', volume: 1.0, intervalo: [25, 55], alcance: 80 },    // relincho
        },
      },
      ambiente: {
        cachoeira: { arquivo: 'assets/audio/ambiente/cachoeira.mp3', volume: 0.6, alcance: 90 },    // som contínuo (loop), mais alto perto da cachoeira
        fonte: { arquivo: 'assets/audio/ambiente/fonte.mp3', volume: 0.5, alcance: 45 },            // som contínuo (loop) do chafariz do lago
      },
      segredos: { pedra: { arquivo: 'assets/audio/segredos/pedra-secreta.mp3', volume: 0.8 } },    // Easter egg: clique na pedra da floresta
    };

    // ======================= SISTEMA DE ÁUDIO =======================
    // Um elemento <audio> por som (criados uma vez e reutilizados). Nada toca antes de uma interação explícita (botão "Ativar áudio").
    const CHAVE_AUDIO = 'farmedu-audio'; // ajustes de áudio ficam separados do progresso do jogo
    const SOM = {
      ativo: false, bloqueado: false, musicaPausada: false, el: {}, indisponivel: {}, proximoAnimal: 0, livreEm: {},
      cat: { musica: { ligado: true, volume: AUDIO_CONFIG.musica.volume }, animais: { ligado: true, volume: AUDIO_CONFIG.animais.volume },
        cachoeira: { ligado: true, volume: AUDIO_CONFIG.ambiente.cachoeira.volume }, fonte: { ligado: true, volume: AUDIO_CONFIG.ambiente.fonte.volume } },
    };
    const NOMES_DO_AUDIO = { musica: 'Música', animais: 'Animais', cachoeira: 'Cachoeira', fonte: 'Fonte' };
    try { const salvo = JSON.parse(localStorage.getItem(CHAVE_AUDIO) || '{}'); for (const k in SOM.cat) if (salvo[k]) { if (typeof salvo[k].ligado === 'boolean') SOM.cat[k].ligado = salvo[k].ligado; if (typeof salvo[k].volume === 'number') SOM.cat[k].volume = Math.min(1, Math.max(0, salvo[k].volume)); } } catch (e) { /* ajustes inválidos: usa os padrões */ }
    const salvarAjustesDeAudio = () => { try { localStorage.setItem(CHAVE_AUDIO, JSON.stringify(SOM.cat)); } catch (e) { /* sem armazenamento: ignora */ } };
    const aleatorioEntre = ([a, b]) => a + Math.random() * (b - a);
    const ganhoPorDistancia = (d, alcance) => Math.pow(Math.max(0, 1 - Math.max(0, d - 6) / alcance), 1.5);
    function criarAudio(chave, arquivo, loop) {
      const el = new Audio(); el.preload = 'none'; el.loop = loop; el.src = arquivo;
      el.addEventListener('error', () => { SOM.indisponivel[chave] = true; atualizarPainelDeAudio(); });   // arquivo ausente/ilegível: marca e segue
      ['playing', 'pause', 'ended'].forEach(ev => el.addEventListener(ev, atualizarPainelDeAudio));
      SOM.el[chave] = el; return el;
    }
    criarAudio('musica', AUDIO_CONFIG.musica.arquivo, true);
    for (const t in AUDIO_CONFIG.animais.tipos) criarAudio('animal:' + t, AUDIO_CONFIG.animais.tipos[t].arquivo, false);
    for (const k in AUDIO_CONFIG.ambiente) criarAudio(k, AUDIO_CONFIG.ambiente[k].arquivo, true);
    criarAudio('segredo:pedra', AUDIO_CONFIG.segredos.pedra.arquivo, false);
    function tocarAudio(chave, volume) {
      const el = SOM.el[chave]; if (!el || SOM.indisponivel[chave]) return;
      el.volume = Math.min(1, Math.max(0, volume));
      let p; try { p = el.play(); } catch (e) { SOM.indisponivel[chave] = true; return; }
      if (p && p.catch) p.catch(e => {
        const nome = e && e.name;
        if (nome === 'NotAllowedError') SOM.bloqueado = true;                  // o navegador exigiu um gesto do usuário
        else if (nome !== 'AbortError') SOM.indisponivel[chave] = true;         // arquivo inexistente / formato não suportado
        atualizarPainelDeAudio();
      });
    }
    const estaTocando = chave => !!SOM.el[chave] && !SOM.el[chave].paused && !SOM.indisponivel[chave];
    function aplicarMusica() {
      const el = SOM.el.musica, deve = SOM.ativo && SOM.cat.musica.ligado && !SOM.musicaPausada && !document.hidden;
      if (deve) { if (el.paused) tocarAudio('musica', SOM.cat.musica.volume); else el.volume = SOM.cat.musica.volume; }
      else if (!el.paused) el.pause();
    }
    function aplicarAmbiente() {
      for (const k in AUDIO_CONFIG.ambiente) {
        const el = SOM.el[k], deve = SOM.ativo && SOM.cat[k].ligado && !document.hidden;
        if (deve) { if (el.paused) tocarAudio(k, 0); } else if (!el.paused) el.pause();
      }
    }
    // fontes sonoras no mundo: o volume do som contínuo cai com a distância da câmera
    const FONTES_SONORAS = { cachoeira: [CX, 6, CZ_FRENTE], fonte: [32, 2, 35] };
    setInterval(() => {
      if (!SOM.ativo) return;
      const p = camera.position;
      for (const k in FONTES_SONORAS) {
        if (!estaTocando(k)) continue;
        const f = FONTES_SONORAS[k], cfg = AUDIO_CONFIG.ambiente[k];
        SOM.el[k].volume = Math.min(1, SOM.cat[k].volume * cfg.volume * ganhoPorDistancia(Math.hypot(p.x - f[0], p.y - f[1], p.z - f[2]), cfg.alcance));
      }
    }, 150);
    // sons dos animais: ocasionais, com intervalos aleatórios, limite de simultâneos e volume pela distância
    const posicaoTemporaria = new THREE.Vector3();
    function sortearSomDeAnimal() {
      if (!SOM.ativo || !SOM.cat.animais.ligado || document.hidden) return;
      const agora = performance.now() / 1000; if (agora < SOM.proximoAnimal) return;
      const A = AUDIO_CONFIG.animais;
      SOM.proximoAnimal = agora + aleatorioEntre(A.intervaloEntreSons);
      if (Object.keys(A.tipos).filter(t => estaTocando('animal:' + t)).length >= A.maxSimultaneos) return;
      for (let i = REGISTRO_SONS_ANIMAIS.length - 1; i >= 0; i--) if (!REGISTRO_SONS_ANIMAIS[i][1].parent) REGISTRO_SONS_ANIMAIS.splice(i, 1); // animais removidos pela evolução
      const candidatos = REGISTRO_SONS_ANIMAIS.filter(([tipo]) => A.tipos[tipo] && !SOM.indisponivel['animal:' + tipo] && agora >= (SOM.livreEm[tipo] || 0));
      if (!candidatos.length) return;
      const [tipo, grupo] = candidatos[Math.floor(Math.random() * candidatos.length)], cfg = A.tipos[tipo];
      grupo.getWorldPosition(posicaoTemporaria);
      const ganho = ganhoPorDistancia(camera.position.distanceTo(posicaoTemporaria), cfg.alcance);
      if (ganho < 0.05) return;                                              // longe demais para ser ouvido
      SOM.livreEm[tipo] = agora + aleatorioEntre(cfg.intervalo);
      SOM.el['animal:' + tipo].currentTime = 0;
      tocarAudio('animal:' + tipo, SOM.cat.animais.volume * cfg.volume * ganho);
    }
    setInterval(sortearSomDeAnimal, 500);
    function tocarSegredo(nome) { // som do Easter egg (o clique já é um gesto do usuário, então o navegador permite tocar)
      const chave = 'segredo:' + nome, el = SOM.el[chave];
      if (!el) return;
      if (SOM.indisponivel[chave]) { console.info('[FarmEdu] Som secreto indisponível. Adicione o arquivo em: ' + AUDIO_CONFIG.segredos[nome].arquivo); return; }
      try { el.currentTime = 0; } catch (e) { /* ainda sem metadados */ }
      tocarAudio(chave, AUDIO_CONFIG.segredos[nome].volume);
    }
    function ativarAudio() { SOM.ativo = true; SOM.bloqueado = false; SOM.proximoAnimal = performance.now() / 1000 + 3; aplicarMusica(); aplicarAmbiente(); atualizarPainelDeAudio(); }
    document.addEventListener('visibilitychange', () => { aplicarMusica(); aplicarAmbiente(); });

    // painel de áudio (linhas geradas por categoria)
    {
      const html = Object.keys(SOM.cat).map(k => `<div class="linha-audio"><label><input type="checkbox" id="audio-${k}-on"> ${NOMES_DO_AUDIO[k]}</label><input type="range" id="audio-${k}-vol" min="0" max="100" aria-label="Volume: ${NOMES_DO_AUDIO[k]}">` +
        (k === 'musica' ? `<button class="botao" id="audio-musica-play" style="grid-column:1/-1">⏸ Pausar música</button>` : '') + `<small id="audio-${k}-status"></small></div>`).join('');
      selecionar('#audio-linhas').innerHTML = html;
      for (const k in SOM.cat) {
        selecionar(`#audio-${k}-on`).addEventListener('change', e => { SOM.cat[k].ligado = e.target.checked; salvarAjustesDeAudio(); aplicarMusica(); aplicarAmbiente(); atualizarPainelDeAudio(); });
        selecionar(`#audio-${k}-vol`).addEventListener('input', e => { SOM.cat[k].volume = e.target.value / 100; salvarAjustesDeAudio(); if (k === 'musica') aplicarMusica(); });
      }
      selecionar('#audio-musica-play').addEventListener('click', () => { SOM.musicaPausada = !SOM.musicaPausada; aplicarMusica(); atualizarPainelDeAudio(); });
      selecionar('#audio-ativar').addEventListener('click', ativarAudio);
    }
    function atualizarPainelDeAudio() {
      selecionar('#audio-ativar').textContent = !SOM.ativo ? 'Ativar áudio' : SOM.bloqueado ? 'O navegador bloqueou: toque para ativar' : '✔ Áudio ativo';
      selecionar('#audio-ativar').classList.toggle('ativo', SOM.ativo && !SOM.bloqueado);
      for (const k in SOM.cat) {
        selecionar(`#audio-${k}-on`).checked = SOM.cat[k].ligado; selecionar(`#audio-${k}-vol`).value = Math.round(SOM.cat[k].volume * 100);
        let texto;
        if (!SOM.cat[k].ligado) texto = 'Desligado';
        else if (!SOM.ativo) texto = 'Aguardando "Ativar áudio"';
        else if (k === 'animais') { const tipos = Object.keys(AUDIO_CONFIG.animais.tipos), faltam = tipos.filter(t => SOM.indisponivel['animal:' + t]).length; texto = faltam === tipos.length ? 'Arquivos não encontrados' : faltam ? `Ativo (${faltam} arquivo(s) ausente(s))` : 'Ativo: sons ocasionais'; }
        else if (SOM.indisponivel[k]) texto = 'Arquivo não encontrado: ' + (k === 'musica' ? AUDIO_CONFIG.musica.arquivo : AUDIO_CONFIG.ambiente[k].arquivo);
        else if (k === 'musica') texto = SOM.musicaPausada ? 'Pausada' : estaTocando('musica') ? 'Tocando (loop)' : 'Carregando…';
        else texto = estaTocando(k) ? 'Tocando (volume pela distância)' : 'Carregando…';
        selecionar(`#audio-${k}-status`).textContent = texto;
      }
      const bp = selecionar('#audio-musica-play'); bp.textContent = SOM.musicaPausada ? '▶ Tocar música' : '⏸ Pausar música'; bp.disabled = !SOM.ativo || !SOM.cat.musica.ligado || !!SOM.indisponivel.musica;
    }
    atualizarPainelDeAudio();

    // botões da barra superior: um painel aberto por vez
    {
      const botoes = [['#botao-ceu', '#painel-ceu'], ['#botao-audio', '#painel-audio']];
      botoes.forEach(([b, p]) => selecionar(b).addEventListener('click', () => {
        const abrir = selecionar(p).hidden;
        botoes.forEach(([b2, p2]) => { selecionar(p2).hidden = true; selecionar(b2).classList.remove('ativo'); });
        selecionar(p).hidden = !abrir; selecionar(b).classList.toggle('ativo', abrir);
      }));
    }

    // ======================= LOOP PRINCIPAL =======================
    const relogio = new THREE.Clock();
    function animarCena() {
      requestAnimationFrame(animarCena);
      const dt = Math.min(relogio.getDelta(), 0.05), tempo = relogio.elapsedTime;
      atualizarMovimento(dt, shiftPressionado);   // <-- adicione esta linha
      atualizarCiclo(dt, tempo);
      atualizarFazendeiros(dt, tempo);
      atualizarPedraSecreta(dt);
      for (const animar of animacoesDoCenario) animar(tempo, dt);
      for (const id in animacoesDaArea) for (const animar of animacoesDaArea[id]) animar(tempo, dt);
      for (const id in grupoDaArea) {
        const g = grupoDaArea[id];
        if (g.userData.progressoDoEfeitoDeEvolucao > 0) {
          g.userData.progressoDoEfeitoDeEvolucao = Math.max(0, g.userData.progressoDoEfeitoDeEvolucao - dt * 1.5);
          g.scale.setScalar(1 + 0.2 * Math.sin(g.userData.progressoDoEfeitoDeEvolucao * Math.PI));
        }
      }
      for (const n of nuvens) {
        const u = n.userData, borda = 105;
        n.position[u.eixo] += dt * u.velocidade;
        if (n.position[u.eixo] > borda) n.position[u.eixo] = -borda; // reaparece já invisível (fade), sem salto
        n.position.y = u.yBase + Math.sin(tempo * 0.1 + u.fase) * 0.6;
        u.mat.opacity = CEU.opacNuvem * Math.min(1, Math.max(0, (borda - Math.abs(n.position[u.eixo])) / 20));
        u.mat.color.copy(CEU.corNuvem);
      }
      alvoAtualDaCamera.lerp(alvoDestinoDaCamera, 0.06);
      posicionarCamera();
      atualizarCeu(tempo);
      renderizador.render(cena, camera);
    }
    animarCena();

    // ======================= INTERFACE =======================
    let temporizadorDoAviso;
    function mostrarAviso(msg) {
      const el = selecionar('#aviso');
      el.textContent = msg; el.style.opacity = 1;
      clearTimeout(temporizadorDoAviso);
      temporizadorDoAviso = setTimeout(() => { el.style.opacity = 0; }, 2200);
    }
    function evoluirArea(id) {
      const nivel = estado.niveis[id], custo = CUSTO_PARA_PROXIMO_NIVEL[nivel - 1];
      if (nivel >= NIVEL_MAXIMO || estado.xp < custo) return;
      estado.xp -= custo;
      estado.niveis[id]++;
      salvarProgresso();
      reconstruirArea(id);
      focarCameraNaArea(id);
      desenharCards();
      mostrarAviso(AREAS.find(a => a.id === id).nome + ' evoluiu para o nível ' + (nivel + 1) + '! 🎉');
    }
    function desenharCards() {
      const lista = selecionar('#lista-cards'), rolagem = lista.scrollLeft;
      selecionar('#valor-xp').textContent = estado.xp;
      lista.innerHTML = AREAS.map(area => {
        const nivel = estado.niveis[area.id], max = nivel >= NIVEL_MAXIMO, custo = CUSTO_PARA_PROXIMO_NIVEL[nivel - 1];
        return `<div class="card" onclick="focarCameraNaArea('${area.id}')">
      <div>${area.icone} <b>${area.nome}</b></div>
      <div class="pontos-nivel">${'●'.repeat(nivel) + '○'.repeat(NIVEL_MAXIMO - nivel)}</div>
      <button ${max || estado.xp < custo ? 'disabled' : ''} onclick="event.stopPropagation(); evoluirArea('${area.id}')">${max ? 'Nível máximo' : 'Evoluir · ' + custo + ' XP'}</button>
    </div>`;
      }).join('');
      lista.scrollLeft = rolagem;
    }
    // O sistema de atividades deve chamar window.adicionarXP(quantidade) para creditar XP.
    window.adicionarXP = q => { estado.xp += q; salvarProgresso(); desenharCards(); };
    selecionar('#botao-teste-xp').onclick = () => window.adicionarXP(5000);
    desenharCards();
  </script>
</body>

</html>
