<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minha Fazenda 3D</title>
<style>
:root{--fundo-card:#fffdf5;--texto:#3b2a1a;--destaque:#4a8f3a;--desativado:#a89a82}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--fundo-card:#2b3424;--texto:#f1e8d0;--destaque:#7fc15f;--desativado:#6f7a62}}
:root[data-theme="dark"]{--fundo-card:#2b3424;--texto:#f1e8d0;--destaque:#7fc15f;--desativado:#6f7a62}
html,body{height:100%;margin:0;overflow:hidden;background:#9fd8f5;font-family:system-ui,sans-serif}
canvas{position:fixed;inset:0;touch-action:none}
#barra-topo{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 8px;pointer-events:none}
#barra-topo>*{pointer-events:auto;background:var(--fundo-card);color:var(--texto);border-radius:20px;padding:8px 14px;font-size:15px;box-shadow:0 2px 8px #0003;border:0}
#lista-cards{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;overflow-x:auto;padding:8px 12px calc(env(safe-area-inset-bottom,0px) + 10px)}
.card{flex:0 0 150px;background:var(--fundo-card);color:var(--texto);border-radius:14px;padding:10px;box-shadow:0 2px 8px #0003}
.pontos-nivel{letter-spacing:2px;color:var(--destaque);margin:4px 0 8px;font-size:13px}
.card button{width:100%;min-height:36px;border:0;border-radius:10px;background:var(--destaque);color:#fff;font-weight:600;font-size:13px}
.card button:disabled{background:var(--desativado);opacity:.7}
#aviso{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--fundo-card);color:var(--texto);padding:10px 16px;border-radius:20px;box-shadow:0 2px 10px #0004;opacity:0;transition:opacity .3s;pointer-events:none;font-size:14px;text-align:center}
</style></head><body>
<div id="barra-topo"><b>⭐ <span id="valor-xp">0</span> XP</b><button id="botao-teste-xp">+5000 XP (teste)</button></div>
<div id="lista-cards"></div><div id="aviso"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const selecionar = seletor => document.querySelector(seletor);

// ======================= CONFIGURAÇÃO DO JOGO =======================
const AREAS = [
  { id: 'animais',    nome: 'Animais',    icone: '🐄', posicao: { x: 9,  z: 6 } },
  { id: 'casa',       nome: 'Casa',       icone: '🏠', posicao: { x: -8, z: -9 } },
  { id: 'celeiro',    nome: 'Celeiro',    icone: '🛖', posicao: { x: 9,  z: -8 } },
  { id: 'maquinario', nome: 'Maquinário', icone: '🚜', posicao: { x: -8, z: 6 } },
  { id: 'plantacao',  nome: 'Plantação',  icone: '🌽', posicao: { x: 0,  z: 20 } },
];
const NIVEL_MAXIMO = 3;
const CUSTO_PARA_PROXIMO_NIVEL = [100, 250]; // posição 0 = custo do nível 1 → 2
const COR = { madeira: 0x8a5a2a, ripa: 0xb07a45, janela: 0xffe08a, vidro: 0xbfe3f2, feno: 0xe8c04a, pneu: 0x222222, telhaCasa: 0xd9532f, branco: 0xf2f2ea };

// ======================= PROGRESSO (XP E NÍVEIS) =======================
const CHAVE_SALVAMENTO = 'fazenda3d-progresso-v2';
let estado = { xp: 0, niveis: { animais: 1, casa: 1, celeiro: 1, maquinario: 1, plantacao: 1 } };
try {
  const salvo = JSON.parse(localStorage.getItem(CHAVE_SALVAMENTO));
  if (salvo && salvo.niveis) {
    estado = salvo;
    for (const id in estado.niveis) estado.niveis[id] = Math.min(NIVEL_MAXIMO, Math.max(1, estado.niveis[id] | 0));
  }
} catch (erro) {}
function salvarProgresso() { try { localStorage.setItem(CHAVE_SALVAMENTO, JSON.stringify(estado)); } catch (erro) {} }

// ======================= CENA 3D BÁSICA =======================
const renderizador = new THREE.WebGLRenderer({ antialias: true });
const canvas = renderizador.domElement;
renderizador.setPixelRatio(Math.min(devicePixelRatio, 2));
renderizador.shadowMap.enabled = true;
document.body.prepend(canvas);

const cena = new THREE.Scene();
cena.background = new THREE.Color(0x9fd8f5);
cena.fog = new THREE.Fog(0x9fd8f5, 45, 100);
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 200);
cena.add(new THREE.HemisphereLight(0xffffff, 0x6a8f4a, 0.75));
const sol = new THREE.DirectionalLight(0xfff2cc, 0.9);
sol.position.set(12, 22, 10);
sol.castShadow = true;
sol.shadow.mapSize.set(1024, 1024);
Object.assign(sol.shadow.camera, { left: -26, right: 26, top: 26, bottom: -26, near: 1, far: 70 });
cena.add(sol);

// ======================= FUNÇÕES AUXILIARES DE MODELAGEM =======================
const cacheDeMateriais = {};

function criarTexturaProcedural(cor) {
  const tamanho = 128;
  const canvasTextura = document.createElement('canvas');
  canvasTextura.width = canvasTextura.height = tamanho;
  const ctx = canvasTextura.getContext('2d');

  ctx.fillStyle = '#' + cor.toString(16).padStart(6, '0');
  ctx.fillRect(0, 0, tamanho, tamanho);

  let semente = cor || 1;
  function aleatorio() {
    semente = (semente * 1664525 + 1013904223) >>> 0;
    return semente / 4294967296;
  }

  for (let i = 0; i < 450; i++) {
    const alpha = 0.04 + aleatorio() * 0.13;
    ctx.fillStyle = aleatorio() > 0.5
      ? `rgba(255,255,255,${alpha})`
      : `rgba(0,0,0,${alpha})`;
    ctx.beginPath();
    ctx.arc(aleatorio() * tamanho, aleatorio() * tamanho, 1 + aleatorio() * 5, 0, Math.PI * 2);
    ctx.fill();
  }

  const textura = new THREE.CanvasTexture(canvasTextura);
  textura.wrapS = textura.wrapT = THREE.RepeatWrapping;
  textura.repeat.set(2, 2);
  return textura;
}

function material(cor) {
  if (!cacheDeMateriais[cor]) {
    cacheDeMateriais[cor] = new THREE.MeshLambertMaterial({
      color: 0xffffff,
      map: criarTexturaProcedural(cor)
    });
  }
  return cacheDeMateriais[cor];
}

function criarCaixa(largura, altura, profundidade, cor, x, y, z, pai) {
  const caixa = new THREE.Mesh(new THREE.BoxGeometry(largura, altura, profundidade), material(cor));
  caixa.position.set(x, y, z);
  caixa.castShadow = caixa.receiveShadow = true;
  pai.add(caixa);
  return caixa;
}
function criarCilindro(raioTopo, raioBase, altura, cor, x, y, z, pai, segmentos = 14) {
  const c = new THREE.Mesh(new THREE.CylinderGeometry(raioTopo, raioBase, altura, segmentos), material(cor));
  c.position.set(x, y, z);
  c.castShadow = true;
  pai.add(c);
  return c;
}
function criarEsfera(raio, cor, x, y, z, pai, escalaY = 1) {
  const e = new THREE.Mesh(new THREE.SphereGeometry(raio, 8, 6), material(cor));
  e.position.set(x, y, z);
  e.scale.y = escalaY;
  e.castShadow = true;
  pai.add(e);
  return e;
}
function criarRoda(raio, largura, x, y, z, pai, aro) {
  const roda = criarCilindro(raio, raio, largura, COR.pneu, x, y, z, pai);
  roda.rotation.z = Math.PI / 2;
  if (aro) criarCilindro(raio * 0.55, raio * 0.55, largura + 0.04, aro, x, y, z, pai).rotation.z = Math.PI / 2;
}
// base de grama sob cada área (como nas ilustrações isométricas)
function base(g, largura, profundidade, cor = 0x8fd05a) { criarCaixa(largura, 0.15, profundidade, cor, 0, 0.02, 0, g); }
// telhado de duas águas (prisma). largura = vão entre as águas; comprimento = ao longo do cume.
function telhado(g, largura, comprimento, altura, cor, x, y, z, giro = 0) {
  const r = altura / 1.5;
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, comprimento, 3), material(cor));
  m.rotation.x = -Math.PI / 2;
  m.scale.x = largura / (r * 1.732);
  m.position.y = r / 2;
  m.castShadow = true;
  const p = new THREE.Group();
  p.add(m);
  p.position.set(x, y, z);
  p.rotation.y = giro;
  g.add(p);
}
function cercaLinha(g, x1, z1, x2, z2) {
  const comp = Math.hypot(x2 - x1, z2 - z1), n = Math.ceil(comp), ang = Math.atan2(x2 - x1, z2 - z1);
  for (let i = 0; i <= n; i++) criarCaixa(0.14, 0.8, 0.14, COR.madeira, x1 + (x2 - x1) * i / n, 0.5, z1 + (z2 - z1) * i / n, g);
  for (const y of [0.68, 0.42]) criarCaixa(0.07, 0.09, comp, COR.ripa, (x1 + x2) / 2, y, (z1 + z2) / 2, g).rotation.y = ang;
}
function cerca(g, w, d) {
  cercaLinha(g, -w / 2, -d / 2, w / 2, -d / 2); cercaLinha(g, -w / 2, d / 2, w / 2, d / 2);
  cercaLinha(g, -w / 2, -d / 2, -w / 2, d / 2); cercaLinha(g, w / 2, -d / 2, w / 2, d / 2);
}
function arvore(g, x, z, s = 1) {
  criarCilindro(0.2 * s, 0.28 * s, 1.4 * s, 0x6b4a2b, x, 0.7 * s, z, g, 6);
  criarEsfera(1.1 * s, 0x3f9e3a, x, 2 * s, z, g);
  criarEsfera(0.8 * s, 0x4fb043, x + 0.5 * s, 1.5 * s, z + 0.2 * s, g);
  criarEsfera(0.8 * s, 0x358f33, x - 0.5 * s, 1.6 * s, z - 0.2 * s, g);
}
function arbusto(g, x, z, flores = true) {
  criarEsfera(0.4, 0x4a9e3a, x, 0.35, z, g, 0.8);
  if (flores) [0xe84a5f, 0xffd23f, 0xff8fb1].forEach((c, i) => criarCaixa(0.12, 0.12, 0.12, c, x + (i - 1) * 0.22, 0.6, z + 0.25, g));
}
function pedra(g, x, z, s = 0.4) {
  const p = new THREE.Mesh(new THREE.DodecahedronGeometry(s), material(0xb4b4aa));
  p.position.set(x, s * 0.5, z); p.scale.y = 0.7; p.castShadow = true; g.add(p);
}
function criarMontanha(x, z, largura, altura, profundidade, cor) {
  const montanha = new THREE.Mesh(
    new THREE.ConeGeometry(largura, altura, 5),
    material(cor)
  );
  montanha.position.set(x, altura / 2 - 0.2, z);
  montanha.scale.z = profundidade / largura;
  montanha.castShadow = true;
  montanha.receiveShadow = true;
  cena.add(montanha);
}

function criarLago(x, z, largura, profundidade) {
  const agua = new THREE.Mesh(
    new THREE.CircleGeometry(1, 32),
    new THREE.MeshLambertMaterial({
      color: 0x55bddd,
      transparent: true,
      opacity: 0.88
    })
  );
  agua.rotation.x = -Math.PI / 2;
  agua.position.set(x, 0.07, z);
  agua.scale.set(largura, profundidade, 1);
  cena.add(agua);

  for (let i = 0; i < 18; i++) {
    const angulo = (i / 18) * Math.PI * 2;
    pedra(
      cena,
      x + Math.cos(angulo) * largura * 0.95,
      z + Math.sin(angulo) * profundidade * 0.95,
      0.3
    );
  }
}

function criarCachoeira() {
  const rocha = new THREE.Mesh(
    new THREE.ConeGeometry(9, 18, 5),
    material(0x777d70)
  );
  rocha.position.set(-24, 8.8, -36);
  rocha.scale.z = 0.8;
  cena.add(rocha);

  const agua = new THREE.Mesh(
    new THREE.PlaneGeometry(3.2, 9),
    new THREE.MeshLambertMaterial({
      color: 0x7fe5f2,
      transparent: true,
      opacity: 0.82,
      side: THREE.DoubleSide
    })
  );
  agua.position.set(-24, 5.2, -31);
  cena.add(agua);

  criarLago(-24, -25, 4.5, 2.8);
}

function barril(g, x, z) { criarCilindro(0.32, 0.32, 0.7, 0x7a4a2a, x, 0.45, z, g, 10); }
function caixote(g, x, z) { criarCaixa(0.55, 0.45, 0.55, 0xa0703a, x, 0.32, z, g); }
function fardo(g, x, y, z) { criarCaixa(0.8, 0.5, 0.6, COR.feno, x, y, z, g); }
function janela(g, x, y, z, lateral) {
  criarCaixa(...(lateral ? [0.1, 0.67, 0.62] : [0.62, 0.67, 0.1]), 0x9a4a2a, x, y, z, g);
  criarCaixa(...(lateral ? [0.14, 0.5, 0.45] : [0.45, 0.5, 0.14]), COR.vidro, x, y, z, g);
}
function placa(g, x, z) { criarCaixa(0.1, 1.5, 0.1, COR.madeira, x, 0.75, z, g); criarCaixa(0.6, 0.45, 0.08, 0xc98a4a, x, 1.4, z, g); }

function criarMontanha(x, z, largura, altura, profundidade, cor) {
  const geometria = new THREE.ConeGeometry(largura, altura, 5);
  const montanha = new THREE.Mesh(geometria, material(cor));
  montanha.position.set(x, altura / 2 - 0.2, z);
  montanha.scale.z = profundidade / largura;
  montanha.castShadow = true;
  montanha.receiveShadow = true;
  cena.add(montanha);

  // Cume claro para dar leitura de relevo
  if (altura > 12) {
    const neve = new THREE.Mesh(
      new THREE.ConeGeometry(largura * 0.28, altura * 0.25, 5),
      material(0xe8eadf)
    );
    neve.position.set(x, altura * 0.82, z);
    neve.scale.z = profundidade / largura;
    cena.add(neve);
  }
}

function criarLago(x, z, largura, profundidade) {
  const agua = new THREE.Mesh(
    new THREE.CircleGeometry(1, 32),
    new THREE.MeshLambertMaterial({
      color: 0x55bddd,
      transparent: true,
      opacity: 0.88
    })
  );
  agua.rotation.x = -Math.PI / 2;
  agua.position.set(x, 0.07, z);
  agua.scale.set(largura, profundidade, 1);
  cena.add(agua);

  // Margem de pedras
  for (let i = 0; i < 18; i++) {
    const a = (i / 18) * Math.PI * 2;
    pedra(
      cena,
      x + Math.cos(a) * largura * 0.95,
      z + Math.sin(a) * profundidade * 0.95,
      0.25 + (i % 3) * 0.08
    );
  }
}

function criarCachoeira() {
  // Parede rochosa e faixa d'água ao fundo do mapa
  criarMontanha(-24, -36, 9, 18, 7, 0x777d70);

  const agua = new THREE.Mesh(
    new THREE.PlaneGeometry(3.2, 9),
    new THREE.MeshLambertMaterial({
      color: 0x7fe5f2,
      transparent: true,
      opacity: 0.82,
      side: THREE.DoubleSide
    })
  );
  agua.position.set(-24, 5.2, -31);
  cena.add(agua);

  criarLago(-24, -25, 4.5, 2.8);
}



// ======================= MODELOS REUTILIZÁVEIS =======================
function criarTrator(pai, x, z, escala, cor, aro) {
  const t = new THREE.Group();
  criarCaixa(1.1, 0.7, 2, cor, 0, 0.95, 0, t);
  criarCaixa(0.9, 0.9, 0.9, COR.vidro, 0, 1.7, -0.45, t);
  criarCaixa(1, 0.08, 1, cor, 0, 2.2, -0.45, t);
  criarCaixa(0.1, 0.6, 0.1, 0x333333, 0.35, 1.6, 0.7, t);
  criarRoda(0.6, 0.4, -0.8, 0.6, -0.5, t, aro); criarRoda(0.6, 0.4, 0.8, 0.6, -0.5, t, aro);
  criarRoda(0.38, 0.3, -0.7, 0.38, 0.8, t, aro); criarRoda(0.38, 0.3, 0.7, 0.38, 0.8, t, aro);
  t.scale.setScalar(escala);
  t.position.set(x, 0, z);
  pai.add(t);
  return t;
}
function reboque(g, x, z, giro) {
  const r = new THREE.Group();
  r.position.set(x, 0, z); r.rotation.y = giro; g.add(r);
  criarCaixa(1.6, 0.12, 2.4, 0x8a5a2a, 0, 0.7, 0, r);
  criarCaixa(1.4, 0.05, 2.2, 0xe8e0d0, 0, 0.78, 0, r);
  for (const s of [-1, 1]) { criarCaixa(0.1, 0.5, 2.4, 0xa5703a, s * 0.8, 0.95, 0, r); criarCaixa(1.6, 0.5, 0.1, 0xa5703a, 0, 0.95, s * 1.2, r); }
  criarRoda(0.4, 0.3, -0.9, 0.4, -0.3, r); criarRoda(0.4, 0.3, 0.9, 0.4, -0.3, r);
  criarCaixa(0.1, 0.1, 1.4, 0x555555, 0, 0.55, 1.9, r);
}
function arado(g, x, z, giro, cor) {
  const p = new THREE.Group();
  p.position.set(x, 0, z); p.rotation.y = giro; g.add(p);
  criarCaixa(3, 0.12, 0.3, cor, 0, 0.7, 0, p);
  for (let i = 0; i < 8; i++) criarCaixa(0.05, 0.55, 0.05, 0x555555, -1.3 + i * 0.37, 0.4, 0, p);
  criarRoda(0.3, 0.1, 1.6, 0.3, 0, p);
}
function abrigo(g, x, z) {
  for (const dx of [-1, 1]) for (const dz of [-0.9, 0.9]) criarCaixa(0.12, 1.5, 0.12, COR.madeira, x + dx, 0.85, z + dz, g);
  telhado(g, 2.7, 2.5, 0.8, 0xc98a3a, x, 1.6, z);
  criarCaixa(1.2, 0.35, 0.7, 0x2f6f6f, x, 0.3, z, g);
}
function cocho(g, x, z) { criarCaixa(1.6, 0.4, 0.6, 0x2f6f6f, x, 0.3, z, g); criarCaixa(1.4, 0.05, 0.4, 0x5ec7e0, x, 0.5, z, g); }

// tipo: 'galinha' | 'ovelha' | 'vaca'. Cada animal passeia em círculos dentro do cercado.
function criarAnimal(pai, animacoes, tipo, cx, cz) {
  const a = new THREE.Group();
  if (tipo === 'galinha') {
    criarCaixa(0.4, 0.35, 0.5, 0xd2691e, 0, 0.45, 0, a);
    criarCaixa(0.25, 0.3, 0.25, 0xd2691e, 0, 0.7, 0.22, a);
    criarCaixa(0.1, 0.12, 0.1, 0xe03a2a, 0, 0.92, 0.22, a);
    criarCaixa(0.1, 0.08, 0.15, 0xf2c23b, 0, 0.72, 0.4, a);
  }
  if (tipo === 'ovelha') {
    criarCaixa(0.8, 0.65, 1, 0xf4f1e8, 0, 0.7, 0, a);
    criarCaixa(0.4, 0.4, 0.4, 0xe9dfcc, 0, 0.85, 0.6, a);
    criarCaixa(0.25, 0.25, 0.1, 0x3a3a3a, 0, 0.82, 0.82, a);
    for (const sx of [-0.25, 0.25]) for (const sz of [-0.3, 0.3]) criarCaixa(0.1, 0.4, 0.1, 0x3a3a3a, sx, 0.2, sz, a);
  }
  if (tipo === 'vaca') {
    criarCaixa(0.9, 0.8, 1.6, 0xffffff, 0, 1, 0, a);
    criarCaixa(0.6, 0.6, 0.6, 0xffffff, 0, 1.2, 1, a);
    criarCaixa(0.3, 0.2, 0.1, 0xf2a0b5, 0, 1.05, 1.32, a);
    criarCaixa(0.5, 0.35, 0.05, 0x222222, 0.46, 1.1, 0.1, a);
    criarCaixa(0.5, 0.35, 0.05, 0x222222, -0.46, 0.9, -0.3, a);
    criarCaixa(0.62, 0.3, 0.62, 0x222222, 0, 1.45, 0.98, a);
    for (const sx of [-0.3, 0.3]) for (const sz of [-0.55, 0.55]) criarCaixa(0.16, 0.6, 0.16, 0xffffff, sx, 0.3, sz, a);
  }
  pai.add(a);
  const raio = 0.3 + Math.random() * 0.4;
const vel = 0.3 + Math.random() * 0.4;
const fase = Math.random() * 6;
const tamanhoColisao = tipo === 'vaca' ? 0.85 : tipo === 'ovelha' ? 0.65 : 0.4;
a.userData.tamanhoColisao = tamanhoColisao;

animacoes.push(tempo => {
  const ang = tempo * vel + fase;
  let x = cx + Math.sin(ang) * raio * 2;
  let z = cz + Math.cos(ang) * raio * 1.4;

  for (const outro of pai.children) {
    if (outro === a || outro.userData.tamanhoColisao === undefined) continue;

    const dx = x - outro.position.x;
    const dz = z - outro.position.z;
    const distancia = Math.hypot(dx, dz);
    const distanciaMinima = tamanhoColisao + outro.userData.tamanhoColisao;

    if (distancia > 0 && distancia < distanciaMinima) {
      x += (dx / distancia) * (distanciaMinima - distancia);
      z += (dz / distancia) * (distanciaMinima - distancia);
    }
  }

  a.position.set(x, 0.1 + Math.abs(Math.sin(tempo * 5 + fase)) * 0.05, z);
  a.rotation.y = Math.atan2(
    Math.cos(ang) * raio * 2,
    -Math.sin(ang) * raio * 1.4
  );
});
  };

// ======================= CENÁRIO FIXO =======================
const chao = new THREE.Mesh(new THREE.PlaneGeometry(1000, 1000), material(0x78b24a));

// ======================= GRUPOS 3D DAS ÁREAS =======================
const grupoDaArea = {}, animacoesDaArea = {};
for (const area of AREAS) {
  grupoDaArea[area.id] = new THREE.Group();
  grupoDaArea[area.id].position.set(area.posicao.x, 0, area.posicao.z);
  cena.add(grupoDaArea[area.id]);
}
function reconstruirArea(id) {
  const grupo = grupoDaArea[id];
  while (grupo.children.length) {
    const modelo = grupo.children[0];
    grupo.remove(modelo);
    modelo.traverse(o => { if (o.geometry) o.geometry.dispose(); });
  }
  animacoesDaArea[id] = [];
  construtoresDasAreas[id](grupo, estado.niveis[id], animacoesDaArea[id]);
  grupo.userData.progressoDoEfeitoDeEvolucao = 1;
}
AREAS.forEach(a => reconstruirArea(a.id));

// ======================= CÂMERA E CONTROLES =======================
let anguloHorizontal = 0.7, anguloVertical = 0.85;
let distanciaDaCamera = innerWidth < innerHeight ? 52 : 38;
const DISTANCIA_MINIMA = 14, DISTANCIA_MAXIMA = 62;
const alvoAtualDaCamera = new THREE.Vector3(0, 0, 1), alvoDestinoDaCamera = alvoAtualDaCamera.clone();
function focarCameraNaArea(id) {
  const area = AREAS.find(a => a.id === id);
  alvoDestinoDaCamera.set(area.posicao.x , 0, area.posicao.z );
  let zoomInterval = setInterval((e) => {
    distanciaDaCamera > 20 ? distanciaDaCamera -= 2 : clearInterval(zoomInterval);
  }, 10);
}
function ajustarTamanhoDaTela() {
  renderizador.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener('resize', ajustarTamanhoDaTela);
ajustarTamanhoDaTela();

const dedosNaTela = new Map();
canvas.addEventListener('pointerdown', e => { canvas.setPointerCapture(e.pointerId); dedosNaTela.set(e.pointerId, [e.clientX, e.clientY]); });
canvas.addEventListener('pointermove', e => {
  const anterior = dedosNaTela.get(e.pointerId);
  if (!anterior) return;
  if (dedosNaTela.size === 1) {
    anguloHorizontal -= (e.clientX - anterior[0]) * 0.006;
    anguloVertical = Math.min(1.35, Math.max(0.35, anguloVertical + (e.clientY - anterior[1]) * 0.005));
  } else {
    const outro = [...dedosNaTela.entries()].find(([id]) => id !== e.pointerId)[1];
    const antes = Math.hypot(anterior[0] - outro[0], anterior[1] - outro[1]);
    const agora = Math.hypot(e.clientX - outro[0], e.clientY - outro[1]);
    distanciaDaCamera = Math.min(DISTANCIA_MAXIMA, Math.max(DISTANCIA_MINIMA, distanciaDaCamera * antes / agora));
  }
  dedosNaTela.set(e.pointerId, [e.clientX, e.clientY]);
});
['pointerup', 'pointercancel'].forEach(nome => canvas.addEventListener(nome, e => dedosNaTela.delete(e.pointerId)));
canvas.addEventListener('wheel', e => { distanciaDaCamera = Math.min(DISTANCIA_MAXIMA, Math.max(DISTANCIA_MINIMA, distanciaDaCamera + e.deltaY * 0.03)); });

// ======================= MOVIMENTO WASD DO ALVO DA CÂMERA =======================
const teclas = { KeyW: false, KeyA: false, KeyS: false, KeyD: false };
const LIMITE_DO_MAPA = 30;       // o chão tem 70x70, então ±30 mantém o alvo dentro dele
const VELOCIDADE_BASE = 0.6;     // unidades/s para cada unidade de distância da câmera
const VELOCIDADE_COM_SHIFT = 1.8; // multiplicador ao segurar Shift

addEventListener('keydown', e => { if (e.code in teclas) { teclas[e.code] = true; e.preventDefault(); } });
addEventListener('keyup', e => { if (e.code in teclas) teclas[e.code] = false; });
addEventListener('blur', () => { for (const k in teclas) teclas[k] = false; }); // evita tecla "presa" ao trocar de aba

const frente = new THREE.Vector3(), direita = new THREE.Vector3(), deslocamento = new THREE.Vector3();

function atualizarMovimento(dt, shift) {
  let avanco = (teclas.KeyW ? 1 : 0) - (teclas.KeyS ? 1 : 0);
  let lateral = (teclas.KeyD ? 1 : 0) - (teclas.KeyA ? 1 : 0);
  if (!avanco && !lateral) return;

  // A câmera fica em (sin h, cos h) em relação ao alvo, então "para frente" é o oposto disso
  frente.set(-Math.sin(anguloHorizontal), 0, -Math.cos(anguloHorizontal));
  direita.set(Math.cos(anguloHorizontal), 0, -Math.sin(anguloHorizontal));

  deslocamento.set(0, 0, 0).addScaledVector(frente, avanco).addScaledVector(direita, lateral);
  deslocamento.normalize(); // diagonal não fica mais rápida

  // Quanto mais longe a câmera, mais rápido anda (sensação constante na tela)
  const velocidade = distanciaDaCamera * VELOCIDADE_BASE * (shift ? VELOCIDADE_COM_SHIFT : 1);
  deslocamento.multiplyScalar(velocidade * dt);

  // Move destino e atual juntos: resposta imediata e sem brigar com o focarCameraNaArea
  for (const alvo of [alvoDestinoDaCamera, alvoAtualDaCamera]) {
    alvo.add(deslocamento);
    alvo.x = Math.max(-LIMITE_DO_MAPA, Math.min(LIMITE_DO_MAPA, alvo.x));
    alvo.z = Math.max(-LIMITE_DO_MAPA, Math.min(LIMITE_DO_MAPA, alvo.z));
  }
}
let shiftPressionado = false;
addEventListener('keydown', e => { if (e.key === 'Shift') shiftPressionado = true; });
addEventListener('keyup', e => { if (e.key === 'Shift') shiftPressionado = false; });

// ======================= LOOP PRINCIPAL =======================
const relogio = new THREE.Clock();
function animarCena() {
  requestAnimationFrame(animarCena);
  const dt = Math.min(relogio.getDelta(), 0.05), tempo = relogio.elapsedTime;
  atualizarMovimento(dt, shiftPressionado);   // <-- adicione esta linha
  for (const id in animacoesDaArea) for (const animar of animacoesDaArea[id]) animar(tempo);
  for (const id in grupoDaArea) {
    const g = grupoDaArea[id];
    if (g.userData.progressoDoEfeitoDeEvolucao > 0) {
      g.userData.progressoDoEfeitoDeEvolucao = Math.max(0, g.userData.progressoDoEfeitoDeEvolucao - dt * 1.5);
      g.scale.setScalar(1 + 0.2 * Math.sin(g.userData.progressoDoEfeitoDeEvolucao * Math.PI));
    }
  }
  nuvens.forEach(n => { n.position.x += dt * 0.6; if (n.position.x > 38) n.position.x = -38; });
  alvoAtualDaCamera.lerp(alvoDestinoDaCamera, 0.06);
  camera.position.set(
    alvoAtualDaCamera.x + distanciaDaCamera * Math.cos(anguloVertical) * Math.sin(anguloHorizontal),
    distanciaDaCamera * Math.sin(anguloVertical),
    alvoAtualDaCamera.z + distanciaDaCamera * Math.cos(anguloVertical) * Math.cos(anguloHorizontal)
  );
  camera.lookAt(alvoAtualDaCamera);
  renderizador.render(cena, camera);
}
animarCena();

// ======================= INTERFACE =======================
let temporizadorDoAviso;
function mostrarAviso(msg) {
  const el = selecionar('#aviso');
  el.textContent = msg; el.style.opacity = 1;
  clearTimeout(temporizadorDoAviso);
  temporizadorDoAviso = setTimeout(() => { el.style.opacity = 0; }, 2200);
}
function evoluirArea(id) {
  const nivel = estado.niveis[id], custo = CUSTO_PARA_PROXIMO_NIVEL[nivel - 1];
  if (nivel >= NIVEL_MAXIMO || estado.xp < custo) return;
  estado.xp -= custo;
  estado.niveis[id]++;
  salvarProgresso();
  reconstruirArea(id);
  focarCameraNaArea(id);
  desenharCards();
  mostrarAviso(AREAS.find(a => a.id === id).nome + ' evoluiu para o nível ' + (nivel + 1) + '! 🎉');
}
function desenharCards() {
  const lista = selecionar('#lista-cards'), rolagem = lista.scrollLeft;
  selecionar('#valor-xp').textContent = estado.xp;
  lista.innerHTML = AREAS.map(area => {
    const nivel = estado.niveis[area.id], max = nivel >= NIVEL_MAXIMO, custo = CUSTO_PARA_PROXIMO_NIVEL[nivel - 1];
    return `<div class="card" onclick="focarCameraNaArea('${area.id}')">
      <div>${area.icone} <b>${area.nome}</b></div>
      <div class="pontos-nivel">${'●'.repeat(nivel) + '○'.repeat(NIVEL_MAXIMO - nivel)}</div>
      <button ${max || estado.xp < custo ? 'disabled' : ''} onclick="event.stopPropagation(); evoluirArea('${area.id}')">${max ? 'Nível máximo' : 'Evoluir · ' + custo + ' XP'}</button>
    </div>`;
  }).join('');
  lista.scrollLeft = rolagem;
}
// O sistema de atividades deve chamar window.adicionarXP(quantidade) para creditar XP.
window.adicionarXP = q => { estado.xp += q; salvarProgresso(); desenharCards(); };
selecionar('#botao-teste-xp').onclick = () => window.adicionarXP(5000);
desenharCards();
</script></body></html>
