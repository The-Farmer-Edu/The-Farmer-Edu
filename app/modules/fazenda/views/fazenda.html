      }

      // Barril de madeira (cilindro) no chão.
      function criarBarril(grupo, posicaoX, posicaoZ) { criarCilindro(0.32, 0.32, 0.7, 0x7a4a2a, posicaoX, 0.45, posicaoZ, grupo, 10); }
      // Caixote de madeira no chão.
      function criarCaixote(grupo, posicaoX, posicaoZ) { criarCaixa(0.55, 0.45, 0.55, 0xa0703a, posicaoX, 0.32, posicaoZ, grupo); }
      // Fardo de feno retangular; posicaoY permite empilhar um fardo sobre outro.
      function criarFardoDeFeno(grupo, posicaoX, posicaoY, posicaoZ) { criarCaixa(0.8, 0.5, 0.6, PALETA_DE_CORES.feno, posicaoX, posicaoY, posicaoZ, grupo); }
      // Janela com moldura e vidro. "lateral" = true vira a janela para a parede lateral (eixo X).
      function criarJanela(grupo, posicaoX, posicaoY, posicaoZ, lateral) {
        criarCaixa(...(lateral ? [0.1, 0.67, 0.62] : [0.62, 0.67, 0.1]), 0x9a4a2a, posicaoX, posicaoY, posicaoZ, grupo);
        criarCaixa(...(lateral ? [0.14, 0.5, 0.45] : [0.45, 0.5, 0.14]), PALETA_DE_CORES.vidro, posicaoX, posicaoY, posicaoZ, grupo);
      }
      // ---- Peças de iluminação noturna compartilhadas (janelas acesas, brilhos no chão e halos) ----
      // Textura de brilho redondo (centro forte que some nas bordas), usada em halos e manchas de luz no chão.
      // cor = "R,G,B" (texto) · nucleo = opacidade no centro (0–1).
      const texturaRadial = (cor, nucleo) => {
        const canvasDaImagem = document.createElement('canvas'); canvasDaImagem.width = canvasDaImagem.height = 128;
        const contexto2d = canvasDaImagem.getContext('2d'), gradiente = contexto2d.createRadialGradient(64, 64, 0, 64, 64, 64);
        gradiente.addColorStop(0, `rgba(${cor},${nucleo})`); gradiente.addColorStop(0.35, `rgba(${cor},${nucleo * 0.45})`); gradiente.addColorStop(1, `rgba(${cor},0)`);
        contexto2d.fillStyle = gradiente; contexto2d.fillRect(0, 0, 128, 128);
        return new THREE.CanvasTexture(canvasDaImagem);
      };
      // Desenha o "interior aceso" visto pela janela: luz quente mais forte embaixo, cortinas nas laterais e o caixilho em cruz.
      // É usada como textura EMISSIVA: de dia a janela continua um vidro azulado comum; à noite este desenho brilha,
      // dando a impressão de que a luz vem de dentro da casa (e não de uma simples superfície amarela).
      function criarTexturaDaJanelaAcesa() {
        const canvasDaImagem = document.createElement('canvas'); canvasDaImagem.width = canvasDaImagem.height = 64;
        const contexto2d = canvasDaImagem.getContext('2d');
        const luzInterna = contexto2d.createRadialGradient(32, 46, 2, 32, 40, 44);
        luzInterna.addColorStop(0, '#fff1c4'); luzInterna.addColorStop(0.45, '#ffc46a'); luzInterna.addColorStop(1, '#a8541c');
        contexto2d.fillStyle = luzInterna; contexto2d.fillRect(0, 0, 64, 64);
        contexto2d.fillStyle = 'rgba(110,40,18,0.6)';                                                    // cortinas presas nas laterais
        for (const lado of [0, 1]) { const borda = lado ? 64 : 0, sentido = lado ? -1 : 1; contexto2d.beginPath(); contexto2d.moveTo(borda, 0); contexto2d.lineTo(borda + sentido * 20, 0); contexto2d.quadraticCurveTo(borda + sentido * 8, 30, borda + sentido * 14, 64); contexto2d.lineTo(borda, 64); contexto2d.fill(); }
        contexto2d.fillStyle = '#2e1a0c'; contexto2d.fillRect(30, 0, 4, 64); contexto2d.fillRect(0, 29, 64, 4);   // caixilho em cruz
        contexto2d.strokeStyle = '#2e1a0c'; contexto2d.lineWidth = 6; contexto2d.strokeRect(0, 0, 64, 64);
        return new THREE.CanvasTexture(canvasDaImagem);
      }
      // Vidro das janelas da casa: material ÚNICO e compartilhado. A seção 20 ajusta emissiveIntensity (0 de dia → 1 à noite).
      const materialDaJanelaAcesa = new THREE.MeshLambertMaterial({ color: PALETA_DE_CORES.vidro, emissive: 0xffffff, emissiveMap: criarTexturaDaJanelaAcesa(), emissiveIntensity: 0 });
      // Igual a criarJanela, mas com o vidro que acende à noite (usado na casa). Devolve a malha do vidro.
      function criarJanelaIluminada(grupo, posicaoX, posicaoY, posicaoZ, lateral) {
        criarCaixa(...(lateral ? [0.1, 0.67, 0.62] : [0.62, 0.67, 0.1]), 0x9a4a2a, posicaoX, posicaoY, posicaoZ, grupo);       // moldura
        const vidro = new THREE.Mesh(new THREE.BoxGeometry(...(lateral ? [0.14, 0.5, 0.45] : [0.45, 0.5, 0.14])), materialDaJanelaAcesa);
        vidro.position.set(posicaoX, posicaoY, posicaoZ); vidro.receiveShadow = true; vidro.userData.nome = 'janela-acesa'; grupo.add(vidro);
        return vidro;
      }
      // Mancha de luz no chão (plano deitado com textura radial e mistura aditiva). larguraX/larguraZ deformam o círculo
      // numa elipse. Recebe um material compartilhado, cuja opacidade é controlada pelo ciclo de dia e noite.
      function criarManchaDeLuzNoChao(grupo, materialDaMancha, posicaoX, posicaoY, posicaoZ, larguraX, larguraZ = larguraX) {
        const mancha = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), materialDaMancha);
        mancha.rotation.x = -Math.PI / 2; mancha.position.set(posicaoX, posicaoY, posicaoZ); mancha.scale.set(larguraX, larguraZ, 1); mancha.renderOrder = 2;
        grupo.add(mancha);
        return mancha;
      }
      // Placa simples: um poste de madeira com uma tábua na ponta.
      function criarPlacaDeMadeira(grupo, posicaoX, posicaoZ) { criarCaixa(0.1, 1.5, 0.1, PALETA_DE_CORES.madeira, posicaoX, 0.75, posicaoZ, grupo); criarCaixa(0.6, 0.45, 0.08, 0xc98a4a, posicaoX, 1.4, posicaoZ, grupo); }

      // ====================================================================================================
      // SEÇÃO 08 — MODELOS REUTILIZÁVEIS: CERCAS, VEGETAÇÃO, OBJETOS E ANIMAIS
      // Cercas, árvores, arbustos, barris, abrigos, trator com faróis e reboque, e os modelos dos animais (galinha, vaca, ovelha, cavalo,
      // porco) com sua animação de caminhada (pernas articuladas no quadril e pés sempre no chão).
      // ====================================================================================================
      // ---- Faróis do trator: materiais compartilhados. A seção 20 controla o brilho conforme o ciclo de dia e noite
      //      (apagados de dia, acesos à noite) e posiciona a única luz de foco real que acompanha o trator. ----
      // Feixe projetado no chão: estreito e forte perto do trator, mais largo e fraco à distância (desenhado num canvas).
      function criarTexturaDoFeixeDoFarol() {
        const largura = 128, altura = 256, canvasDaImagem = document.createElement('canvas'); canvasDaImagem.width = largura; canvasDaImagem.height = altura;
        const contexto2d = canvasDaImagem.getContext('2d');
        for (let linha = 0; linha < altura; linha++) {                        // linha 0 = junto ao para-choque; a última = alcance máximo
          const fracao = linha / (altura - 1), meiaLargura = 14 + 48 * fracao;
          const forca = Math.pow(1 - fracao, 1.25) * Math.min(1, fracao / 0.06);  // some no fim do alcance e entra suave junto ao trator
          const gradiente = contexto2d.createLinearGradient(largura / 2 - meiaLargura, 0, largura / 2 + meiaLargura, 0);
          gradiente.addColorStop(0, 'rgba(255,244,214,0)'); gradiente.addColorStop(0.5, `rgba(255,244,214,${0.85 * forca})`); gradiente.addColorStop(1, 'rgba(255,244,214,0)');
          contexto2d.fillStyle = gradiente; contexto2d.fillRect(0, linha, largura, 1);
        }
        return new THREE.CanvasTexture(canvasDaImagem);
      }
      const materialDaLenteDoFarol = new THREE.MeshBasicMaterial({ color: 0x9aa3a8 });   // lente: cinza de dia, branca-amarelada à noite
      const materialDoHaloDoFarol = new THREE.SpriteMaterial({ map: texturaRadial('255,244,214', 1), transparent: true, opacity: 0, depthWrite: false, blending: THREE.AdditiveBlending });
      const materialDoFeixeNoChao = new THREE.MeshBasicMaterial({ map: criarTexturaDoFeixeDoFarol(), transparent: true, opacity: 0, depthWrite: false, blending: THREE.AdditiveBlending, polygonOffset: true, polygonOffsetFactor: -3 });
      for (const materialDoFarol of [materialDaLenteDoFarol, materialDoHaloDoFarol, materialDoFeixeNoChao]) materialDoFarol.userData.ignorarCiclo = true; // o ciclo não os escurece
      // Trator atual (só existe um, na área de maquinário a partir do nível 2). origem/alvo são pontos LOCAIS do trator usados
      // pela seção 20 para apontar a luz de foco dos faróis. Quando a área é reconstruída o trator antigo sai da cena (parent = null).
      let farolDoTrator = null;

      // Trator estilizado (a frente é o lado +z): capô, cabine de vidro, paralamas, escapamento, grade, para-choque e dois
      // faróis com lente, halo e feixe de luz no chão. "escala" ajusta o tamanho; corDoAro pinta os aros das rodas.
      function criarTrator(objetoPai, posicaoX, posicaoZ, escala, cor, corDoAro) {
        const grupoDoTrator = new THREE.Group();
        grupoDoTrator.userData.nome = 'trator';
        criarCaixa(1.1, 0.7, 2, cor, 0, 0.95, 0, grupoDoTrator);
        criarCaixa(0.9, 0.9, 0.9, PALETA_DE_CORES.vidro, 0, 1.7, -0.45, grupoDoTrator);
        criarCaixa(1, 0.08, 1, cor, 0, 2.2, -0.45, grupoDoTrator);
        criarCaixa(0.1, 0.6, 0.1, 0x333333, 0.35, 1.6, 0.7, grupoDoTrator);
        criarCilindro(0.07, 0.06, 0.08, 0x222222, 0.35, 1.94, 0.7, grupoDoTrator, 8);                     // boca do escapamento
        criarCaixa(0.9, 0.06, 0.95, new THREE.Color(cor).multiplyScalar(0.85).getHex(), 0, 1.33, 0.5, grupoDoTrator);  // tampa do capô
        for (const lado of [-1, 1]) criarCaixa(0.44, 0.07, 1.05, cor, lado * 0.8, 1.26, -0.5, grupoDoTrator);   // paralamas das rodas grandes
        criarRoda(0.6, 0.4, -0.8, 0.6, -0.5, grupoDoTrator, corDoAro); criarRoda(0.6, 0.4, 0.8, 0.6, -0.5, grupoDoTrator, corDoAro);
        criarRoda(0.38, 0.3, -0.7, 0.38, 0.8, grupoDoTrator, corDoAro); criarRoda(0.38, 0.3, 0.7, 0.38, 0.8, grupoDoTrator, corDoAro);
        // frente: grade do radiador, para-choque e faróis (carcaça escura, lente que acende e halo luminoso)
        criarCaixa(0.5, 0.32, 0.05, 0x2a2a2a, 0, 0.93, 1.02, grupoDoTrator);
        criarCaixa(1.0, 0.16, 0.12, 0x3a3a3a, 0, 0.62, 1.05, grupoDoTrator);
        for (const lado of [-1, 1]) {
          criarCaixa(0.22, 0.18, 0.08, 0x2c2c2c, lado * 0.39, 1.12, 1.01, grupoDoTrator);
          const lente = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 0.04, 10), materialDaLenteDoFarol);
          lente.rotation.x = Math.PI / 2; lente.position.set(lado * 0.39, 1.12, 1.06); grupoDoTrator.add(lente);
          const halo = new THREE.Sprite(materialDoHaloDoFarol); halo.position.set(lado * 0.39, 1.12, 1.15); halo.scale.set(0.9, 0.9, 1); grupoDoTrator.add(halo);
        }
        // feixe no chão: começa junto ao para-choque e avança ~6,4 unidades (vezes a escala do trator)
        criarManchaDeLuzNoChao(grupoDoTrator, materialDoFeixeNoChao, 0, 0.14, 1.1 + 3.2, 3.4, 6.4).renderOrder = 3;
        farolDoTrator = { trator: grupoDoTrator, origem: new THREE.Vector3(0, 1.12, 1.15), alvo: new THREE.Vector3(0, 0, 7) };
        grupoDoTrator.scale.setScalar(escala);
        grupoDoTrator.position.set(posicaoX, 0, posicaoZ);
        objetoPai.add(grupoDoTrator);
        return grupoDoTrator;
      }
      // Reboque de trator com caçamba e rodas. "giro" é a rotação em torno do eixo vertical.
      function criarReboque(grupo, posicaoX, posicaoZ, giro) {
        const grupoDoReboque = new THREE.Group();
        grupoDoReboque.position.set(posicaoX, 0, posicaoZ); grupoDoReboque.rotation.y = giro; grupo.add(grupoDoReboque);
        criarCaixa(1.6, 0.12, 2.4, 0x8a5a2a, 0, 0.7, 0, grupoDoReboque);
        criarCaixa(1.4, 0.05, 2.2, 0xe8e0d0, 0, 0.78, 0, grupoDoReboque);
        for (const lado of [-1, 1]) { criarCaixa(0.1, 0.5, 2.4, 0xa5703a, lado * 0.8, 0.95, 0, grupoDoReboque); criarCaixa(1.6, 0.5, 0.1, 0xa5703a, 0, 0.95, lado * 1.2, grupoDoReboque); }
        criarRoda(0.4, 0.3, -0.9, 0.4, -0.3, grupoDoReboque); criarRoda(0.4, 0.3, 0.9, 0.4, -0.3, grupoDoReboque);
        criarCaixa(0.1, 0.1, 1.4, 0x555555, 0, 0.55, 1.9, grupoDoReboque);
      }
      // Arado agrícola acoplável ao trator, na cor informada.
      function criarArado(grupo, posicaoX, posicaoZ, giro, cor) {
        const grupoDoArado = new THREE.Group();
        grupoDoArado.position.set(posicaoX, 0, posicaoZ); grupoDoArado.rotation.y = giro; grupo.add(grupoDoArado);
        criarCaixa(3, 0.12, 0.3, cor, 0, 0.7, 0, grupoDoArado);
        for (let indice = 0; indice < 8; indice++) criarCaixa(0.05, 0.55, 0.05, 0x555555, -1.3 + indice * 0.37, 0.4, 0, grupoDoArado);
        criarRoda(0.3, 0.1, 1.6, 0.3, 0, grupoDoArado);
      }
      // Abrigo aberto para animais: quatro mourões e um telhado.
      function criarAbrigo(grupo, posicaoX, posicaoZ) {
        for (const diferencaX of [-1, 1]) for (const diferencaZ of [-0.9, 0.9]) criarCaixa(0.12, 1.5, 0.12, PALETA_DE_CORES.madeira, posicaoX + diferencaX, 0.85, posicaoZ + diferencaZ, grupo);
        criarTelhado(grupo, 2.7, 2.5, 0.8, 0xc98a3a, posicaoX, 1.6, posicaoZ);
        criarCaixa(1.2, 0.35, 0.7, 0x2f6f6f, posicaoX, 0.3, posicaoZ, grupo);
      }
      // Cocho (bebedouro/comedouro) retangular para os cercados.
      function criarCocho(grupo, posicaoX, posicaoZ) { criarCaixa(1.6, 0.4, 0.6, 0x2f6f6f, posicaoX, 0.3, posicaoZ, grupo); criarCaixa(1.4, 0.05, 0.4, 0x5ec7e0, posicaoX, 0.5, posicaoZ, grupo); }

      // casinha de galinha elevada, com rampa, janela e caixa de ninhos (a frente fica virada para +Z)
      function casinhaDeGalinha(grupo, posicaoX, posicaoZ, corParede = 0xc0522f) {
        const casinha = new THREE.Group();
        casinha.position.set(posicaoX, 0, posicaoZ);
        grupo.add(casinha);
        for (const diferencaX of [-0.6, 0.6]) for (const diferencaZ of [-0.45, 0.45]) criarCaixa(0.1, 0.5, 0.1, PALETA_DE_CORES.madeira, diferencaX, 0.25, diferencaZ, casinha); // pernas
        criarCaixa(1.6, 1, 1.2, corParede, 0, 1, 0, casinha);                            // corpo
        criarTelhado(casinha, 1.6, 2, 0.6, PALETA_DE_CORES.telhaCasa, 0, 1.5, 0, Math.PI / 2);            // telhado
        criarCaixa(0.4, 0.5, 0.05, 0x3a2a1a, 0.3, 0.95, 0.62, casinha);                  // porta
        criarCaixa(0.4, 0.04, 0.9, PALETA_DE_CORES.ripa, 0.3, 0.4, 0.95, casinha).rotation.x = 0.75; // rampa
        criarJanela(casinha, -0.4, 1.1, 0.62, false);
        criarCaixa(0.35, 0.4, 1, PALETA_DE_CORES.ripa, 1, 1.1, 0, casinha);                          // caixa de ninhos
      }

      // poça de lama oval (dois cilindros achatados, um mais claro por cima)
      function pocaDeLama(grupo, posicaoX, posicaoZ, raio) {
        criarCilindro(raio, raio, 0.06, 0x5b3a22, posicaoX, 0.13, posicaoZ, grupo, 20).scale.z = 0.7;
        criarCilindro(raio * 0.6, raio * 0.6, 0.06, 0x70492c, posicaoX + raio * 0.1, 0.16, posicaoZ, grupo, 16).scale.z = 0.7;
      }

      const RAIO_DA_HITBOX = { galinha: 0.3, ovelha: 0.5, vaca: 0.8, porco: 0.5, cavalo: 0.85 };
      const ALTURA_DO_CHAO_DOS_CERCADOS = 0.1;   // topo da base de grama das áreas (≈0,095): onde os pés dos animais encostam

      // diz se um animal (círculo de centro x,z) pode ficar nessa posição sem bater em nada
      function posicaoEstaLivre(cercado, animalAtual, posicaoX, posicaoZ, raio) {
        if (Math.abs(posicaoX) > cercado.limiteX - raio || Math.abs(posicaoZ) > cercado.limiteZ - raio) return false; // cerca
        for (const obstaculo of cercado.obstaculos) { // retângulos (abrigo, cocho...)
          const pontoMaisProximoX = Math.min(obstaculo.maxX, Math.max(obstaculo.minX, posicaoX));
          const pontoMaisProximoZ = Math.min(obstaculo.maxZ, Math.max(obstaculo.minZ, posicaoZ));
          if (Math.hypot(posicaoX - pontoMaisProximoX, posicaoZ - pontoMaisProximoZ) < raio) return false;
        }
        return !cercado.animais.some(outro => outro !== animalAtual && Math.hypot(posicaoX - outro.x, posicaoZ - outro.z) < raio + outro.raio);
      }

      // ---- modelos de animais: formas arredondadas (elipsoides), pernas articuladas com cascos/pés, rostos com olhos ----
      // Elipsoide com sombra (raios nos três eixos, posição e giros em X e Z). "segmentos" controla a suavidade: os corpos dos
      // animais maiores usam mais segmentos, para que as manchas encostem na pele sem ficar "flutuando" sobre as facetas.
      const criarElipsoide = (objetoPai, raioX, raioY, raioZ, cor, posicaoX, posicaoY, posicaoZ, giroX = 0, giroZ = 0, segmentos = 10) => {
        const elipsoide = new THREE.Mesh(new THREE.SphereGeometry(1, segmentos, Math.round(segmentos * 0.8)), material(cor));
        elipsoide.scale.set(raioX, raioY, raioZ); elipsoide.position.set(posicaoX, posicaoY, posicaoZ); elipsoide.rotation.set(giroX, 0, giroZ); elipsoide.castShadow = true; objetoPai.add(elipsoide); return elipsoide;
      };
      // Cone (ponta) com sombra, usado em chifres, bicos e orelhas dos animais.
      const criarPonta = (objetoPai, raio, altura, cor, posicaoX, posicaoY, posicaoZ, giroX = 0, giroZ = 0) => {
        const cone = new THREE.Mesh(new THREE.ConeGeometry(raio, altura, 6), material(cor));
        cone.position.set(posicaoX, posicaoY, posicaoZ); cone.rotation.set(giroX, 0, giroZ); cone.castShadow = true; objetoPai.add(cone); return cone;
      };

      // antiga praça do lago: a estrada agora continua até a praça central, então o banco saiu do meio do caminho e foi para a borda
      criarBanco(31.6, 28.0, -Math.PI / 2); criarLampiao(30.9, 26.3);

      // ---- Lampiões das construções: luminárias pequenas presas em paredes, mourões ou postinhos de madeira ----
      // Reaproveitam os MESMOS materiais dos postes (vidro, chama, halo e brilho no chão), então acendem e apagam junto com o
      // ciclo sem nenhum código extra. Cada cabeça de lampião fica registrada por área: a seção 20 escolhe as mais próximas da
      // câmera para receber uma das poucas luzes reais compartilhadas.
      const lampioesDasConstrucoes = {};   // idDaArea → [cabeças de lampião]; a lista é zerada a cada reconstrução da área (seção 14)
      let idDaAreaEmConstrucao = null;     // área cujo construtor está rodando agora (definida por reconstruirArea)
      let animaisCriadosNaConstrucao = 0;  // animais já criados pelo construtor em andamento (animais mortos de fome não reaparecem)
      const canteirosVisuais = {};         // plantações com canteiros: idDaArea → { plantas, solo, posicoes, ... } (seções 12 e 27)
      let carrinhoDaMina = null;           // carrinho criado pelo construtor da mina: { grupo, carga, rodas } (seção 28)
      let marcadorDaLuzDaCasa = null;      // ponto (Object3D) na frente da casa de onde sai a luz quente noturna; recriado com a casa
      const geometriasDoLampiao = {        // malhas compartilhadas pelas cabeças de lampião (não são descartadas na reconstrução: ver seção 14)
        base: new THREE.BoxGeometry(0.2, 0.03, 0.2), vidro: new THREE.BoxGeometry(0.15, 0.22, 0.15), chama: new THREE.OctahedronGeometry(0.05, 0),
        varao: new THREE.BoxGeometry(0.022, 0.23, 0.022), teto: new THREE.ConeGeometry(0.15, 0.12, 4), argola: new THREE.TorusGeometry(0.035, 0.01, 4, 8),
      };
      const geometriasCompartilhadas = new Set(Object.values(geometriasDoLampiao));   // reconstruirArea não descarta estas
      // Cabeça de lampião (base, vidro com chama, varões, teto e argola) com halo. Centro do vidro em (x, y, z) do grupo pai.
      // Opções: escala · brilhoNoChao = diâmetro da mancha de luz no chão (0 = sem mancha) · alturaDoChao = y do chão no grupo pai.
      function criarCabecaDeLampiao(grupoPai, posicaoX, posicaoY, posicaoZ, { escala = 1, brilhoNoChao = 0, alturaDoChao = 0.12 } = {}) {
        const cabeca = new THREE.Group(); cabeca.position.set(posicaoX, posicaoY, posicaoZ); cabeca.scale.setScalar(escala); cabeca.userData.nome = 'lampiao'; grupoPai.add(cabeca);
        const ferro = material(0x2c2a2e);
        const peca = (geometria, materialDaPeca, x, y, z) => { const malha = new THREE.Mesh(geometria, materialDaPeca); malha.position.set(x, y, z); cabeca.add(malha); return malha; };
        peca(geometriasDoLampiao.base, ferro, 0, -0.125, 0);
        peca(geometriasDoLampiao.vidro, materialDaLanterna, 0, 0, 0);
        peca(geometriasDoLampiao.chama, materialDaChama, 0, -0.01, 0);
        for (const diferencaX of [-0.08, 0.08]) for (const diferencaZ of [-0.08, 0.08]) peca(geometriasDoLampiao.varao, ferro, diferencaX, 0, diferencaZ);
        peca(geometriasDoLampiao.teto, ferro, 0, 0.17, 0).rotation.y = Math.PI / 4;
        peca(geometriasDoLampiao.argola, ferro, 0, 0.255, 0);
        const halo = new THREE.Sprite(materialDoHalo); halo.scale.set(1.15, 1.15, 1); cabeca.add(halo);
        if (brilhoNoChao) criarManchaDeLuzNoChao(grupoPai, materialDoBrilhoNoChao, posicaoX, alturaDoChao, posicaoZ, brilhoNoChao);
        if (idDaAreaEmConstrucao) (lampioesDasConstrucoes[idDaAreaEmConstrucao] = lampioesDasConstrucoes[idDaAreaEmConstrucao] || []).push(cabeca);
        return cabeca;
      }
      // Lampião de parede: chapa presa na parede, braço de ferro saindo para a frente (+z local, girado por "giro") e a cabeça
      // pendurada nele. (x, y, z) = ponto da parede na altura do braço. A mancha de luz cai no chão logo à frente da parede.
      function criarLampiaoDeParede(grupo, posicaoX, posicaoY, posicaoZ, giro = 0, brilhoNoChao = 3.2) {
        const suporte = new THREE.Group(); suporte.position.set(posicaoX, posicaoY, posicaoZ); suporte.rotation.y = giro; grupo.add(suporte);
        criarCaixa(0.1, 0.16, 0.03, 0x2c2a2e, 0, 0, 0.015, suporte);                       // chapa na parede
        criarCaixa(0.035, 0.035, 0.24, 0x2c2a2e, 0, 0.02, 0.12, suporte);                  // braço
        criarCabecaDeLampiao(suporte, 0, -0.27, 0.22);
        if (brilhoNoChao) criarManchaDeLuzNoChao(grupo, materialDoBrilhoNoChao, posicaoX + Math.sin(giro) * 0.7, 0.12, posicaoZ + Math.cos(giro) * 0.7, brilhoNoChao);
        return suporte;
      }
      // Postinho de lampião (mourão de madeira de 1,8 com sapata de pedra, braço lateral e lampião pendurado). Usado junto aos
      // portões dos cercados. "giro" escolhe para que lado o braço aponta (padrão: +x).
      function criarPosteDeLampiao(grupo, posicaoX, posicaoZ, giro = 0, brilhoNoChao = 4.2) {
        const poste = new THREE.Group(); poste.position.set(posicaoX, 0, posicaoZ); poste.rotation.y = giro; poste.userData.nome = 'poste-de-lampiao'; grupo.add(poste);
        criarCilindro(0.14, 0.17, 0.2, 0x8a8d86, 0, 0.1, 0, poste, 6);                   // sapata de pedra
        criarCaixa(0.11, 1.8, 0.11, PALETA_DE_CORES.madeira, 0, 0.9, 0, poste);            // mourão
        criarCaixa(0.42, 0.06, 0.06, PALETA_DE_CORES.madeira, 0.17, 1.76, 0, poste);       // braço
        criarCaixa(0.04, 0.26, 0.04, PALETA_DE_CORES.ripa, 0.1, 1.62, 0, poste).rotation.z = 0.75; // mão-francesa
        criarCabecaDeLampiao(poste, 0.32, 1.48, 0, { brilhoNoChao, alturaDoChao: 0.12 });
        return poste;
      }

      // Nuvens: volumes arredondados, espalhadas em faixas afastadas da vista principal, deriva lenta e fade nas bordas.
      const nuvens = [];
      {
        const sortearNuvem = criarGeradorDeNumerosAleatorios(23);
        for (let indice = 0; indice < 20; indice++) {
          const flanco = indice >= 14, nuvem = new THREE.Group();
          const materialDoObjeto = new THREE.MeshLambertMaterial({ color: 0xf8fbff, transparent: true, opacity: 0 });
          const escala = 1.1 + sortearNuvem() * 1.1, sopros = 6 + Math.floor(sortearNuvem() * 4);
          for (let indiceDoSopro = 0; indiceDoSopro < sopros; indiceDoSopro++) {
            const angulo = sortearNuvem() * Math.PI * 2, raioSorteado = Math.sqrt(sortearNuvem()), raio = (1.5 - raioSorteado * 0.7) * (0.8 + sortearNuvem() * 0.5);
            const bolaDeFumaca = new THREE.Mesh(new THREE.SphereGeometry(raio, 10, 8), materialDoObjeto);
            bolaDeFumaca.position.set(Math.cos(angulo) * raioSorteado * 3.6, (1 - raioSorteado) * 0.9 + sortearNuvem() * 0.3, Math.sin(angulo) * raioSorteado * 1.9);
            bolaDeFumaca.scale.set(1.1, 0.62 + sortearNuvem() * 0.2, 1);
            nuvem.add(bolaDeFumaca);
          }
          nuvem.scale.setScalar(escala);
          const eixo = flanco ? 'z' : 'x';
          const posicaoX = flanco ? (indice % 2 ? 1 : -1) * (68 + sortearNuvem() * 28) : -100 + sortearNuvem() * 200;
          const posicaoZ = flanco ? -25 + sortearNuvem() * 90 : -100 + sortearNuvem() * 55;
          nuvem.position.set(posicaoX, flanco ? 17 + sortearNuvem() * 8 : 23 + sortearNuvem() * 12, posicaoZ);
          nuvem.userData = { eixo, mat: materialDoObjeto, velocidade: 0.18 + sortearNuvem() * 0.4, yBase: nuvem.position.y, fase: sortearNuvem() * 6.28 };
          cena.add(nuvem);
          nuvem.userData.animado = true; nuvens.push(nuvem);
        }
      }

      await carregamento.etapa(20, 'Construindo a praça central...');

      // ====================================================================================================
      // SEÇÃO 10 — PRAÇA CENTRAL DO CHAFARIZ
      // Praça planejada na frente da fazenda: pavimento de pedra elíptico, jardim gramado em volta do lago com o chafariz (o lago é
      // construído na seção 11, no centro desta praça), meio-fio, faixa decorativa, mirante para o rio, bancos voltados para o
      // chafariz, postes, canteiros, arbustos, árvores pequenas e pedras. Tudo é posicionado por ângulos em volta do centro,
      // deixando livres as entradas (norte, leste e mirante a oeste) e o anel de circulação entre o jardim e os bancos.
      // Registra as próprias colisões ANTES da distribuição automática de postes e da vegetação (seção 11).
      // ====================================================================================================
      // Contorno ondulado do lago (raio relativo por ângulo, ~0,83 a ~1,19). É compartilhado pelo lago (seção 11), pelo jardim e
      // pela colisão, para que a água, as plantas da margem e a grama sigam sempre a mesma forma.
      const LAGO_DA_PRACA = { raioX: 6, raioZ: 4.2, contorno: angulo => 1 + 0.1 * Math.sin(3 * angulo + 1) + 0.07 * Math.sin(5 * angulo + 2) + 0.04 * Math.sin(8 * angulo) };
      // Verdadeiro se (x, z) está dentro do jardim que cerca o lago (margem = folga extra em unidades do mapa).
      function dentroDoJardimDaPraca(posicaoX, posicaoZ, margem = 0) {
        const relativoX = (posicaoX - PRACA_CENTRAL.x) / LAGO_DA_PRACA.raioX, relativoZ = (posicaoZ - PRACA_CENTRAL.z) / LAGO_DA_PRACA.raioZ;
        const angulo = Math.atan2(relativoZ, relativoX), raioMedio = (LAGO_DA_PRACA.raioX + LAGO_DA_PRACA.raioZ) / 2;
        return Math.hypot(relativoX, relativoZ) < PRACA_CENTRAL.escalaDoJardim * LAGO_DA_PRACA.contorno(angulo) + margem / raioMedio;
      }
      // Verdadeiro se (x, z) cai no pavimento da praça, no mirante ou nas estradas novas que levam até ela. A vegetação sorteada da
      // seção 11 que cairia aqui é escondida (sem sortear de novo, para não mudar o restante do cenário).
      function estaNaAreaDaPracaCentral(posicaoX, posicaoZ, margem = 0) {
        if (estaNoCorredorDaMina(posicaoX, posicaoZ, margem) || ROTAS_DA_MARK_8_2.some(([xInicial, zInicial, xFinal, zFinal, largura]) => posicaoX > Math.min(xInicial, xFinal) - largura / 2 - margem && posicaoX < Math.max(xInicial, xFinal) + largura / 2 + margem && Math.abs(posicaoZ - zInicial) < largura / 2 + margem)) return true;   // Mark 8.2: trilhos da mina e estrada da Nova plantação
        const { x: centroX, z: centroZ, raioX, raioZ, mirante } = PRACA_CENTRAL;
        if (((posicaoX - centroX) / (raioX + margem)) ** 2 + ((posicaoZ - centroZ) / (raioZ + margem)) ** 2 < 1) return true;
        if (Math.hypot(posicaoX - mirante.x, posicaoZ - mirante.z) < mirante.raio + margem) return true;
        return ROTAS_DA_PRACA_CENTRAL.some(([xInicial, zInicial, xFinal, zFinal, largura]) => posicaoX > Math.min(xInicial, xFinal) - largura / 2 - margem && posicaoX < Math.max(xInicial, xFinal) + largura / 2 + margem && posicaoZ > Math.min(zInicial, zFinal) - largura / 2 - margem && posicaoZ < Math.max(zInicial, zFinal) + largura / 2 + margem);
      }

      // Textura do piso: pedras retangulares irregulares em tons de areia, com rejunte. É repetida pelo mapa (UV em coordenadas do
      // mundo), então o desenho continua igual de uma malha para outra (pavimento, mirante).
      function criarTexturaDoPisoDaPraca() {
        const tamanho = 256, canvasDaImagem = document.createElement('canvas'); canvasDaImagem.width = canvasDaImagem.height = tamanho;
        const contexto2d = canvasDaImagem.getContext('2d'), sortear = criarGeradorDeNumerosAleatorios(415), tons = ['#e3d4ae', '#d8c69c', '#cdb98f', '#eadfbf', '#c4b187', '#dccaa2'];
        contexto2d.fillStyle = '#a8946c'; contexto2d.fillRect(0, 0, tamanho, tamanho);                               // rejunte
        for (let linha = 0, alturaDaLinha = 32; linha < tamanho / alturaDaLinha; linha++) {
          let posicaoX = linha % 2 ? -22 : 0;                                                                         // fiadas desencontradas
          while (posicaoX < tamanho) {
            const largura = 30 + Math.floor(sortear() * 34);
            contexto2d.fillStyle = tons[Math.floor(sortear() * tons.length)];
            for (const deslocamento of [0, -tamanho, tamanho]) contexto2d.fillRect(posicaoX + 2 + deslocamento, linha * alturaDaLinha + 2, largura - 4, alturaDaLinha - 4); // emenda nas bordas
            contexto2d.fillStyle = 'rgba(255,255,255,0.12)';
            for (const deslocamento of [0, -tamanho, tamanho]) contexto2d.fillRect(posicaoX + 3 + deslocamento, linha * alturaDaLinha + 3, largura - 6, 3);
            posicaoX += largura;
          }
        }
        const textura = new THREE.CanvasTexture(canvasDaImagem); textura.wrapS = textura.wrapT = THREE.RepeatWrapping;
        return textura;
      }
      // Troca as coordenadas de textura de uma geometria plana (ShapeGeometry/CircleGeometry, que depois é deitada com
      // rotation.x = −π/2) por coordenadas do mundo divididas por "escala": as pedras ficam do mesmo tamanho em todas as peças.
      function aplicarUVDoMundo(geometria, centroX, centroZ, escala) {
        const posicoes = geometria.attributes.position, coordenadasUV = [];
        for (let indice = 0; indice < posicoes.count; indice++) coordenadasUV.push((centroX + posicoes.getX(indice)) / escala, (centroZ - posicoes.getY(indice)) / escala);
        geometria.setAttribute('uv', new THREE.Float32BufferAttribute(coordenadasUV, 2));
      }
      // Forma plana (THREE.Shape) a partir de pontos do MUNDO [x, z], já convertidos para o sistema da forma deitada
      // (x da forma = x − centroX; y da forma = −(z − centroZ)).
      function formaAPartirDePontos(pontos, centroX, centroZ) {
        const forma = new THREE.Shape();
        pontos.forEach(([posicaoX, posicaoZ], indice) => indice ? forma.lineTo(posicaoX - centroX, centroZ - posicaoZ) : forma.moveTo(posicaoX - centroX, centroZ - posicaoZ));
        return forma;
      }

      const pracaCentral = (() => {
        const { x: centroX, z: centroZ, raioX, raioZ, mirante, escalaDoJardim } = PRACA_CENTRAL;
        const grupo = new THREE.Group(); grupo.position.set(centroX, 0, centroZ); grupo.userData.nome = 'praca-central'; cena.add(grupo);
        const PONTOS_DO_CONTORNO = 128;
        // contornos no mundo: jardim (mesma ondulação do lago) e elipse externa do pavimento
        const contornoDoJardim = Array.from({ length: PONTOS_DO_CONTORNO }, (_, indice) => {
          const angulo = indice / PONTOS_DO_CONTORNO * Math.PI * 2, raio = escalaDoJardim * LAGO_DA_PRACA.contorno(angulo);
          return [centroX + Math.cos(angulo) * LAGO_DA_PRACA.raioX * raio, centroZ + Math.sin(angulo) * LAGO_DA_PRACA.raioZ * raio];
        });
        const elipse = escala => Array.from({ length: PONTOS_DO_CONTORNO }, (_, indice) => { const angulo = indice / PONTOS_DO_CONTORNO * Math.PI * 2; return [centroX + Math.cos(angulo) * raioX * escala, centroZ + Math.sin(angulo) * raioZ * escala]; });
        const deitar = (geometria, materialDaPeca, posicaoY, ordem = 0) => { const malha = new THREE.Mesh(geometria, materialDaPeca); malha.rotation.x = -Math.PI / 2; malha.position.y = posicaoY; malha.receiveShadow = true; malha.renderOrder = ordem; grupo.add(malha); return malha; };

        // 1) jardim gramado (um verde um pouco mais vivo que o campo) e pavimento com o jardim vazado no meio.
        //    Material Phong (luz calculada por pixel): os postes da praça desenham manchas de luz reais no piso à noite.
        deitar(new THREE.ShapeGeometry(formaAPartirDePontos(contornoDoJardim, centroX, centroZ)), new THREE.MeshPhongMaterial({ color: 0x84c856, specular: 0x000000, shininess: 0, polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -1 }), 0.035);
        const texturaDoPiso = criarTexturaDoPisoDaPraca();
        const materialDoPiso = new THREE.MeshPhongMaterial({ map: texturaDoPiso, specular: 0x000000, shininess: 0, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 });
        const formaDoPiso = formaAPartirDePontos(elipse(1), centroX, centroZ); formaDoPiso.holes.push(formaAPartirDePontos(contornoDoJardim.slice().reverse(), centroX, centroZ));
        const geometriaDoPiso = new THREE.ShapeGeometry(formaDoPiso); aplicarUVDoMundo(geometriaDoPiso, centroX, centroZ, 3.2);
        deitar(geometriaDoPiso, materialDoPiso, 0.075, 1);
        // faixa de pedras mais escuras acompanhando a borda (desenho de praça planejada)
        const formaDaFaixa = formaAPartirDePontos(elipse(0.955), centroX, centroZ); formaDaFaixa.holes.push(formaAPartirDePontos(elipse(0.925).reverse(), centroX, centroZ));
        deitar(new THREE.ShapeGeometry(formaDaFaixa), new THREE.MeshPhongMaterial({ color: 0xa48d64, specular: 0x000000, shininess: 0, polygonOffset: true, polygonOffsetFactor: -3, polygonOffsetUnits: -3 }), 0.082, 2);
        // mirante: disco do mesmo piso, um pouco mais baixo (onde encosta no pavimento, o pavimento fica por cima, sem z-fighting)
        const geometriaDoMirante = new THREE.CircleGeometry(mirante.raio, 32); aplicarUVDoMundo(geometriaDoMirante, mirante.x, mirante.z, 3.2);
        deitar(geometriaDoMirante, materialDoPiso, 0.065).position.set(mirante.x - centroX, 0.065, mirante.z - centroZ);

        // 2) meio-fio de pedra (instanciado: uma única chamada de desenho por anel), com tons levemente variados
        const materialDoMeioFio = new THREE.MeshLambertMaterial({ color: 0xffffff }), corDoMeioFio = new THREE.Color(), objetoAuxiliar = new THREE.Object3D();
        function criarMeioFio(pontos, pular, fechado = true) {
          const pecas = [];
          for (let indice = 0; indice < pontos.length - (fechado ? 0 : 1); indice++) {
            const [xA, zA] = pontos[indice], [xB, zB] = pontos[(indice + 1) % pontos.length], meioX = (xA + xB) / 2, meioZ = (zA + zB) / 2;
            if (pular(meioX, meioZ)) continue;
            pecas.push([meioX, meioZ, Math.hypot(xB - xA, zB - zA) + 0.03, Math.atan2(-(zB - zA), xB - xA)]);
          }
          const malha = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 0.15, 0.24), materialDoMeioFio, pecas.length);
          pecas.forEach(([meioX, meioZ, comprimento, giro], indice) => {
            objetoAuxiliar.position.set(meioX - centroX, 0.075, meioZ - centroZ); objetoAuxiliar.rotation.set(0, giro, 0); objetoAuxiliar.scale.set(comprimento, 1, 1); objetoAuxiliar.updateMatrix();
            malha.setMatrixAt(indice, objetoAuxiliar.matrix); malha.setColorAt(indice, corDoMeioFio.setHex(0xbab4a5).multiplyScalar(0.9 + ((indice * 37) % 10) / 50));
          });
          malha.instanceMatrix.needsUpdate = true; if (malha.instanceColor) malha.instanceColor.needsUpdate = true;
          malha.frustumCulled = false; malha.receiveShadow = true; grupo.add(malha);
          return malha;
        }
        const naEntrada = (posicaoX, posicaoZ) => (Math.abs(posicaoX - centroX) < 1.75 && posicaoZ < centroZ)          // entrada norte (espinha)
          || (Math.abs(posicaoZ - centroZ) < 1.75 && posicaoX > centroX)                                                   // saída leste
          || Math.hypot(posicaoX - mirante.x, posicaoZ - mirante.z) < mirante.raio + 0.1;                                  // abertura do mirante
        criarMeioFio(contornoDoJardim, () => false);
        criarMeioFio(elipse(1), naEntrada);
        criarMeioFio(Array.from({ length: 40 }, (_, indice) => { const angulo = indice / 40 * Math.PI * 2; return [mirante.x + Math.cos(angulo) * mirante.raio, mirante.z + Math.sin(angulo) * mirante.raio]; }),
          (posicaoX, posicaoZ) => ((posicaoX - centroX) / raioX) ** 2 + ((posicaoZ - centroZ) / raioZ) ** 2 < 1.02);     // só a parte do mirante fora da praça

        // 3) colisões: pavimento e mirante são piso (pessoas andam, postes automáticos e árvores não nascem); o jardim bloqueia
        COLISOES.elipse('estrada', centroX, centroZ, raioX, raioZ);
        COLISOES.circulo('estrada', mirante.x, mirante.z, mirante.raio);
        COLISOES.forma('lago', dentroDoJardimDaPraca);

        // 4) mobiliário em volta do anel de circulação. Ângulos em graus (0° = leste, 90° = sul, 270° = norte/entrada).
        //    Bancos ficam encostados na borda externa, virados para o chafariz, onde o anel é mais largo; os postes ladeiam as
        //    entradas. Nada fica no caminho entre o jardim e os bancos.
        const pontoNaBorda = (graus, recuo) => { const angulo = graus * Math.PI / 180; return [centroX + Math.cos(angulo) * (raioX - recuo), centroZ + Math.sin(angulo) * (raioZ - recuo)]; };
        const ANGULOS_DOS_BANCOS = [35, 58, 90, 122, 212, 238, 302, 328], ANGULOS_DOS_POSTES = [15, 75, 105, 165, 195, 256, 284, 345];
        for (const graus of ANGULOS_DOS_BANCOS) { const [posicaoX, posicaoZ] = pontoNaBorda(graus, 0.85); criarBanco(posicaoX, posicaoZ, Math.atan2(centroX - posicaoX, centroZ - posicaoZ)); }
        for (const graus of ANGULOS_DOS_POSTES) { const [posicaoX, posicaoZ] = pontoNaBorda(graus, 0.45); criarPoste(posicaoX, posicaoZ, -graus * Math.PI / 180); }
        criarBanco(mirante.x - 0.75, mirante.z, -Math.PI / 2);                                                            // banco do mirante, de frente para o rio

        // 5) verde em volta: arbustos atrás dos bancos, canteiros floridos ladeando as entradas, árvores pequenas com flores ao pé e pedras
        const flores = [], CORES_DAS_FLORES = [0xff8fb1, 0xffd23f, 0xffffff, 0xb48cf2, 0xff6b6b, 0xffa94d];

        mina(grupo, nivel, animacoesDestaArea) {

      const VELOCIDADE_COM_SHIFT = 1.8; // multiplicador ao segurar Shift

      // Combinações com Ctrl, Cmd ou Alt (Ctrl+S, Ctrl+C, Ctrl+Shift+I...) são do navegador: o jogo não as captura nem as
      // bloqueia. Ctrl sozinho continua servindo para descer a câmera (sem preventDefault, para não interferir em atalhos).
      const ehTeclaDeControle = codigo => codigo === 'ControlLeft' || codigo === 'ControlRight';
      addEventListener('keydown', evento => {
        if (evento.code in teclas && (ehTeclaDeControle(evento.code) || !(evento.ctrlKey || evento.metaKey || evento.altKey))) {
          jogadorMexeu = true; teclas[evento.code] = true;
          if (!ehTeclaDeControle(evento.code)) evento.preventDefault();
          if (evento.code === 'Space' && document.activeElement && document.activeElement.blur) document.activeElement.blur(); // Espaço não aciona o botão focado
        }
      });
      addEventListener('keyup', evento => { if (evento.code in teclas) { teclas[evento.code] = false; if (evento.code === 'Space') evento.preventDefault(); } });
      addEventListener('blur', () => { for (const tecla in teclas) teclas[tecla] = false; }); // evita tecla "presa" ao trocar de aba

      const frente = new THREE.Vector3(), direita = new THREE.Vector3(), deslocamento = new THREE.Vector3();

      // Move o alvo da câmera com as teclas (setas giram, WASD andam, Espaço/Ctrl sobem/descem), respeitando o
      // limite do mapa e acelerando com Shift.
      function atualizarMovimento(segundosDesdeUltimoFrame, shift) {
        anguloHorizontal += ((teclas.ArrowLeft ? 1 : 0) - (teclas.ArrowRight ? 1 : 0)) * 1.4 * segundosDesdeUltimoFrame;   // setas: girar e inclinar
        ajustarInclinacao(((teclas.ArrowDown ? 1 : 0) - (teclas.ArrowUp ? 1 : 0)) * 1.2 * segundosDesdeUltimoFrame);
        const vertical = (teclas.Space ? 1 : 0) - ((teclas.ControlLeft || teclas.ControlRight || teclas.KeyC) ? 1 : 0);
        if (vertical) for (const alvo of [alvoDestinoDaCamera, alvoAtualDaCamera]) // altura do alvo ≥ 0: a câmera nunca desce abaixo do chão
          alvo.y = Math.max(0, Math.min(ALTURA_MAXIMA_DO_ALVO, alvo.y + vertical * VELOCIDADE_VERTICAL * (shift ? VELOCIDADE_COM_SHIFT : 1) * segundosDesdeUltimoFrame));
        let avanco = (teclas.KeyW ? 1 : 0) - (teclas.KeyS ? 1 : 0);
        let lateral = (teclas.KeyD ? 1 : 0) - (teclas.KeyA ? 1 : 0);
        if (!avanco && !lateral) return;

        // A câmera fica em (sin h, cos h) em relação ao alvo, então "para frente" é o oposto disso
        frente.set(-Math.sin(anguloHorizontal), 0, -Math.cos(anguloHorizontal));
        direita.set(Math.cos(anguloHorizontal), 0, -Math.sin(anguloHorizontal));

        deslocamento.set(0, 0, 0).addScaledVector(frente, avanco).addScaledVector(direita, lateral);
        deslocamento.normalize(); // diagonal não fica mais rápida

        // Quanto mais longe a câmera, mais rápido anda (sensação constante na tela)
        const velocidade = distanciaDaCamera * VELOCIDADE_BASE * (shift ? VELOCIDADE_COM_SHIFT : 1);
        deslocamento.multiplyScalar(velocidade * segundosDesdeUltimoFrame);

        // Move destino e atual juntos: resposta imediata e sem brigar com o focarCameraNaArea
        for (const alvo of [alvoDestinoDaCamera, alvoAtualDaCamera]) {
          alvo.add(deslocamento);
          alvo.x = Math.max(-LIMITE_DO_MAPA, Math.min(LIMITE_DO_MAPA, alvo.x));

      let shiftPressionado = false;
      addEventListener('keydown', evento => { if (evento.key === 'Shift') shiftPressionado = true; });
      addEventListener('keyup', evento => { if (evento.key === 'Shift') shiftPressionado = false; });


      // ====================================================================================================
      // SEÇÃO 20 — ILUMINAÇÃO ARTIFICIAL NOTURNA: POSTES, LAMPIÕES, CASA E TRATOR

      // reais seguem o foco da câmera e são DIVIDIDAS entre postes e lampiões das construções. Além delas há só duas luzes
      // dedicadas: a luz quente da casa e a luz de foco dos faróis do trator. Tudo acende ao entardecer e apaga ao amanhecer.
      // ====================================================================================================
      // Pool de luzes reais (LUZES_DINAMICAS_DOS_POSTES): cada uma acompanha o ponto de luz (poste ou lampião) mais próximo do foco
      // da câmera que esteja livre. A troca é feita com fade, sem "piscadas". Nenhuma luz é criada ou removida durante o jogo

      const luzesDosPostes = Array.from({ length: LUZES_DINAMICAS_DOS_POSTES }, () => {

      // das construções que estão na cena (posição atual no mundo). "chave" identifica o ponto entre uma atualização e outra.
      function listarPontosDeLuzArtificial() {
        const pontos = postesDaFazenda.map(poste => ({ chave: poste, x: poste.x, y: 2.3, z: poste.z, forca: 1 }));
        for (const idDaArea in lampioesDasConstrucoes) for (const lampiao of lampioesDasConstrucoes[idDaArea]) {
          if (!lampiao.parent) continue;

      // Escolhe periodicamente os pontos de luz mais próximos do foco da câmera para receberem as poucas luzes reais e faz cada
      // luz acender/apagar aos poucos (sem piscar), acompanhando o ciclo de dia e noite.
      function atualizarLuzesDosPostes(segundosDesdeUltimoFrame, tempo) {

        temporizadorDosPostes -= segundosDesdeUltimoFrame;
        if (temporizadorDosPostes <= 0) {

          const focoX = alvoAtualDaCamera.x, focoZ = alvoAtualDaCamera.z;
          proximosPontosDeLuz = listarPontosDeLuzArtificial().map(ponto => [Math.hypot(ponto.x - focoX, ponto.z - focoZ), ponto]).sort((itemA, itemB) => itemA[0] - itemB[0]).slice(0, luzesDosPostes.length).map(item => item[1]);
        }

          const atualizado = luzDoPoste.ponto && proximosPontosDeLuz.find(ponto => ponto.chave === luzDoPoste.ponto.chave);
          if (atualizado) { luzDoPoste.ponto = atualizado; luzDoPoste.luz.position.set(atualizado.x, atualizado.y, atualizado.z); }
          luzDoPoste.nivel = Math.min(1, Math.max(0, luzDoPoste.nivel + (atualizado ? 1 : -1) * segundosDesdeUltimoFrame * 1.6));
          if (!atualizado && luzDoPoste.nivel === 0) luzDoPoste.ponto = null;
        }
        for (const ponto of proximosPontosDeLuz) {
          if (luzesDosPostes.some(luzDoPoste => luzDoPoste.ponto && luzDoPoste.ponto.chave === ponto.chave)) continue;
          const livre = luzesDosPostes.find(luzDoPoste => !luzDoPoste.ponto);
          if (livre) { livre.ponto = ponto; livre.luz.position.set(ponto.x, ponto.y, ponto.z); }
        }
        const acesas = CICLO_DE_DIA_E_NOITE.acesas || 0;
        luzesDosPostes.forEach((luzDoPoste, indiceDaLuz) => { luzDoPoste.luz.intensity = luzDoPoste.ponto ? 1.5 * luzDoPoste.nivel * acesas * luzDoPoste.ponto.forca * (1 + 0.04 * Math.sin(tempo * 7 + indiceDaLuz * 2.1)) : 0; });
      }

      // ---- Luzes dedicadas: casa e faróis do trator (criadas uma única vez; ficam com intensidade 0 de dia ou sem dono) ----
      const luzDaCasa = new THREE.PointLight(ILUMINACAO_NOTURNA.luzDaCasa.cor, 0, ILUMINACAO_NOTURNA.luzDaCasa.alcance, 1.4);
      luzDaCasa.position.set(0, -50, 0); cena.add(luzDaCasa);
      const CONFIGURACAO_DOS_FAROIS = ILUMINACAO_NOTURNA.farois;
      const luzDosFarois = new THREE.SpotLight(CONFIGURACAO_DOS_FAROIS.cor, 0, CONFIGURACAO_DOS_FAROIS.alcance, CONFIGURACAO_DOS_FAROIS.abertura, 0.45, 1.2);
      luzDosFarois.position.set(0, -50, 0); cena.add(luzDosFarois); cena.add(luzDosFarois.target);
      const COR_APAGADA_DO_FAROL = new THREE.Color(0x9aa3a8), COR_ACESA_DO_FAROL = new THREE.Color(0xfff6dc);
      // Aplica o fator "acesas" do ciclo (0 de dia, 1 à noite) às janelas da casa, à luz da casa e aos faróis do trator. A luz
      // da casa e a dos faróis seguem a posição do modelo atual (a casa e o maquinário podem ser reconstruídos ao evoluir).
      // No Modo Leve só as luzes reais ficam desligadas: janelas acesas, lentes, halos e feixe no chão continuam funcionando.
      function atualizarIluminacaoNoturna(segundosDesdeUltimoFrame, tempo) {
        const acesas = CICLO_DE_DIA_E_NOITE.acesas || 0;
        // casa: janelas com luz de dentro (oscilação mínima, como uma lâmpada quente) e luz real saindo pela frente
        materialDaJanelaAcesa.emissiveIntensity = acesas * ILUMINACAO_NOTURNA.intensidadeDasJanelas * (0.96 + 0.04 * Math.sin(tempo * 1.7));
        if (!MODO_LEVE.ativo && marcadorDaLuzDaCasa && marcadorDaLuzDaCasa.parent && acesas > 0.001) {
          marcadorDaLuzDaCasa.getWorldPosition(luzDaCasa.position);
          luzDaCasa.intensity = acesas * ILUMINACAO_NOTURNA.luzDaCasa.intensidade;
        } else luzDaCasa.intensity = 0;

        materialDaLenteDoFarol.color.copy(COR_APAGADA_DO_FAROL).lerp(COR_ACESA_DO_FAROL, acesas);

        materialDoHaloDoFarol.visible = materialDoFeixeNoChao.visible = acesas > 0.01;

        if (!MODO_LEVE.ativo && trator && trator.parent && acesas > 0.001) {

          luzDosFarois.position.copy(farolDoTrator.origem); trator.localToWorld(luzDosFarois.position);
          luzDosFarois.target.position.copy(farolDoTrator.alvo); trator.localToWorld(luzDosFarois.target.position); luzDosFarois.target.updateMatrixWorld();
          luzDosFarois.intensity = acesas * CONFIGURACAO_DOS_FAROIS.intensidade;
        } else luzDosFarois.intensity = 0;
      }

      await carregamento.etapa(84, 'Chamando os fazendeiros...');

      // ====================================================================================================
      // SEÇÃO 21 — MODO LEVE: QUALIDADE DE RENDERIZAÇÃO (SOMBRAS, RESOLUÇÃO E LUZES DINÂMICAS)
      // Botão "⚡ Modo Leve" para computadores fracos. Liga/desliga durante a partida, sem recarregar e sem tocar no progresso.
      // Quando ligado: sem sombras em tempo real (nem o cálculo do mapa de sombra), pixelRatio no máximo 1 e as 10 luzes reais
      // da noite (pool de postes/lampiões, casa e faróis) desligadas. Halos, janelas acesas, manchas de luz no chão e todos os
      // modelos continuam no lugar. Ao desligar, tudo volta exatamente à configuração original guardada em QUALIDADE_NORMAL.
      // Observação: o antialias do WebGL é escolhido ao criar o renderizador e não pode mudar sem recriá-lo, então fica como está.
      // ====================================================================================================
      const QUALIDADE_NORMAL = {                   // configuração original do jogo (seção 06), usada para restaurar
        sombras: renderizador.shadowMap.enabled, sombraDoSol: luzDoSol.castShadow,   // (a resolução é recalculada sempre: seção 18)
      };
      const botaoDoModoLeve = selecionar('#botao-modo-leve');
      // Luzes reais com custo por pixel/vértice que o Modo Leve desliga (a hemisférica e o sol/lua continuam: são a luz principal).
      const luzesDinamicasDaNoite = () => [...luzesDosPostes.map(itemDoPool => itemDoPool.luz), luzDaCasa, luzDosFarois];

      function salvarPreferenciaDoModoLeve() { try { localStorage.setItem(CHAVE_DO_MODO_LEVE, MODO_LEVE.ativo ? 'ligado' : 'desligado'); } catch (erro) { } }
      function atualizarBotaoDoModoLeve() {
        botaoDoModoLeve.setAttribute('aria-pressed', String(MODO_LEVE.ativo));
        botaoDoModoLeve.querySelector('.estado-modo-leve').textContent = MODO_LEVE.ativo ? 'ligado' : 'desligado';
      }
      // Aplica ao renderizador e às luzes a qualidade correspondente a MODO_LEVE.ativo. Pode ser chamada quantas vezes for preciso.
      function atualizarQualidadeDeRenderizacao() {
        const leve = MODO_LEVE.ativo;
        // A) Sombras: desligar castShadow do sol/lua faz os materiais deixarem de ler o mapa de sombra; desligar shadowMap
        //    evita que o mapa continue sendo desenhado a cada quadro. (Na troca os materiais recompilam uma vez.)
        luzDoSol.castShadow = leve ? false : QUALIDADE_NORMAL.sombraDoSol;
        renderizador.shadowMap.enabled = leve ? false : QUALIDADE_NORMAL.sombras;
        if (!leve) renderizador.shadowMap.needsUpdate = true;
        // B) Resolução: no máximo 1 no Modo Leve (2 no normal), sempre a partir da densidade ATUAL da tela (zoom incluído).
        ajustarTamanhoDaTela();
        // C) Luzes dinâmicas: luzes invisíveis saem do cálculo de iluminação. Ao voltar, as seções 20 recalculam as
        //    intensidades no quadro seguinte, conforme a hora do dia.
        for (const luz of luzesDinamicasDaNoite()) { luz.visible = !leve; if (leve) luz.intensity = 0; }
        atualizarBotaoDoModoLeve();
      }
      function ativarModoLeve() { MODO_LEVE.ativo = true; salvarPreferenciaDoModoLeve(); atualizarQualidadeDeRenderizacao(); }

      botaoDoModoLeve.onclick = () => {

        mostrarAviso(MODO_LEVE.ativo ? '⚡ Modo Leve ligado: sem sombras e luzes dinâmicas, resolução reduzida' : '✨ Modo Leve desligado: qualidade normal restaurada');
      };

      // ====================================================================================================
      // SEÇÃO 22 — FAZENDEIROS: MODELOS E NAVEGAÇÃO (OS FAZENDEIROS DECORATIVOS GRATUITOS FORAM DESLIGADOS NA MARK 8.2)
      // Três fazendeiros 3D, a grade de navegação (A*) compartilhada com os mobs e a máquina de estados que os faz andar, parar e olhar em volta.
      // ====================================================================================================
      const FAZENDEIROS = [
        { nome: 'Fazendeiro de palha', pele: 0xe8b98f, camisa: 0xc0392b, camisaLinha: 0x7a1d16, xadrez: true, calca: 0x3d5f94, macacao: true, bota: 0x5a3820, cabelo: 0x4a3020,
          chapeu: 'palha', corChapeu: 0xe3c46d, fita: 0xb5342a, inicio: [0, 6], velocidade: 1.05 },
        { nome: 'Fazendeiro vaqueiro', pele: 0xc58b62, camisa: 0x2f6fb0, mangaLonga: true, calca: 0x6b4a2b, bota: 0x2a1a10, cabelo: 0x2a1c12, barba: 0x3a2616,
          chapeu: 'vaqueiro', corChapeu: 0x7a4a2a, fita: 0x2a1a10, inicio: [29, 6], velocidade: 0.95 },
        { nome: 'Fazendeiro de colete', pele: 0xf0c8a0, camisa: 0xf2efe6, mangaLonga: true, colete: 0xe0a830, calca: 0x5c6b3a, bota: 0x4a2f1b, cabelo: 0xb9b4aa, bigode: 0xb9b4aa,
          chapeu: 'larga', corChapeu: 0xd9b565, fita: 0x3f7a3a, inicio: [-2, 16], velocidade: 1.15 },

      // Textura xadrez (camisa) desenhada num canvas, repetida e sem suavização.

        const contexto2d = canvasDaImagem.getContext('2d'); contexto2d.fillStyle = new THREE.Color(corBase).getStyle(); contexto2d.fillRect(0, 0, 64, 64);

        for (const [posicaoDaListra, espessuraDaListra] of [[8, 12], [36, 6]]) { contexto2d.fillRect(0, posicaoDaListra, 64, espessuraDaListra); contexto2d.fillRect(posicaoDaListra, 0, espessuraDaListra, 64); }

        caixa(corpo, 0.5, 0.06, 0.3, 0x3a2414, 0, 0.97, 0);                  // cinto
        caixa(corpo, 0.08, 0.06, 0.02, 0xd9b44a, 0, 0.97, 0.155);            // fivela
        caixa(corpo, 0.5, 0.48, 0.29, materialDaCamisa, 0, 1.24, 0);                // tronco
        caixa(corpo, 0.56, 0.12, 0.3, materialDaCamisa, 0, 1.43, 0);                // ombros

          caixa(corpo, 0.1, 0.4, 0.318, materialDaCamisa, 0, 1.2, 0);               // abertura do colete
          for (let indice = 0; indice < 3; indice++) caixa(corpo, 0.03, 0.03, 0.32, 0x5a3a14, 0, 1.08 + indice * 0.1, 0);
        }
        if (configuracaoDoFazendeiro.macacao) {
          caixa(corpo, 0.34, 0.3, 0.03, configuracaoDoFazendeiro.calca, 0, 1.12, 0.155);            // peitilho
          for (const lado of [-1, 1]) { caixa(corpo, 0.06, 0.34, 0.03, configuracaoDoFazendeiro.calca, lado * 0.14, 1.36, 0.155); caixa(corpo, 0.05, 0.05, 0.035, 0xd9b44a, lado * 0.14, 1.2, 0.17); }

        esfera(cabeca, 0.17, configuracaoDoFazendeiro.pele, 0, 0, 0, 1, 1.08, 1);
        for (const lado of [-1, 1]) {
          esfera(cabeca, 0.035, configuracaoDoFazendeiro.pele, lado * 0.165, 0, 0, 0.6, 1, 1);                              // orelhas
          esfera(cabeca, 0.03, 0xf4f4f0, lado * 0.065, 0.02, 0.14, 1, 0.8, 0.6);                      // olhos (branco)

          fazendeiro.corpo.position.y = Math.abs(Math.sin(fazendeiro.passo)) * 0.04 * amplitudeDoPasso; fazendeiro.corpo.rotation.y = Math.sin(fazendeiro.passo) * 0.08 * amplitudeDoPasso; fazendeiro.corpo.rotation.z = Math.sin(fazendeiro.passo) * 0.025 * amplitudeDoPasso;
          fazendeiro.corpo.scale.y = 1 + Math.sin(tempo * 2 + fazendeiro.fase) * 0.008 * (1 - amplitudeDoPasso);
          fazendeiro.olhar += (fazendeiro.olharAlvo - fazendeiro.olhar) * Math.min(1, segundosDesdeUltimoFrame * 3); fazendeiro.cabeca.rotation.y = fazendeiro.olhar;
          fazendeiro.raiz.position.set(fazendeiro.x, 0, fazendeiro.z); fazendeiro.raiz.rotation.y = fazendeiro.rot;

      }

      await carregamento.etapa(88, 'Preparando sons e painéis...');

      // ====================================================================================================
      // SEÇÃO 23 — ÁUDIO: MÚSICA, ANIMAIS, AMBIENTES E SEGREDO
      // Nada toca antes do primeiro clique em "Ativar áudio" (regra de autoplay). Cada som usa um único elemento <audio>; arquivos ausentes não quebram o jogo.
      // Os caminhos dos arquivos ficam em AUDIO_CONFIG (bloco "CONFIGURAÇÃO DOS ÁUDIOS", logo depois da seção 02).
      // ====================================================================================================
      // Os caminhos ficam em AUDIO_CONFIG (início do arquivo). Nada toca antes do primeiro clique em "Ativar áudio" (regra de autoplay).
      // Cada som usa um único elemento <audio> reutilizado. Arquivo ausente = o som é marcado como indisponível e o jogo segue normalmente.
      const CHAVE_DO_AUDIO = 'fazenda3d-audio-v1';
      const TIPOS_DE_ANIMAL_COM_SOM = Object.keys(AUDIO_CONFIG.animais).filter(chave => chave !== 'global');
      const ESTADO_DO_AUDIO = {
        liberado: false,
        musica: { ligado: true, volume: AUDIO_CONFIG.volumesIniciais.musica, querTocar: true },
        animais: { ligado: true, volume: AUDIO_CONFIG.volumesIniciais.animais, individuais: Object.fromEntries(TIPOS_DE_ANIMAL_COM_SOM.map(tipo => [tipo, true])) },
        cachoeira: { ligado: true, volume: AUDIO_CONFIG.volumesIniciais.cachoeira },
        fonte: { ligado: true, volume: AUDIO_CONFIG.volumesIniciais.fonte },
      };
      try { // preferências salvas (apenas valores válidos)
        const salvo = JSON.parse(localStorage.getItem(CHAVE_DO_AUDIO));
        if (salvo) for (const categoria of ['musica', 'animais', 'cachoeira', 'fonte']) if (salvo[categoria]) {
          if (typeof salvo[categoria].ligado === 'boolean') ESTADO_DO_AUDIO[categoria].ligado = salvo[categoria].ligado;
          if (Number.isFinite(salvo[categoria].volume)) ESTADO_DO_AUDIO[categoria].volume = Math.min(1, Math.max(0, salvo[categoria].volume));
          if (categoria === 'animais' && salvo[categoria].individuais) for (const tipo of TIPOS_DE_ANIMAL_COM_SOM) if (typeof salvo[categoria].individuais[tipo] === 'boolean') ESTADO_DO_AUDIO.animais.individuais[tipo] = salvo[categoria].individuais[tipo];
        }
      } catch (erro) { }
      // Grava no localStorage (chave fazenda3d-audio-v1) o que está ligado e os volumes de cada categoria.
      function salvarPreferenciasDeAudio() { try { localStorage.setItem(CHAVE_DO_AUDIO, JSON.stringify({ musica: ESTADO_DO_AUDIO.musica, animais: ESTADO_DO_AUDIO.animais, cachoeira: ESTADO_DO_AUDIO.cachoeira, fonte: ESTADO_DO_AUDIO.fonte })); } catch (erro) { } }

      // Mantém o volume entre 0 e 1 (limite do elemento <audio>).
      const limitarVolume = volume => Math.min(1, Math.max(0, volume));
      // Ganchos chamados quando o estado de algum som muda; é trocada por atualizarPainelDeAudio mais adiante.

      // Cria o elemento <audio> de um som (uma única vez). O arquivo só é carregado quando necessário; erros de
      // carga marcam o som como indisponível.

      const FONTES_DE_SOM = { musica: criarFonteDeSom(AUDIO_CONFIG.musica.arquivo, true), cachoeira: criarFonteDeSom(AUDIO_CONFIG.ambiente.cachoeira.arquivo, true),
                   fonte: criarFonteDeSom(AUDIO_CONFIG.ambiente.fonte.arquivo, true), pedraSecreta: criarFonteDeSom(AUDIO_CONFIG.segredos.pedraSecreta.arquivo, false), animais: {} };
      for (const tipo of TIPOS_DE_ANIMAL_COM_SOM) FONTES_DE_SOM.animais[tipo] = criarFonteDeSom(AUDIO_CONFIG.animais[tipo].arquivo, false);

      }
      // Pausa o som (sem perder a posição).
      function pararSom(fonteDeSom) { try { fonteDeSom.el.pause(); } catch (erro) { } }
      // Verdadeiro se o som está em reprodução.
      const tocando = fonteDeSom => !fonteDeSom.el.paused && !fonteDeSom.el.ended;

      // Volume final da música = volume do painel × volume da configuração.
      const volumeDaMusica = () => limitarVolume(ESTADO_DO_AUDIO.musica.volume * AUDIO_CONFIG.musica.volume);
      const FONTES_DOS_AMBIENTES = { cachoeira: () => [CENTRO_X_DA_CACHOEIRA, Z_DA_FRENTE_DA_CACHOEIRA], fonte: () => [PRACA_CENTRAL.x, PRACA_CENTRAL.z] };   // chafariz no centro da praça central
      // Volume de cachoeira/fonte: volume do painel × configuração × fator de distância entre a câmera e a fonte
      // do som (nunca abaixo do mínimo configurado).
      function volumeDoAmbiente(nome) {
        const configuracao = AUDIO_CONFIG.ambiente[nome], [posicaoX, posicaoZ] = FONTES_DOS_AMBIENTES[nome](), distancia = Math.hypot(alvoAtualDaCamera.x - posicaoX, alvoAtualDaCamera.z - posicaoZ);
        return limitarVolume(ESTADO_DO_AUDIO[nome].volume * configuracao.volume * Math.max(configuracao.volumeMinimoDeLonge, 1 - distancia / configuracao.distanciaMaxima));
      }
      // Liga ou pausa a música conforme o estado (áudio liberado, categoria ligada, jogador quer tocar, arquivo
      // disponível) e ajusta o volume.
      function sincronizarMusica() {
        const fonteDeSom = FONTES_DE_SOM.musica, deveEstarTocando = ESTADO_DO_AUDIO.liberado && ESTADO_DO_AUDIO.musica.ligado && ESTADO_DO_AUDIO.musica.querTocar && fonteDeSom.estado !== 'erro';
        if (deveEstarTocando && fonteDeSom.el.paused) tocarSom(fonteDeSom, volumeDaMusica());
        else if (!deveEstarTocando && !fonteDeSom.el.paused) pararSom(fonteDeSom);
        else if (deveEstarTocando) fonteDeSom.el.volume = volumeDaMusica();
        aoMudarOAudio();
      }
      // Igual a sincronizarMusica, mas para os sons contínuos (cachoeira e fonte), com volume dependente da
      // distância.
      function sincronizarAmbiente(nome) {
        const fonteDeSom = FONTES_DE_SOM[nome], deveEstarTocando = ESTADO_DO_AUDIO.liberado && ESTADO_DO_AUDIO[nome].ligado && ESTADO_DO_AUDIO[nome].volume > 0.001 && fonteDeSom.estado !== 'erro';
        if (deveEstarTocando && fonteDeSom.el.paused) tocarSom(fonteDeSom, volumeDoAmbiente(nome));
        else if (!deveEstarTocando && !fonteDeSom.el.paused) pararSom(fonteDeSom);
        else if (deveEstarTocando) fonteDeSom.el.volume = volumeDoAmbiente(nome);
      }
      // Chamada dentro de um clique do jogador (exigência de autoplay dos navegadores): libera o áudio, inicia
      // música e ambientes e "destrava" os demais sons, tocando-os mudos por um instante (necessário no iOS).
      function liberarAudio() { // chamado dentro de um clique do jogador: é o que permite o navegador tocar

        for (const fonteDeSom of [...Object.values(FONTES_DE_SOM.animais), FONTES_DE_SOM.pedraSecreta]) { // "destrava" os demais elementos (necessário no iOS); mudo e só por um instante
          try {
            fonteDeSom.el.src = fonteDeSom.arquivo; fonteDeSom.estado = 'carregando'; fonteDeSom.el.muted = true;

          } catch (erro) { fonteDeSom.el.muted = false; }

      }
      // Botão play/pause da música. O primeiro clique libera o áudio e já inicia a música.
      function alternarMusica() {
        if (!ESTADO_DO_AUDIO.liberado) { ESTADO_DO_AUDIO.musica.ligado = true; ESTADO_DO_AUDIO.musica.querTocar = true; liberarAudio(); salvarPreferenciasDeAudio(); return; } // o primeiro clique já inicia a música
        if (FONTES_DE_SOM.musica.estado === 'erro') reiniciarFonteDeSom(FONTES_DE_SOM.musica);   // nova tentativa

        if (!ESTADO_DO_AUDIO.musica.ligado) ESTADO_DO_AUDIO.musica.ligado = true;

      }
      // Liga/desliga uma categoria (música, animais, cachoeira, fonte). Ao religar, tenta de novo arquivos que
      // falharam.

        }

      }
      // Define o volume de uma categoria e aplica na hora aos sons que já tocam.

        ESTADO_DO_AUDIO[categoria].volume = limitarVolume(volume);
        if (categoria === 'musica') sincronizarMusica(); else if (categoria !== 'animais') sincronizarAmbiente(categoria);
        salvarPreferenciasDeAudio();
      }

      // ---- sons dos animais: intervalos aleatórios por tipo, sem sobreposição excessiva, mais baixos quando a câmera está longe ----

      const vetorDoSom = new THREE.Vector3();
      // Sorteia o próximo intervalo (em segundos) entre dois sons de um mesmo animal.
      const sortearIntervalo = configuracao => configuracao.intervaloMin + Math.random() * (configuracao.intervaloMax - configuracao.intervaloMin);
      // A cada quadro desconta o tempo de cada tipo de animal; quando zera, sorteia um animal do tipo, calcula o
      // volume pela distância da câmera e toca. Respeita intervalo mínimo e máximo de sons simultâneos.
      function atualizarSonsDosAnimais(segundosDesdeUltimoFrame, tempo) {
        if (!ESTADO_DO_AUDIO.liberado || !ESTADO_DO_AUDIO.animais.ligado || ESTADO_DO_AUDIO.animais.volume <= 0.001) return;
        const limitesGlobais = AUDIO_CONFIG.animais.global;
        for (const tipo of TIPOS_DE_ANIMAL_COM_SOM) {
          const configuracao = AUDIO_CONFIG.animais[tipo], fonteDeSom = FONTES_DE_SOM.animais[tipo];

          if ((agendaDosAnimais.proximo[tipo] -= segundosDesdeUltimoFrame) > 0) continue;
          agendaDosAnimais.proximo[tipo] = sortearIntervalo(configuracao);
          if (fonteDeSom.estado === 'erro' || !ESTADO_DO_AUDIO.animais.individuais[tipo]) continue;

          if (!candidatos.length) continue;

          const bicho = candidatos[Math.floor(Math.random() * candidatos.length)];
          bicho.grupo.getWorldPosition(vetorDoSom);
          const distancia = Math.hypot(alvoAtualDaCamera.x - vetorDoSom.x, alvoAtualDaCamera.z - vetorDoSom.z);
          try { fonteDeSom.el.currentTime = 0; fonteDeSom.el.playbackRate = 0.94 + Math.random() * 0.12; } catch (erro) { }
          const volume = ESTADO_DO_AUDIO.animais.volume * configuracao.volume * Math.max(0.12, 1 - distancia / limitesGlobais.distanciaMaxima);
          agendaDosAnimais.ultimoSom = tempo;

      }
      let relogioDosAmbientes = 0;

      const raioDeClique = new THREE.Raycaster(), pontoDoClique = new THREE.Vector2();

        else if (PLANTACOES_COM_CANTEIROS.some(idDaArea => {                                                   // Mark 8.2: canteiros das duas plantações
          const visual = canteirosVisuais[idDaArea]; if (!visual || !estado.niveis[idDaArea]) return false;
          const acerto = raioDeClique.intersectObject(visual.solo, false)[0] || (raioDeClique.intersectObject(grupoDaArea[idDaArea], true).length ? {} : null);
          if (acerto) abrirPainelDaFazenda(idDaArea, acerto.instanceId);

        })) { /* painel aberto */ }
        else if (estado.niveis.mina && raioDeClique.intersectObject(grupoDaArea.mina, true).length) { abrirPainelDaFazenda(); mostrarAviso(textoDoEstadoDaMina()); }
      });
      // Reage ao clique na pedra secreta: faz os cristais pulsarem e toca o som secreto (se o arquivo existir;
      // senão só registra no console).
      function ativarPedraSecreta() {

        if (tocando(fonteDeSom)) return;

      }

      // ====================================================================================================
      // SEÇÃO 24 — PAINÉIS FLUTUANTES DE TEMPO E ÁUDIO (E LISTA DOS PAINÉIS DA BARRA)
      // Botões e painéis "Tempo" (modos do ciclo e testes de invasão) e "Áudio" (volumes e ativação de cada categoria).
      // ====================================================================================================
      const painelDoTempo = selecionar('#painel-tempo'), painelDoAudio = selecionar('#painel-audio');
      const botaoDoTempo = selecionar('#botao-painel-tempo'), botaoDoAudio = selecionar('#botao-painel-audio');
      // Painéis da barra de ferramentas: abrir um fecha os outros, para não sobrepor. A seção 30 acrescenta Fazenda e Equipe.
      const PAINEIS_DA_BARRA = [[painelDoTempo, botaoDoTempo], [painelDoAudio, botaoDoAudio]];
      function alternarPainel(painel, botao) {

      const botoesDeModo = [...painelDoTempo.querySelectorAll('[data-modo]')];

      // Nome do período (Madrugada, Amanhecer, Manhã, Tarde, Entardecer, Noite) para a hora informada.
      const periodoDoDia = hora => hora < 5 ? 'Madrugada' : hora < 7 ? 'Amanhecer' : hora < 12 ? 'Manhã' : hora < 17 ? 'Tarde' : hora < 19 ? 'Entardecer' : 'Noite';
      let ultimoMinutoMostrado = -1;
      // Atualiza relógio, período e botão ativo do painel "Tempo". Só mexe no HTML quando o minuto muda (ou se
      // "forcar" = true).
      function atualizarPainelDeTempo(forcar) {
        const minutos = Math.floor(CICLO_DE_DIA_E_NOITE.hora * 60) % 1440;
        if (!forcar && minutos === ultimoMinutoMostrado) return;
        ultimoMinutoMostrado = minutos;
        selecionar('#tempo-relogio').textContent = String(Math.floor(minutos / 60)).padStart(2, '0') + ':' + String(minutos % 60).padStart(2, '0');
        selecionar('#tempo-periodo').textContent = periodoDoDia(CICLO_DE_DIA_E_NOITE.hora);
        selecionar('#tempo-modo').textContent = NOMES_DOS_MODOS[CICLO_DE_DIA_E_NOITE.modo];
        for (const botao of botoesDeModo) { const ativo = botao.dataset.modo === CICLO_DE_DIA_E_NOITE.modo; botao.classList.toggle('ativo', ativo); botao.setAttribute('aria-pressed', String(ativo)); }
      }

      // ---- painel de áudio ----

      // ---- ferramentas de teste (painel "Tempo") e API para o console ----

      // deslocadas para a posição do canteiro (origemX, origemZ) dentro da plantação.
      function pecasDaCultura(cultura, estagio, origemX = 0, origemZ = 0) {

        const pontos = cultura === 'abobora' ? [[-0.6, -0.6], [0.6, -0.6], [-0.6, 0.6], [0.6, 0.6]] : [-0.8, 0, 0.8].flatMap(posicaoX => [-0.8, 0, 0.8].map(posicaoZ => [posicaoX, posicaoZ]));
        adicionar('cilindro', 0x8a5a2a, 1.1, 0.3, 1.1, 0.02, 0.6, 0.02, 0, 0, 0);                                   // bandeirinha que identifica a cultura
        adicionar('caixa', CORES_DAS_BANDEIRINHAS[cultura], 1.21, 0.52, 1.1, 0.2, 0.13, 0.012, 0, 0, 0);

          const giro = indice * 1.7;

          const pronto = estagio === 3;
          if (cultura === 'trigo') for (const [deslocamentoX, deslocamentoZ] of [[-0.09, 0], [0.08, 0.07], [0.02, -0.09]]) {

            if (pronto) adicionar('esfera', 0xe0b03a, posicaoX + deslocamentoX, alturaDoCaule + 0.06, posicaoZ + deslocamentoZ, 0.05, 0.13, 0.05, 0, 0, 0);
          }
          if (cultura === 'milho') {
            const alturaDoCaule = pronto ? 1.3 : 0.8;
            adicionar('cilindro', 0x5fae3a, posicaoX, alturaDoCaule / 2, posicaoZ, 0.045, alturaDoCaule, 0.045, 0, 0, 0);
            for (const [lado, posicaoY] of [[-1, 0.45], [1, 0.7]]) adicionar('cone', 0x6cc046, posicaoX + lado * 0.12, posicaoY, posicaoZ, 0.05, 0.42, 0.05, 0, giro, lado * 0.9);
            if (pronto) { adicionar('esfera', 0xf2c83a, posicaoX + 0.09, 0.85, posicaoZ, 0.06, 0.16, 0.06, 0, 0, -0.3); adicionar('cone', 0x8fc45a, posicaoX + 0.11, 0.78, posicaoZ, 0.05, 0.24, 0.05, 0, 0, -0.35); }

          }

      // ---- Alimentação dos animais ----
      // Aplica o tempo passado desde a última atualização: o cocho esvazia proporcional aos animais vivos; com comida a saúde
      // se recupera; sem comida ela cai devagar e, ao chegar a zero, UM animal morre e os demais seguem (o jogador é avisado

      function atualizarAlimentacao() {

        for (const idDaArea in ANIMAIS_DAS_AREAS) {
          const situacao = estado.animais[idDaArea], total = totalDeAnimais(idDaArea), vivos = animaisVivosDaArea(idDaArea);
          let horas = (agora - situacao.atualizadoEm) / 3600000;
          situacao.atualizadoEm = agora;

      // Enche o cocho usando as colheitas na ordem de preferência do animal (só o necessário).
      function alimentarAnimais(idDaArea) {

        if (!Object.keys(usados).length) { mostrarAviso('Sem alimento para ' + informacao.nome + 's! Colha ' + informacao.come.map(recurso => CULTURAS[recurso].icone + ' ' + CULTURAS[recurso].nome).join(', ') + ' na Nova plantação.'); return; }

        for (const idDaArea in ANIMAIS_DAS_AREAS) {

            const area = AREAS.find(areaDaLista => areaDaLista.id === idDaArea), placa = new THREE.Sprite(new THREE.SpriteMaterial({ map: criarTexturaDeTexto('🍽 Fome!', '#ffffff', '#c0392b'), depthWrite: false }));
            placa.scale.set(2.2, 1.1, 1); placa.position.set(area.posicao.x, 4.4, area.posicao.z); cena.add(placa); sinaisDeFome[idDaArea] = placa;
          }

      }

      // ====================================================================================================
      // SEÇÃO 28 — MINERAÇÃO: CICLO DO CARRINHO, MINÉRIOS E XP (MARK 8.2)
      // Máquina de estados salva em estado.mina: parado → indo (vazio, nos trilhos) → minerando (dentro do escuro por
      // MINERACAO_CONFIG.minutosMinerando) → voltando (carregado) → descarregando (minérios e XP creditados UMA vez) → indo...
      // Os tempos usam o relógio real (agoraNoJogo), então recarregar a página não repete nem pula recompensas. Tempo com a página
