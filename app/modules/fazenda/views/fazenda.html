<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Minha Fazenda 3D</title>
  <style>
    :root {
      --fundo-card: #fffdf5;
      --texto: #3b2a1a;
      --destaque: #4a8f3a;
      --desativado: #a89a82
    }

    @media(prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --fundo-card: #2b3424;
        --texto: #f1e8d0;
        --destaque: #7fc15f;
        --desativado: #6f7a62
      }
    }

    :root[data-theme="dark"] {
      --fundo-card: #2b3424;
      --texto: #f1e8d0;
      --destaque: #7fc15f;
      --desativado: #6f7a62
    }

    html,
    body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #9fd8f5;
      font-family: system-ui, sans-serif
    }

    canvas {
      position: fixed;
      inset: 0;
      display: block;
      z-index: 0;
      touch-action: none
    }

    #barra-topo {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: calc(env(safe-area-inset-top, 0px) + 10px) 12px 8px;
      z-index: 10;
      pointer-events: none
    }

    #barra-topo>* {
      pointer-events: auto;
      background: var(--fundo-card);
      color: var(--texto);
      border-radius: 20px;
      padding: 8px 14px;
      font-size: 15px;
      box-shadow: 0 2px 8px #0003;
      border: 0
    }

    #lista-cards {
      position: fixed;
      z-index: 10;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 8px 12px calc(env(safe-area-inset-bottom, 0px) + 10px)
    }

    .card {
      flex: 0 0 150px;
      background: var(--fundo-card);
      color: var(--texto);
      border-radius: 14px;
      padding: 10px;
      box-shadow: 0 2px 8px #0003
    }

    .pontos-nivel {
      letter-spacing: 2px;
      color: var(--destaque);
      margin: 4px 0 8px;
      font-size: 13px
    }

    .card button {
      width: 100%;
      min-height: 36px;
      border: 0;
      border-radius: 10px;
      background: var(--destaque);
      color: #fff;
      font-weight: 600;
      font-size: 13px
    }

    .card button:disabled {
      background: var(--desativado);
      opacity: .7
    }

    #atalhos {
      display: flex;
      gap: 2px;
      padding: 3px 5px !important
    }

    #atalhos button {
      background: none;
      border: 0;
      color: inherit;
      font-size: 18px;
      padding: 4px 9px;
      border-radius: 14px;
      cursor: pointer
    }

    #atalhos button.ativo {
      background: var(--destaque)
    }

    .painel {
      position: fixed;
      z-index: 12;
      top: calc(env(safe-area-inset-top, 0px) + 58px);
      left: 50%;
      transform: translateX(-50%);
      width: min(92vw, 330px);
      max-height: calc(100vh - 190px);
      overflow-y: auto;
      box-sizing: border-box;
      background: var(--fundo-card);
      color: var(--texto);
      border-radius: 16px;
      padding: 12px 14px;
      box-shadow: 0 4px 16px #0005;
      font-size: 13px
    }

    .painel[hidden] {
      display: none
    }

    .painel h3 {
      margin: 0 0 8px;
      font-size: 14px
    }

    .painel .estado {
      margin: 0 0 8px;
      font-weight: 600;
      color: var(--destaque)
    }

    .painel .seg {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px
    }

    .painel button.botao {
      min-height: 36px;
      border: 0;
      border-radius: 10px;
      background: var(--desativado);
      color: #fff;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer
    }

    .painel button.botao.ativo {
      background: var(--destaque)
    }

    .painel button.botao:disabled {
      opacity: .5;
      cursor: default
    }

    .linha-audio {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 2px 10px;
      align-items: center;
      margin: 10px 0 0
    }

    .linha-audio label {
      font-weight: 600;
      display: flex;
      gap: 6px;
      align-items: center
    }

    .linha-audio input[type=range] {
      width: 100%
    }

    .linha-audio small {
      grid-column: 1 / -1;
      opacity: .75
    }

    #aviso {
      position: fixed;
      z-index: 11;
      left: 50%;
      top: 70px;
      transform: translateX(-50%);
      background: var(--fundo-card);
      color: var(--texto);
      padding: 10px 16px;
      border-radius: 20px;
      box-shadow: 0 2px 10px #0004;
      opacity: 0;
      transition: opacity .3s;
      pointer-events: none;
      font-size: 14px;
      text-align: center
    }
  </style>
</head>

<body>
  <div id="barra-topo"><b>⭐ <span id="valor-xp">0</span> XP</b>
    <div id="atalhos"><button id="botao-ceu" title="Dia e noite" aria-label="Dia e noite">🌗</button><button id="botao-audio" title="Áudio" aria-label="Áudio">🔊</button></div>
    <button id="botao-teste-xp">+5000 XP (teste)</button>
  </div>
  <div id="painel-ceu" class="painel" hidden>
    <h3>🌗 Dia e noite</h3>
    <p class="estado" id="ceu-status">Modo: Automático</p>
    <div class="seg">
      <button class="botao" data-modo="auto">▶ Automático</button>
      <button class="botao" data-modo="pausa">⏸ Pausar</button>
      <button class="botao" data-modo="dia">☀️ Dia fixo</button>
      <button class="botao" data-modo="noite">🌙 Noite fixa</button>
    </div>
  </div>
  <div id="painel-audio" class="painel" hidden>
    <h3>🔊 Áudio</h3>
    <button class="botao" id="audio-ativar" style="width:100%">Ativar áudio</button>
    <div id="audio-linhas"></div>
  </div>
  <div id="lista-cards"></div>
  <div id="aviso"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    const selecionar = seletor => document.querySelector(seletor);

    // ======================= CONFIGURAÇÃO DO JOGO =======================
    const AREAS = [
      { id: 'curral', nome: 'Curral das vacas', icone: '🐄', posicao: { x: 7, z: 6 } },
      { id: 'ovelhal', nome: 'Ovelhal', icone: '🐑', posicao: { x: 7, z: 21 } },
      { id: 'casa', nome: 'Casa', icone: '🏠', posicao: { x: -8, z: -9 } },
      { id: 'celeiro', nome: 'Celeiro', icone: '🛖', posicao: { x: 7, z: -9 } },
      { id: 'maquinario', nome: 'Maquinário', icone: '🚜', posicao: { x: -8, z: 6 } },
      { id: 'plantacao', nome: 'Plantação', icone: '🥬', posicao: { x: 35, z: -8 } },
      { id: 'plantacaoGrande', nome: 'Grande plantação', icone: '🌾', posicao: { x: 43, z: 12 } },
      { id: 'galinheiro', nome: 'Galinheiro', icone: '🐔', posicao: { x: 19, z: 6 } },
      { id: 'chiqueiro', nome: 'Chiqueiro', icone: '🐖', posicao: { x: 19, z: -9 } },
      { id: 'estabulo', nome: 'Estábulo', icone: '🐎', posicao: { x: 19, z: 21 } },
      { id: 'ponte', nome: 'Ponte do rio', icone: '🌉', posicao: { x: -20.4, z: -1 } },
    ];
    const NIVEL_MAXIMO = 3;
    const CUSTO_PARA_PROXIMO_NIVEL = [100, 250]; // posição 0 = custo do nível 1 → 2

    // Estágio de crescimento das plantações (separado do nível de XP, não é salvo):
    // 1 = recém-plantado · 2 = pouco desenvolvido · 3 = pronto para coleta
    const ESTAGIO_MAXIMO_DA_PLANTA = 3;
    const ESCALA_POR_ESTAGIO = [0.3, 0.65, 1]; // índice = estágio - 1
    const estagioDasPlantacoes = { plantacao: 1, plantacaoGrande: 1 };

    const COR = { madeira: 0x8a5a2a, ripa: 0xb07a45, janela: 0xffe08a, vidro: 0xbfe3f2, feno: 0xe8c04a, pneu: 0x222222, telhaCasa: 0xd9532f, branco: 0xf2f2ea };

    // ======================= PROGRESSO (XP E NÍVEIS) =======================
    const CHAVE_SALVAMENTO = 'fazenda3d-progresso-v3';
    let estado = { xp: 0, niveis: Object.fromEntries(AREAS.map(area => [area.id, 1])) };
    try {
      const salvo = JSON.parse(localStorage.getItem(CHAVE_SALVAMENTO));
      if (salvo && salvo.niveis) {
        estado = salvo;
        for (const id in estado.niveis) estado.niveis[id] = Math.min(NIVEL_MAXIMO, Math.max(1, estado.niveis[id] | 0));
      }
    } catch (erro) { }
    // Compatibilidade com saves antigos: as áreas novas começam no nível 1.
    if (!estado.niveis) estado.niveis = {};
    for (const area of AREAS) {
      const nivelSalvo = Number(estado.niveis[area.id]);
      estado.niveis[area.id] = Number.isFinite(nivelSalvo) ? Math.min(NIVEL_MAXIMO, Math.max(1, nivelSalvo | 0)) : 1;
    }
    if (!Number.isFinite(estado.xp)) estado.xp = 0;
    function salvarProgresso() { try { localStorage.setItem(CHAVE_SALVAMENTO, JSON.stringify(estado)); } catch (erro) { } }

    // ======================= CENA 3D BÁSICA =======================
    const renderizador = new THREE.WebGLRenderer({ antialias: true });
    const canvas = renderizador.domElement;
    renderizador.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderizador.shadowMap.enabled = true;
    document.body.prepend(canvas);

    const cena = new THREE.Scene();
    cena.background = new THREE.Color(0x9fd8f5);
    cena.fog = new THREE.Fog(0x9fd8f5, 110, 260);
    const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 400);
    const luzHemisferio = new THREE.HemisphereLight(0xffffff, 0x6a8f4a, 0.75); cena.add(luzHemisferio);
    // materiais sem iluminação (água da cachoeira, névoa, gotas…) são escurecidos pelo ciclo dia/noite
    const MATERIAIS_DE_BRILHO = [];
    const brilhoNoturno = materialDeBrilho => { materialDeBrilho.userData.base = materialDeBrilho.color.clone(); MATERIAIS_DE_BRILHO.push(materialDeBrilho); return materialDeBrilho; };
    const sol = new THREE.DirectionalLight(0xfff2cc, 0.9);
    sol.position.set(26, 24, 18); sol.target.position.set(12, 0, 6); cena.add(sol.target);
    sol.castShadow = true;
    sol.shadow.mapSize.set(2048, 2048);
    Object.assign(sol.shadow.camera, { left: -44, right: 44, top: 44, bottom: -44, near: 1, far: 100 });
    cena.add(sol);
    const luaLuz = new THREE.DirectionalLight(0x9db8ff, 0); luaLuz.target = sol.target; cena.add(luaLuz); // luar (sem sombras)

    // ======================= FUNÇÕES AUXILIARES DE MODELAGEM =======================
    const cacheDeMateriais = {};

    function criarTexturaProcedural(cor) {
      const tamanho = 128;
      const canvasTextura = document.createElement('canvas');
      canvasTextura.width = canvasTextura.height = tamanho;
      const ctx = canvasTextura.getContext('2d');

      ctx.fillStyle = '#' + cor.toString(16).padStart(6, '0');
      ctx.fillRect(0, 0, tamanho, tamanho);

      let semente = cor || 1;
      function aleatorio() {
        semente = (semente * 1664525 + 1013904223) >>> 0;
        return semente / 4294967296;
      }

      for (let i = 0; i < 450; i++) {
        const alpha = 0.04 + aleatorio() * 0.13;
        ctx.fillStyle = aleatorio() > 0.5
          ? `rgba(255,255,255,${alpha})`
          : `rgba(0,0,0,${alpha})`;
        ctx.beginPath();
        ctx.arc(aleatorio() * tamanho, aleatorio() * tamanho, 1 + aleatorio() * 5, 0, Math.PI * 2);
        ctx.fill();
      }

      const textura = new THREE.CanvasTexture(canvasTextura);
      textura.wrapS = textura.wrapT = THREE.RepeatWrapping;
      textura.repeat.set(2, 2);
      return textura;
    }

    function material(cor, textura = false) {
      if (!cacheDeMateriais[cor]) {
        cacheDeMateriais[cor] = new THREE.MeshLambertMaterial({
          color: cor
        });
        if (textura) {
          cacheDeMateriais[cor].map = criarTexturaProcedural(cor)
        }
      }

      return cacheDeMateriais[cor];
    }
    function criarCaixa(largura, altura, profundidade, cor, x, y, z, pai) {
      const caixa = new THREE.Mesh(new THREE.BoxGeometry(largura, altura, profundidade), material(cor));
      caixa.position.set(x, y, z);
      caixa.castShadow = caixa.receiveShadow = true;
      pai.add(caixa);
      return caixa;
    }
    function criarCilindro(raioTopo, raioBase, altura, cor, x, y, z, pai, segmentos = 14) {
      const malha = new THREE.Mesh(new THREE.CylinderGeometry(raioTopo, raioBase, altura, segmentos), material(cor));
      malha.position.set(x, y, z);
      malha.castShadow = true;
      pai.add(malha);
      return malha;
    }
    function criarEsfera(raio, cor, x, y, z, pai, escalaY = 1) {
      const malha = new THREE.Mesh(new THREE.SphereGeometry(raio, 8, 6), material(cor));
      malha.position.set(x, y, z);
      malha.scale.y = escalaY;
      malha.castShadow = true;
      pai.add(malha);
      return malha;
    }
    function criarRoda(raio, largura, x, y, z, pai, corDoAro) {
      const roda = criarCilindro(raio, raio, largura, COR.pneu, x, y, z, pai);
      roda.rotation.z = Math.PI / 2;
      if (corDoAro) criarCilindro(raio * 0.55, raio * 0.55, largura + 0.04, corDoAro, x, y, z, pai).rotation.z = Math.PI / 2;
    }
    // base de grama sob cada área (como nas ilustrações isométricas)
    function base(grupo, largura, profundidade, cor = 0x8fd05a) { criarCaixa(largura, 0.15, profundidade, cor, 0, 0.02, 0, grupo); }
    // telhado de duas águas (prisma). largura = vão entre as águas; comprimento = ao longo do cume.
    function telhado(grupo, largura, comprimento, altura, cor, x, y, z, giro = 0) {
      const raio = altura / 1.5;
      const malha = new THREE.Mesh(new THREE.CylinderGeometry(raio, raio, comprimento, 3), material(cor));
      malha.rotation.x = -Math.PI / 2;
      malha.scale.x = largura / (raio * 1.732);
      malha.position.y = raio / 2;
      malha.castShadow = true;
      const pivo = new THREE.Group();
      pivo.add(malha);
      pivo.position.set(x, y, z);
      pivo.rotation.y = giro;
      grupo.add(pivo);
    }
    function cercaLinha(grupo, x1, z1, x2, z2) {
      const comp = Math.hypot(x2 - x1, z2 - z1), segmentos = Math.ceil(comp), angulo = Math.atan2(x2 - x1, z2 - z1);
      for (let i = 0; i <= segmentos; i++) criarCaixa(0.14, 0.8, 0.14, COR.madeira, x1 + (x2 - x1) * i / segmentos, 0.5, z1 + (z2 - z1) * i / segmentos, grupo);
      for (const y of [0.68, 0.42]) criarCaixa(0.07, 0.09, comp, COR.ripa, (x1 + x2) / 2, y, (z1 + z2) / 2, grupo).rotation.y = angulo;
    }
    function portao(grupo, centroX, z, larg = 1.7) { // portão fechado de duas folhas, com mourões altos e travessa em diagonal
      const corDaMadeira = 0xb9824a;
      for (const lado of [-1, 1]) { criarCaixa(0.18, 1.15, 0.18, COR.madeira, centroX + lado * larg / 2, 0.58, z, grupo); criarEsfera(0.1, 0xc98a4a, centroX + lado * larg / 2, 1.22, z, grupo); }
      const larguraDaFolha = larg / 2 - 0.14, angulo = Math.atan2(0.35, larguraDaFolha);
      for (const lado of [-1, 1]) {
        const x = centroX + lado * (larguraDaFolha / 2 + 0.07);
        for (const y of [0.4, 0.75]) criarCaixa(larguraDaFolha, 0.09, 0.06, corDaMadeira, x, y, z, grupo);
        for (const bordaDaFolha of [-1, 1]) criarCaixa(0.07, 0.44, 0.06, corDaMadeira, x + bordaDaFolha * (larguraDaFolha / 2 - 0.035), 0.575, z, grupo);
        criarCaixa(Math.hypot(larguraDaFolha, 0.35), 0.06, 0.05, corDaMadeira, x, 0.575, z + 0.01, grupo).rotation.z = -lado * angulo;
      }
    }
    // portoes: { N: deslocamentoX, S: deslocamentoX } abre uma passagem de 1,7 na cerca norte (z−) ou sul (z+)
    function cerca(grupo, largura, profundidade, portoes = {}) {
      const horiz = (z, deslocamentoX) => deslocamentoX === undefined ? cercaLinha(grupo, -largura / 2, z, largura / 2, z) : (cercaLinha(grupo, -largura / 2, z, deslocamentoX - 0.85, z), cercaLinha(grupo, deslocamentoX + 0.85, z, largura / 2, z));
      horiz(-profundidade / 2, portoes.N); horiz(profundidade / 2, portoes.S);
      if (portoes.N !== undefined) portao(grupo, portoes.N, -profundidade / 2);
      if (portoes.S !== undefined) portao(grupo, portoes.S, profundidade / 2);
      cercaLinha(grupo, -largura / 2, -profundidade / 2, -largura / 2, profundidade / 2); cercaLinha(grupo, largura / 2, -profundidade / 2, largura / 2, profundidade / 2);
    }
    // Cerca retangular regular: postes igualmente espaçados, trilhos exatos entre os cantos; portão central opcional.
    function cercaRetangular(grupo, largura, profundidade, portoes = []) {
      const trecho = (x1, z1, x2, z2, incluiUltimoPoste) => {
        const comprimentoDoTrecho = Math.hypot(x2 - x1, z2 - z1), quantidade = Math.max(1, Math.round(comprimentoDoTrecho / 1.1)), horiz = Math.abs(x2 - x1) > Math.abs(z2 - z1);
        for (let i = 0; i < quantidade + (incluiUltimoPoste ? 1 : 0); i++) criarCaixa(0.14, 0.85, 0.14, COR.madeira, x1 + (x2 - x1) * i / quantidade, 0.43, z1 + (z2 - z1) * i / quantidade, grupo);
        for (const y of [0.4, 0.7]) criarCaixa(horiz ? comprimentoDoTrecho : 0.07, 0.09, horiz ? 0.07 : comprimentoDoTrecho, COR.ripa, (x1 + x2) / 2, y, (z1 + z2) / 2, grupo);
      };
      const lado = (x1, z1, x2, z2, aberto) => {
        if (!aberto) return trecho(x1, z1, x2, z2, false);
        const metadeDaAbertura = 0.85 * Math.sign(x2 - x1);
        trecho(x1, z1, -metadeDaAbertura, z2, true); trecho(metadeDaAbertura, z1, x2, z2, false);
        portao(grupo, 0, z1);
      };
      lado(-largura / 2, -profundidade / 2, largura / 2, -profundidade / 2, portoes.includes('N')); trecho(largura / 2, -profundidade / 2, largura / 2, profundidade / 2, false);
      lado(largura / 2, profundidade / 2, -largura / 2, profundidade / 2, portoes.includes('S')); trecho(-largura / 2, profundidade / 2, -largura / 2, -profundidade / 2, false);
    }
    function arvore(grupo, x, z, escala = 1, y = 0) { // árvore de montanha (3 cones empilhados)
      criarCilindro(0.12 * escala, 0.18 * escala, 1.1 * escala, 0x6b4a2b, x, y + 0.55 * escala, z, grupo, 6);
      [[1.1, 1.5, 1.4], [0.85, 1.3, 2.2], [0.55, 1.1, 3.0]].forEach(([raio, altura, yDoPedaco], i) => {
        const malha = new THREE.Mesh(new THREE.ConeGeometry(raio * escala, altura * escala, 7), material(i % 2 ? 0x2f7a4a : 0x2a6b40));
        malha.position.set(x, y + yDoPedaco * escala, z); malha.castShadow = true; grupo.add(malha);
      });
    }

    const cacheDePlano = {};
    function materialPlano(cor) { // faces "facetadas" (visual low-poly) para montanhas
      return cacheDePlano[cor] || (cacheDePlano[cor] = new THREE.MeshLambertMaterial({ color: cor, flatShading: true }));
    }
    function pinheiro(grupo, x, z, escala = 1, y = 0) { // árvore de montanha (3 cones empilhados)
      criarCilindro(0.12 * escala, 0.18 * escala, 1.1 * escala, 0x6b4a2b, x, y + 0.55 * escala, z, grupo, 6);
      [[1.1, 1.5, 1.4], [0.85, 1.3, 2.2], [0.55, 1.1, 3.0]].forEach(([raio, altura, yDoPedaco], i) => {
        const malha = new THREE.Mesh(new THREE.ConeGeometry(raio * escala, altura * escala, 7), material(i % 2 ? 0x2f7a4a : 0x2a6b40));
        malha.position.set(x, y + yDoPedaco * escala, z); malha.castShadow = true; grupo.add(malha);
      });
    }
    function capim(grupo, x, z) {
      for (let i = 0; i < 4; i++) criarCaixa(0.05, 0.55, 0.05, 0x4f9e3a, x + (i - 1.5) * 0.08, 0.27, z + (i % 2) * 0.06, grupo).rotation.z = (i - 1.5) * 0.18;
    }
    function arbusto(grupo, x, z, flores = true) {
      criarEsfera(0.4, 0x4a9e3a, x, 0.35, z, grupo, 0.8);
      if (flores) [0xe84a5f, 0xffd23f, 0xff8fb1].forEach((cor, i) => criarCaixa(0.12, 0.12, 0.12, cor, x + (i - 1) * 0.22, 0.6, z + 0.25, grupo));
    }
    function pedra(grupo, x, z, escala = 0.4) {
      const malha = new THREE.Mesh(new THREE.DodecahedronGeometry(escala), material(0xb4b4aa));
      malha.position.set(x, escala * 0.5, z); malha.scale.y = 0.7; malha.castShadow = true; grupo.add(malha);
    }
    function criarMontanha(x, z, largura, altura, profundidade, cor) {
      const montanha = new THREE.Mesh(
        new THREE.ConeGeometry(largura, altura, 5),
        material(cor, true)
      );
      montanha.position.set(x, altura / 2 - 0.2, z);
      montanha.scale.z = profundidade / largura;
      montanha.castShadow = true;
      montanha.receiveShadow = true;
      cena.add(montanha);
    }

    function criarLago(x, z, largura, profundidade) {
      const agua = new THREE.Mesh(
        new THREE.CircleGeometry(1, 32),
        new THREE.MeshLambertMaterial({
          color: 0x55bddd,
          transparent: true,
          opacity: 0.88
        })
      );
      agua.rotation.x = -Math.PI / 2;
      agua.position.set(x, 0.07, z);
      agua.scale.set(largura, profundidade, 1);
      cena.add(agua);

      for (let i = 0; i < 36; i++) {
        const angulo = (i / 36) * Math.PI * 2;
        pedra(
          cena,
          x + Math.cos(angulo) * largura * 0.95,
          z + Math.sin(angulo) * profundidade * 0.95,
          0.3
        );
      }
    }

    function criarCachoeira() {
      const rocha = new THREE.Mesh(
        new THREE.ConeGeometry(9, 18, 5),

      );
      rocha.position.set(-24, 8.8, -36);
      rocha.scale.z = 0.8;

          opacity: 0.82,
          side: THREE.DoubleSide
        })
      );
      agua.position.set(-24, 5.2, -31);

      criarLago(-24, -25, 4.5, 2.8);
    }

    function barril(grupo, x, z) { criarCilindro(0.32, 0.32, 0.7, 0x7a4a2a, x, 0.45, z, grupo, 10); }
    function caixote(grupo, x, z) { criarCaixa(0.55, 0.45, 0.55, 0xa0703a, x, 0.32, z, grupo); }
    function fardo(grupo, x, y, z) { criarCaixa(0.8, 0.5, 0.6, COR.feno, x, y, z, grupo); }
    function janela(grupo, x, y, z, lateral) {
      criarCaixa(...(lateral ? [0.1, 0.67, 0.62] : [0.62, 0.67, 0.1]), 0x9a4a2a, x, y, z, grupo);
      criarCaixa(...(lateral ? [0.14, 0.5, 0.45] : [0.45, 0.5, 0.14]), COR.vidro, x, y, z, grupo);
    }
    function placa(grupo, x, z) { criarCaixa(0.1, 1.5, 0.1, COR.madeira, x, 0.75, z, grupo); criarCaixa(0.6, 0.45, 0.08, 0xc98a4a, x, 1.4, z, grupo); }

    // ======================= MODELOS REUTILIZÁVEIS =======================
    function criarTrator(pai, x, z, escala, cor, corDoAro) {
      const trator = new THREE.Group();
      criarCaixa(1.1, 0.7, 2, cor, 0, 0.95, 0, trator);
      criarCaixa(0.9, 0.9, 0.9, COR.vidro, 0, 1.7, -0.45, trator);
      criarCaixa(1, 0.08, 1, cor, 0, 2.2, -0.45, trator);
      criarCaixa(0.1, 0.6, 0.1, 0x333333, 0.35, 1.6, 0.7, trator);
      criarRoda(0.6, 0.4, -0.8, 0.6, -0.5, trator, corDoAro); criarRoda(0.6, 0.4, 0.8, 0.6, -0.5, trator, corDoAro);
      criarRoda(0.38, 0.3, -0.7, 0.38, 0.8, trator, corDoAro); criarRoda(0.38, 0.3, 0.7, 0.38, 0.8, trator, corDoAro);
      trator.scale.setScalar(escala);

    function reboque(grupo, x, z, giro) {
      const raio = new THREE.Group();
      raio.position.set(x, 0, z); raio.rotation.y = giro; grupo.add(raio);
      criarCaixa(1.6, 0.12, 2.4, 0x8a5a2a, 0, 0.7, 0, raio);
      criarCaixa(1.4, 0.05, 2.2, 0xe8e0d0, 0, 0.78, 0, raio);
      for (const lado of [-1, 1]) { criarCaixa(0.1, 0.5, 2.4, 0xa5703a, lado * 0.8, 0.95, 0, raio); criarCaixa(1.6, 0.5, 0.1, 0xa5703a, 0, 0.95, lado * 1.2, raio); }
      criarRoda(0.4, 0.3, -0.9, 0.4, -0.3, raio); criarRoda(0.4, 0.3, 0.9, 0.4, -0.3, raio);
      criarCaixa(0.1, 0.1, 1.4, 0x555555, 0, 0.55, 1.9, raio);
    }
    function arado(grupo, x, z, giro, cor) {
      const pivo = new THREE.Group();
      pivo.position.set(x, 0, z); pivo.rotation.y = giro; grupo.add(pivo);
      criarCaixa(3, 0.12, 0.3, cor, 0, 0.7, 0, pivo);
      for (let i = 0; i < 8; i++) criarCaixa(0.05, 0.55, 0.05, 0x555555, -1.3 + i * 0.37, 0.4, 0, pivo);
      criarRoda(0.3, 0.1, 1.6, 0.3, 0, pivo);
    }
    function abrigo(grupo, x, z) {
      for (const dx of [-1, 1]) for (const dz of [-0.9, 0.9]) criarCaixa(0.12, 1.5, 0.12, COR.madeira, x + dx, 0.85, z + dz, grupo);
      telhado(grupo, 2.7, 2.5, 0.8, 0xc98a3a, x, 1.6, z);
      criarCaixa(1.2, 0.35, 0.7, 0x2f6f6f, x, 0.3, z, grupo);
    }
    function cocho(grupo, x, z) { criarCaixa(1.6, 0.4, 0.6, 0x2f6f6f, x, 0.3, z, grupo); criarCaixa(1.4, 0.05, 0.4, 0x5ec7e0, x, 0.5, z, grupo); }

    // casinha de galinha elevada, com rampa, janela e caixa de ninhos (a frente fica virada para +Z)
    function casinhaDeGalinha(grupo, x, z, corParede = 0xc0522f) {
      const casinha = new THREE.Group();
      casinha.position.set(x, 0, z);
      grupo.add(casinha);
      for (const dx of [-0.6, 0.6]) for (const dz of [-0.45, 0.45]) criarCaixa(0.1, 0.5, 0.1, COR.madeira, dx, 0.25, dz, casinha); // pernas
      criarCaixa(1.6, 1, 1.2, corParede, 0, 1, 0, casinha);                            // corpo
      telhado(casinha, 1.6, 2, 0.6, COR.telhaCasa, 0, 1.5, 0, Math.PI / 2);            // telhado
      criarCaixa(0.4, 0.5, 0.05, 0x3a2a1a, 0.3, 0.95, 0.62, casinha);                  // porta
      criarCaixa(0.4, 0.04, 0.9, COR.ripa, 0.3, 0.4, 0.95, casinha).rotation.x = 0.75; // rampa
      janela(casinha, -0.4, 1.1, 0.62, false);
      criarCaixa(0.35, 0.4, 1, COR.ripa, 1, 1.1, 0, casinha);                          // caixa de ninhos
    }

    // poça de lama oval (dois cilindros achatados, um mais claro por cima)
    function pocaDeLama(grupo, x, z, raio) {
      criarCilindro(raio, raio, 0.06, 0x5b3a22, x, 0.13, z, grupo, 20).scale.z = 0.7;
      criarCilindro(raio * 0.6, raio * 0.6, 0.06, 0x70492c, x + raio * 0.1, 0.16, z, grupo, 16).scale.z = 0.7;
    }

    const RAIO_DA_HITBOX = { galinha: 0.3, ovelha: 0.5, vaca: 0.8, porco: 0.5, cavalo: 0.85 };

    // diz se um animal (círculo de centro x,z) pode ficar nessa posição sem bater em nada
    function posicaoEstaLivre(cercado, animalAtual, x, z, raio) {
      if (Math.abs(x) > cercado.limiteX - raio || Math.abs(z) > cercado.limiteZ - raio) return false; // cerca
      for (const obstaculo of cercado.obstaculos) { // retângulos (abrigo, cocho...)
        const pontoMaisProximoX = Math.min(obstaculo.maxX, Math.max(obstaculo.minX, x));
        const pontoMaisProximoZ = Math.min(obstaculo.maxZ, Math.max(obstaculo.minZ, z));
        if (Math.hypot(x - pontoMaisProximoX, z - pontoMaisProximoZ) < raio) return false;
      }
      return !cercado.animais.some(outro => outro !== animalAtual && Math.hypot(x - outro.x, z - outro.z) < raio + outro.raio);
    }

    // ---- modelos de animais: formas arredondadas (elipsoides), pernas articuladas com cascos/pés, rostos com olhos ----
    const REGISTRO_SONS_ANIMAIS = []; // [tipo, grupo3D] — lido pelo sistema de áudio
    const elipse = (pai, raioX, raioY, raioZ, cor, x, y, z, giroX = 0, giroZ = 0) => {
      const malha = new THREE.Mesh(new THREE.SphereGeometry(1, 10, 8), material(cor));
      malha.scale.set(raioX, raioY, raioZ); malha.position.set(x, y, z); malha.rotation.set(giroX, 0, giroZ); malha.castShadow = true; pai.add(malha); return malha;
    };
    const ponta = (pai, raio, altura, cor, x, y, z, giroX = 0, giroZ = 0) => {
      const malha = new THREE.Mesh(new THREE.ConeGeometry(raio, altura, 6), material(cor));
      malha.position.set(x, y, z); malha.rotation.set(giroX, 0, giroZ); malha.castShadow = true; pai.add(malha); return malha;
    };
    function perna(animal, x, yQuadril, z, comp, raio, cor, casco, fase, lista, dedos) { // pivô no quadril; o pé encosta em y = 0
      const pivo = new THREE.Group(); pivo.position.set(x, yQuadril, z); animal.add(pivo);
      criarCilindro(raio * 0.85, raio, comp, cor, 0, -comp / 2, 0, pivo, 8);
      if (dedos) for (let k = -1; k <= 1; k++) criarCaixa(0.028, 0.025, 0.13, casco, k * 0.04, -comp + 0.012, 0.05, pivo).rotation.y = k * 0.4;
      else criarCilindro(raio * 1.12, raio * 1.2, 0.09, casco, 0, -comp + 0.045, 0, pivo, 8);
      lista.push([pivo, fase]);
    }
    function montarAnimal(tipo) {
      const animal = new THREE.Group(), pernas = []; let cabeca = null;
      const paridade = (ladoX, ladoZ) => (ladoX * ladoZ > 0 ? 0 : Math.PI);
      if (tipo === 'galinha') {
        const pena = [0xd2691e, 0xf4efe4, 0xb5651d][Math.floor(Math.random() * 3)], corDaAsa = pena === 0xf4efe4 ? 0xdcd3bd : 0x8f4a14;
        elipse(animal, 0.21, 0.2, 0.27, pena, 0, 0.45, 0);
        elipse(animal, 0.16, 0.17, 0.14, pena, 0, 0.46, 0.2);                                              // peito
        for (const lado of [-1, 1]) elipse(animal, 0.05, 0.14, 0.2, corDaAsa, lado * 0.2, 0.47, -0.02, 0, lado * 0.25);  // asas
        for (let i = -1; i <= 1; i++) elipse(animal, 0.035, 0.17, 0.07, i ? corDaAsa : pena, i * 0.06, 0.62, -0.3, -0.5, i * 0.25); // cauda em leque
        cabeca = new THREE.Group(); cabeca.position.set(0, 0.62, 0.2); animal.add(cabeca);
        elipse(cabeca, 0.1, 0.105, 0.1, pena, 0, 0.04, 0.03);
        ponta(cabeca, 0.04, 0.11, 0xf2b72b, 0, 0.02, 0.15, Math.PI / 2);                              // bico
        for (let i = 0; i < 3; i++) elipse(cabeca, 0.03, i === 1 ? 0.06 : 0.04, 0.03, 0xe03a2a, 0, 0.14, 0.07 - i * 0.04); // crista
        elipse(cabeca, 0.025, 0.05, 0.025, 0xe03a2a, 0, -0.06, 0.12);                                 // barbela
        for (const lado of [-1, 1]) elipse(cabeca, 0.018, 0.018, 0.018, 0x111111, lado * 0.085, 0.07, 0.07);
        for (const lado of [-1, 1]) perna(animal, lado * 0.09, 0.3, 0, 0.3, 0.022, 0xe8a526, 0xe8a526, paridade(lado, 1), pernas, true); // pés com três dedos
      }
      if (tipo === 'vaca') {
        elipse(animal, 0.5, 0.45, 0.88, 0xffffff, 0, 1.02, 0);
        elipse(animal, 0.4, 0.38, 0.45, 0xffffff, 0, 1.12, 0.55);
        elipse(animal, 0.28, 0.27, 0.34, 0xffffff, 0, 1.2, 1.1);
        elipse(animal, 0.2, 0.15, 0.14, 0xf2a0b5, 0, 1.08, 1.4);
        for (const lado of [-1, 1]) {
          elipse(animal, 0.03, 0.03, 0.03, 0x222222, lado * 0.09, 1.11, 1.52);                                // narinas
          elipse(animal, 0.035, 0.035, 0.035, 0x111111, lado * 0.2, 1.3, 1.32);                               // olhos
          elipse(animal, 0.17, 0.07, 0.1, 0x2b2b2b, lado * 0.36, 1.33, 1.0, 0, lado * 0.4);                      // orelhas
          ponta(animal, 0.06, 0.2, 0xf0e6c8, lado * 0.17, 1.52, 1.0, 0, -lado * 0.5);                            // chifres
        }
        elipse(animal, 0.05, 0.2, 0.3, 0x2b2b2b, 0.47, 1.1, 0.15); elipse(animal, 0.05, 0.17, 0.25, 0x2b2b2b, -0.47, 0.98, -0.35);
        elipse(animal, 0.3, 0.05, 0.25, 0x2b2b2b, 0.05, 1.46, -0.1); elipse(animal, 0.2, 0.06, 0.12, 0x2b2b2b, 0.1, 1.45, 1.1);
        elipse(animal, 0.17, 0.13, 0.2, 0xf2a0b5, 0, 0.62, -0.35);                                          // úbere
        const rabo = new THREE.Group(); rabo.position.set(0, 1.3, -0.88); rabo.rotation.x = 0.15; animal.add(rabo);
        criarCilindro(0.03, 0.03, 0.7, 0xffffff, 0, -0.35, 0, rabo, 6); elipse(rabo, 0.07, 0.12, 0.07, 0x2b2b2b, 0, -0.75, 0);
        for (const ladoX of [-1, 1]) for (const ladoZ of [-1, 1]) perna(animal, ladoX * 0.3, 0.68, ladoZ * 0.55, 0.68, 0.11, 0xffffff, 0x3a2a20, paridade(ladoX, ladoZ), pernas);
      }
      if (tipo === 'ovelha') {
        const tonsDeLa = [0xf4f1e8, 0xe9e2d0];
        elipse(animal, 0.42, 0.37, 0.55, tonsDeLa[0], 0, 0.74, 0);
        [[-0.3, 0.82, 0.28], [0.3, 0.82, 0.28], [-0.3, 0.82, -0.25], [0.3, 0.82, -0.25], [0, 1.0, 0.05], [0, 0.62, -0.5], [-0.34, 0.62, 0.05], [0.34, 0.62, 0.05], [0, 0.9, 0.45]]
          .forEach(([x, y, z], i) => elipse(animal, 0.27, 0.25, 0.28, tonsDeLa[i % 2], x, y, z));                    // lã em tufos sobrepostos
        elipse(animal, 0.16, 0.18, 0.21, 0x4a4038, 0, 0.78, 0.66); elipse(animal, 0.14, 0.1, 0.14, tonsDeLa[0], 0, 0.97, 0.58);
        elipse(animal, 0.05, 0.045, 0.04, 0x222222, 0, 0.72, 0.86);
        for (const lado of [-1, 1]) { elipse(animal, 0.12, 0.05, 0.08, 0x4a4038, lado * 0.2, 0.82, 0.6, 0, lado * 0.5); elipse(animal, 0.025, 0.025, 0.025, 0x111111, lado * 0.09, 0.84, 0.8); }
        for (const ladoX of [-1, 1]) for (const ladoZ of [-1, 1]) perna(animal, ladoX * 0.2, 0.4, ladoZ * 0.3, 0.4, 0.06, 0x4a4038, 0x2a2420, paridade(ladoX, ladoZ), pernas);
      }
      if (tipo === 'cavalo') {
        const pelo = [0x8b542f, 0x6b402b, 0xa66a3e, 0x4b3026][Math.floor(Math.random() * 4)], escuro = 0x30251e;
        elipse(animal, 0.4, 0.43, 0.82, pelo, 0, 1.12, 0);
        elipse(animal, 0.19, 0.46, 0.22, pelo, 0, 1.55, 0.68, 0.55);                                        // pescoço
        elipse(animal, 0.15, 0.18, 0.37, pelo, 0, 1.9, 1.08, 0.5);                                          // cabeça
        elipse(animal, 0.11, 0.12, 0.13, escuro, 0, 1.76, 1.36, 0.5);                                       // focinho
        for (const lado of [-1, 1]) { ponta(animal, 0.05, 0.16, pelo, lado * 0.1, 2.12, 0.92, 0.2, -lado * 0.15); elipse(animal, 0.025, 0.025, 0.025, 0x111111, lado * 0.13, 1.95, 1.2); }
        for (let i = 0; i < 5; i++) elipse(animal, 0.06, 0.09, 0.07, escuro, 0, 1.98 - i * 0.14 + 0.0, 0.62 - i * 0.07 - 0.2 + 0.2, 0.4); // crina
        elipse(animal, 0.08, 0.42, 0.1, escuro, 0, 0.98, -0.9, -0.25);                                      // cauda
        for (const ladoX of [-1, 1]) for (const ladoZ of [-1, 1]) perna(animal, ladoX * 0.26, 0.8, ladoZ * 0.52, 0.8, 0.085, pelo, escuro, paridade(ladoX, ladoZ), pernas);
      }
      if (tipo === 'porco') {
        elipse(animal, 0.38, 0.34, 0.56, 0xf2a0b5, 0, 0.52, 0);
        elipse(animal, 0.26, 0.25, 0.27, 0xf2a0b5, 0, 0.56, 0.58);
        criarCilindro(0.12, 0.13, 0.12, 0xe58aa2, 0, 0.5, 0.84, animal, 10).rotation.x = Math.PI / 2;      // focinho
        for (const lado of [-1, 1]) { elipse(animal, 0.02, 0.025, 0.02, 0x7a3a4a, lado * 0.04, 0.5, 0.91); elipse(animal, 0.025, 0.025, 0.025, 0x111111, lado * 0.12, 0.65, 0.78); ponta(animal, 0.09, 0.17, 0xe58aa2, lado * 0.17, 0.78, 0.5, 0.9, -lado * 0.35); }
        const rabo = new THREE.Mesh(new THREE.TorusGeometry(0.06, 0.016, 6, 10), material(0xe58aa2)); rabo.position.set(0, 0.6, -0.57); animal.add(rabo);
        for (const ladoX of [-1, 1]) for (const ladoZ of [-1, 1]) perna(animal, ladoX * 0.2, 0.26, ladoZ * 0.33, 0.26, 0.07, 0xf2a0b5, 0xb86a80, paridade(ladoX, ladoZ), pernas);
      }
      return { animal, pernas, cabeca };
    }

    function criarAnimal(pai, animacoes, tipo, cercado) {
      const modelo = montarAnimal(tipo), animal = modelo.animal;
      pai.add(animal);
      REGISTRO_SONS_ANIMAIS.push([tipo, animal]);
      const raio = RAIO_DA_HITBOX[tipo];
      const dados = { x: 0, z: 0, raio };
      for (let tentativa = 0; tentativa < 50; tentativa++) { // posição inicial livre
        const x = (Math.random() * 2 - 1) * (cercado.limiteX - raio);
        const z = (Math.random() * 2 - 1) * (cercado.limiteZ - raio);
        if (posicaoEstaLivre(cercado, dados, x, z, raio)) { dados.x = x; dados.z = z; break; }
      }
      cercado.animais.push(dados);

      let direcao = Math.random() * Math.PI * 2;
      const velocidade = 0.4 + Math.random() * 0.4;
      const fase = Math.random() * 6;
      let segundosAteVirar = 1 + Math.random() * 3;

      animacoes.push((tempo, segundosDesdeUltimoFrame) => {
        segundosAteVirar -= segundosDesdeUltimoFrame;
        if (segundosAteVirar <= 0) { direcao += (Math.random() - 0.5) * Math.PI; segundosAteVirar = 1 + Math.random() * 3; }

        const novoX = dados.x + Math.sin(direcao) * velocidade * segundosDesdeUltimoFrame;
        const novoZ = dados.z + Math.cos(direcao) * velocidade * segundosDesdeUltimoFrame;
        if (posicaoEstaLivre(cercado, dados, novoX, novoZ, raio)) { dados.x = novoX; dados.z = novoZ; }
        else direcao += Math.PI / 2 + Math.random() * Math.PI / 2; // bateu: vira

        animal.position.set(dados.x, 0.1 + Math.abs(Math.sin(tempo * 5 + fase)) * 0.05, dados.z);
        animal.rotation.y = direcao;
        for (const [pivo, fase] of modelo.pernas) pivo.rotation.x = Math.sin(tempo * 7 + fase) * 0.5;                  // passada
        if (modelo.cabeca) modelo.cabeca.rotation.x = Math.max(0, Math.sin(tempo * 3 + fase)) * 0.55;          // bicadas
      });
    };

    // ======================= CENÁRIO FIXO =======================
    const chao = new THREE.Mesh(new THREE.PlaneGeometry(1000, 1000), material(0x78b24a));
    chao.rotation.x = -Math.PI / 2;
    chao.receiveShadow = true;
    cena.add(chao);
    // == REDE DE CAMINHOS ==
    // Cada trecho é [x1, z1, x2, z2, largura], alinhado a um eixo. As pontas avançam meia largura, então cantos e
    // entroncamentos se encontram sem frestas; ramais terminam dentro da base da construção ou em praças.
    const COR_ESTRADA = 0xd9b97a;
    const ROTAS = [
      [0, -16.5, 0, 13.5, 2.4],         // espinha norte-sul
      [-15.5, -16.5, 0, -16.5, 2.4],    // mirante da cachoeira
      [-27, -1, 43, -1, 2.4],           // leste-oeste (cruza a ponte)
      [29, -1, 29, 27.5, 2.4],          // anel leste até o lago
      [-8, 13.5, 29, 13.5, 2.4],        // leste-oeste sul
      [43, -1, 43, 4.5, 2.4],           // entrada da grande plantação

      if (tipo === 'couve') {          // cabeça redonda com folhas abertas
        criarEsfera(0.26 * variacao, pronto ? 0x3f8f5a : 0x5fae6e, 0, 0.24 * variacao, 0, planta, 0.9);
        for (let k = 0; k < 5; k++) {
          const folha = criarCaixa(0.34, 0.04, 0.22, 0x56a870, Math.cos(k * 1.26) * 0.2, 0.1, Math.sin(k * 1.26) * 0.2, planta);
          folha.rotation.y = -k * 1.26; folha.rotation.z = 0.2;
        }
      } else if (tipo === 'alface') {  // roseta clara e ondulada
        for (let k = 0; k < 6; k++) criarEsfera(0.17 * variacao, k % 2 ? (pronto ? 0x9fd35a : 0xb5dc7a) : (pronto ? 0x85c24a : 0xa3d062), Math.cos(k * 1.05) * 0.16, 0.13, Math.sin(k * 1.05) * 0.16, planta, 0.55);

      } else if (tipo === 'beterraba') { // raiz vermelha que cresce e aparece acima da terra

        for (let k = 0; k < 4; k++) {
          const folha = criarCaixa(0.1, 0.38 * variacao, 0.04, k % 2 ? 0x9b2f55 : 0x7a2a4a, Math.cos(k * 1.57) * 0.08, 0.24, Math.sin(k * 1.57) * 0.08, planta);
          folha.rotation.y = k * 0.8; folha.rotation.x = 0.35;
        }
      } else {                         // tomateiro: frutos verdes (estágio 2) e vermelhos (estágio 3)
        criarCaixa(0.05, 1.2, 0.05, COR.madeira, 0, 0.6, 0, planta);
        criarEsfera(0.28, 0x3c8c3a, 0, 0.65, 0, planta, 1.2);
        for (let k = 0; k < 4; k++) criarEsfera(0.09, pronto ? 0xe03a2a : 0x8fc24a, Math.cos(k * 1.6) * 0.22, 0.45 + k * 0.14, Math.sin(k * 1.6) * 0.22, planta);
      }
    }

    // ======================= CONSTRUTORES DAS ÁREAS (3 níveis, baseados nas ilustrações) =======================
    const construtoresDasAreas = {

      // N1 casinha de madeira · N2 varanda, água-furtada e jardim · N3 casarão com ala, lago e pérgola
      casa(grupo, nivel, animacoes) {
        const largura = [3.2, 3.8, 4.2][nivel - 1], profundidade = [3.4, 3.8, 4.2][nivel - 1], altura = [1.8, 2, 2.2][nivel - 1];
        const larguraBase = nivel === 3 ? 10.5 : 8, profundidadeBase = nivel === 3 ? 10 : 7.5;
        base(grupo, larguraBase, profundidadeBase);
        criarCaixa(largura, altura, profundidade, 0xdcc08e, 0, altura / 2, 0, grupo);
        criarCaixa(largura + 0.1, 0.3, profundidade + 0.1, 0x8a8a80, 0, 0.15, 0, grupo);
        telhado(grupo, profundidade + 0.5, largura + 0.5, 1.6, COR.telhaCasa, 0, altura, 0, Math.PI / 2);
        criarCaixa(0.7, 1.2, 0.1, 0x7a4a2a, 0, 0.7, profundidade / 2 + 0.04, grupo);
        for (const lado of [-1, 1]) { janela(grupo, lado * largura * 0.3, 1.2, profundidade / 2 + 0.04, false); janela(grupo, lado * (largura / 2 + 0.02), 1.2, -profundidade * 0.15, true); }

        // varanda (todos os níveis); grade a partir do nível 2
        const larguraDaVaranda = largura * 0.8, alturaDaVaranda = altura - 0.25;
        criarCaixa(larguraDaVaranda, 0.12, 1.3, 0xb98a55, 0, 0.1, profundidade / 2 + 0.65, grupo);
        criarCaixa(larguraDaVaranda + 0.3, 0.1, 1.6, COR.telhaCasa, 0, altura - 0.1, profundidade / 2 + 0.75, grupo).rotation.x = 0.25;
        for (const lado of [-1, 1]) criarCaixa(0.12, alturaDaVaranda, 0.12, 0xf2ead8, lado * larguraDaVaranda / 2, alturaDaVaranda / 2, profundidade / 2 + 1.25, grupo);
        if (nivel >= 2) criarCaixa(larguraDaVaranda, 0.35, 0.06, 0xf2ead8, 0, 0.45, profundidade / 2 + 1.3, grupo);

        // chaminé com fumaça
        const chamines = [[largura * 0.25, altura + 1.1, -profundidade * 0.1, 1.5]];
        if (nivel === 3) chamines.push([-largura * 0.15, altura + 0.9, -profundidade / 2 - 1.8, 1.3]);
        for (const [xChamine, yChamine, zChamine, alturaDaChamine] of chamines) criarCaixa(0.55, alturaDaChamine, 0.55, 0xe6dfd0, xChamine, yChamine, zChamine, grupo);
        const [xDaFumaca, yDaFumaca, zDaFumaca] = chamines[0];
        for (let i = 0; i < 4; i++) {

          grupo.add(fumaca);
          animacoes.push(tempo => { const progresso = (tempo * 0.3 + i / 4) % 1; fumaca.position.set(xDaFumaca + progresso * 0.8, yDaFumaca + 1 + progresso * 2.2, zDaFumaca); fumaca.scale.setScalar(0.5 + progresso); fumaca.material.opacity = 0.7 * (1 - progresso); });
        }
        // água-furtada
        if (nivel >= 2) for (const xDaAguaFurtada of (nivel === 2 ? [0] : [-largura * 0.25, largura * 0.25])) {
          criarCaixa(0.9, 1, 0.7, 0xdcc08e, xDaAguaFurtada, altura + 0.85, profundidade * 0.25, grupo);

        }
        // jardim, cerca e árvores
        const quantidadeDeArbustos = [2, 5, 8][nivel - 1];
        for (let i = 0; i < quantidadeDeArbustos; i++) arbusto(grupo, (i % 2 ? 1 : -1) * (largura / 2 + 0.5), profundidade / 2 - 0.3 + Math.floor(i / 2) * 0.8);
        if (nivel === 1) {
          cercaLinha(grupo, larguraBase / 2 - 0.4, -1, larguraBase / 2 - 0.4, 2.5);
          criarCaixa(0.1, 1, 0.1, COR.madeira, 2.8, 0.5, profundidadeBase / 2 - 0.8, grupo); criarCaixa(0.3, 0.25, 0.4, 0x2f6fb0, 2.8, 1.05, profundidadeBase / 2 - 0.8, grupo);
        } else cercaLinha(grupo, -larguraBase / 2 + 0.4, -profundidadeBase / 2 + 1, -larguraBase / 2 + 0.4, profundidadeBase / 2 - 1);

          janela(grupo, -largura * 0.15 - 1.42, 1.2, -profundidade / 2 - 1, true);
          // lago de pedras
          criarCilindro(1.2, 1.2, 0.1, 0x9a9a90, 3.9, 0.12, 2.6, grupo, 18);
          criarCilindro(1, 1, 0.1, 0x4aa8c8, 3.9, 0.15, 2.6, grupo, 18);
          // pérgola
          for (const dx of [-0.9, 0.9]) for (const dz of [-0.9, 0.9]) criarCaixa(0.12, 1.8, 0.12, 0x8a5a2a, 3.9 + dx, 0.9, -2.6 + dz, grupo);
          for (let i = 0; i < 4; i++) criarCaixa(2.2, 0.08, 0.12, 0xa06a35, 3.9, 1.85, -3.4 + i * 0.55, grupo);
          arvore(grupo, -larguraBase / 2 + 1.2, -profundidadeBase / 2 + 1.2, 1);
          arvore(grupo, -larguraBase / 2 + 1, profundidadeBase / 2 - 1.5, 0.8);

      },

      // N1 celeiro com janelas · N2 maior, com fardos · N3 silo e telheiro lateral
      celeiro(grupo, nivel) {
        const largura = [3.4, 3.8, 4.2][nivel - 1], profundidade = [3.8, 4.4, 4.8][nivel - 1], altura = [2.2, 2.4, 2.6][nivel - 1];
        const larguraBase = nivel === 3 ? 10.5 : 8;

        const forma = new THREE.Shape();
        [[-largura / 2, 0], [largura / 2, 0], [largura / 2, altura], [largura * 0.3, altura + 1], [0, altura + 1.6], [-largura * 0.3, altura + 1], [-largura / 2, altura]].forEach(([x, y], i) => i ? forma.lineTo(x, y) : forma.moveTo(x, y));
        const corpo = new THREE.Mesh(new THREE.ExtrudeGeometry(forma, { depth: profundidade, bevelEnabled: false }), material(0xc0392b));

          criarCaixa(Math.hypot(x2 - x1, y2 - y1) + 0.05, 0.16, profundidade + 0.6, 0x4b5060, (x1 + x2) / 2, (y1 + y2) / 2 + 0.08, 0, grupo).rotation.z = Math.atan2(y2 - y1, x2 - x1);

        for (const lado of [-1, 1]) criarCaixa(0.08, altura, 0.08, COR.branco, lado * largura / 2, altura / 2, profundidade / 2 + 0.02, grupo);
        // portão com X e janela do sótão
        const alturaDoPortao = altura * 0.8;
        criarCaixa(1.6, alturaDoPortao, 0.1, COR.branco, 0, alturaDoPortao / 2, profundidade / 2 + 0.03, grupo);
        criarCaixa(1.4, alturaDoPortao - 0.2, 0.12, 0xa82e22, 0, alturaDoPortao / 2, profundidade / 2 + 0.05, grupo);
        for (const lado of [-1, 1]) criarCaixa(0.06, Math.hypot(1.4, alturaDoPortao - 0.2), 0.14, COR.branco, 0, alturaDoPortao / 2, profundidade / 2 + 0.06, grupo).rotation.z = lado * Math.atan(1.4 / (alturaDoPortao - 0.2));
        criarCaixa(0.8, 0.8, 0.1, COR.branco, 0, altura + 0.45, profundidade / 2 + 0.04, grupo);
        criarCaixa(0.6, 0.6, 0.12, 0x7a2a20, 0, altura + 0.45, profundidade / 2 + 0.05, grupo);

        if (nivel === 1) {
          for (const z of [-0.8, 0.9]) { criarCaixa(0.1, 0.55, 0.45, COR.branco, largura / 2 + 0.02, 1, z, grupo); criarCaixa(0.14, 0.4, 0.3, COR.vidro, largura / 2 + 0.02, 1, z, grupo); }
          barril(grupo, largura / 2 + 0.6, profundidade / 2 - 0.4);
          arbusto(grupo, largura / 2 + 0.5, 0.2, false);
        } else {
          fardo(grupo, largura / 2 + 0.9, 0.25, 0.5); fardo(grupo, largura / 2 + 0.9, 0.25, 1.2); fardo(grupo, largura / 2 + 1, 0.75, 0.85);
          barril(grupo, largura / 2 + 0.5, profundidade / 2 - 0.2); caixote(grupo, largura / 2 + 1.2, -1.4);
        }
        if (nivel === 3) {
          // silo
          const ladoX = -largura / 2 - 1.1, alturaDoSilo = altura + 2.2;
          criarCilindro(0.85, 0.85, alturaDoSilo, 0xc0392b, ladoX, alturaDoSilo / 2, -0.5, grupo, 16);
          for (const y of [1.2, 2.6, 4]) criarCilindro(0.87, 0.87, 0.12, COR.branco, ladoX, y, -0.5, grupo, 16);
          const cupula = new THREE.Mesh(new THREE.SphereGeometry(0.85, 16, 8, 0, Math.PI * 2, 0, Math.PI / 2), material(0xc4c8cc));
          cupula.position.set(ladoX, alturaDoSilo, -0.5); grupo.add(cupula);

          for (const z of [-1.5, 1.8]) criarCaixa(0.12, altura * 0.55, 0.12, 0xb98a55, largura / 2 + 2.4, altura * 0.275, z, grupo);
          fardo(grupo, largura / 2 + 1.2, 0.25, -0.6); fardo(grupo, largura / 2 + 1.2, 0.25, 0.4); fardo(grupo, largura / 2 + 1.3, 0.75, -0.1);
          arvore(grupo, larguraBase / 2 - 0.8, -2.5, 0.9);
        } else {
          arvore(grupo, -largura / 2 - 1.6, -profundidade / 2 + 0.8, 0.9);

      // N1 cercado com vaca · N2 vaca e ovelhas · N3 fazendinha cheia com cata-vento
      curral(grupo, nivel, animacoes) {
        const larguraDoCercado = [6, 7.2, 8.8][nivel - 1], profundidadeDoCercado = [5, 6, 7.2][nivel - 1];
        base(grupo, larguraDoCercado + 0.9, profundidadeDoCercado + 0.9, 0x7fc650);
        cerca(grupo, larguraDoCercado, profundidadeDoCercado, { S: 1.6 });
        arvore(grupo, larguraDoCercado / 2 - 0.3, -profundidadeDoCercado / 2 - 0.6, 1);
        abrigo(grupo, larguraDoCercado / 2 - 1.6, -profundidadeDoCercado / 2 + 1.4);
        cocho(grupo, -0.1, profundidadeDoCercado / 2 - 0.9);
        placa(grupo, -larguraDoCercado / 2 - 0.2, profundidadeDoCercado / 2 - 0.5);
        if (nivel === 3) {

        );
        const cercado = {
          limiteX: larguraDoCercado / 2 - 0.1, limiteZ: profundidadeDoCercado / 2 - 0.1, animais: [],
          obstaculos: retangulos.map(([x, z, largura, prof]) => ({ minX: x - largura / 2, maxX: x + largura / 2, minZ: z - prof / 2, maxZ: z + prof / 2 })),
        };
        if (MOSTRAR_HITBOXES) retangulos.forEach(([x, z, largura, prof]) => criarCaixa(largura, 0.05, prof, 0xff0000, x, 0.2, z, grupo));
        const quantidade = { vaca: [1, 2, 4][nivel - 1] }; // ovelhas ficam em um cercado próprio
        for (const tipo in quantidade) for (let i = 0; i < quantidade[tipo]; i++)
          criarAnimal(grupo, animacoes, tipo, cercado);
      },

      // Ovelhal: cercado retangular regular com portão ao norte, abrigo e cochos dentro dos limites, só ovelhas.
      ovelhal(grupo, nivel, animacoes) {
        const larguraDoCercado = [6, 7.5, 9][nivel - 1], profundidadeDoCercado = [5, 6.2, 7.5][nivel - 1];
        base(grupo, larguraDoCercado + 0.9, profundidadeDoCercado + 0.9, 0x9dce68);

        abrigo(grupo, xDoAbrigo, zDoAbrigo);
        cocho(grupo, -larguraDoCercado / 2 + 1.4, profundidadeDoCercado / 2 - 0.8);
        const retangulo = (x, z, largura, profundidade) => ({ minX: x - largura / 2, maxX: x + largura / 2, minZ: z - profundidade / 2, maxZ: z + profundidade / 2 });
        const obstaculos = [retangulo(xDoAbrigo, zDoAbrigo, 2.3, 1.9), retangulo(-larguraDoCercado / 2 + 1.4, profundidadeDoCercado / 2 - 0.8, 1.8, 0.8)];
        if (nivel >= 2) { fardo(grupo, -larguraDoCercado / 2 + 1.2, 0.25, -profundidadeDoCercado / 2 + 0.9); barril(grupo, larguraDoCercado / 2 - 0.7, -profundidadeDoCercado / 2 + 0.8); obstaculos.push(retangulo(-larguraDoCercado / 2 + 1.2, -profundidadeDoCercado / 2 + 0.9, 1, 0.8), retangulo(larguraDoCercado / 2 - 0.7, -profundidadeDoCercado / 2 + 0.8, 0.8, 0.8)); }
        if (nivel === 3) { abrigo(grupo, -larguraDoCercado / 2 + 1.5, -profundidadeDoCercado / 2 + 1.3); cocho(grupo, 0, profundidadeDoCercado / 2 - 0.8); obstaculos.push(retangulo(-larguraDoCercado / 2 + 1.5, -profundidadeDoCercado / 2 + 1.3, 2.3, 1.9), retangulo(0, profundidadeDoCercado / 2 - 0.8, 1.8, 0.8)); }
        const cercado = { limiteX: larguraDoCercado / 2 - 0.1, limiteZ: profundidadeDoCercado / 2 - 0.1, animais: [], obstaculos };
        for (let i = 0; i < [2, 4, 6][nivel - 1]; i++) criarAnimal(grupo, animacoes, 'ovelha', cercado);
      },

      // Estábulo: edifício aberto na frente (baias, feno), de frente para o caminho (norte); portão na cerca norte.
      // O modelo é montado num grupo girado 180° (fundo do edifício ao sul), por isso as hitboxes são espelhadas.
      estabulo(grupo, nivel, animacoes) {
        const larguraDoCercado = [7.6, 9, 10.4][nivel - 1], profundidadeDoCercado = [7.6, 8.4, 9.2][nivel - 1];
        const modeloGirado = new THREE.Group(); modeloGirado.rotation.y = Math.PI; grupo.add(modeloGirado);
        base(modeloGirado, larguraDoCercado + 1.2, profundidadeDoCercado + 1.2, 0x8fbd56);
        cercaRetangular(modeloGirado, larguraDoCercado, profundidadeDoCercado, ['S']);
        const larguraDoCorpo = larguraDoCercado - 1.6, profundidadeDoCorpo = 2.8, altura = 2.2, baias = [2, 3, 4][nivel - 1];

        for (let k = 0; k <= baias; k++) criarCaixa(0.16, altura, 0.16, COR.madeira, -larguraDoCorpo / 2 + k * larguraDoCorpo / baias, altura / 2, zFrente, modeloGirado);
        for (let k = 0; k < baias; k++) {
          const xDaBaia = -larguraDoCorpo / 2 + (k + 0.5) * larguraDoCorpo / baias;
          if (k) criarCaixa(0.1, 1.5, profundidadeDoCorpo - 0.2, COR.madeira, -larguraDoCorpo / 2 + k * larguraDoCorpo / baias, 0.75, zDoCorpo, modeloGirado);
          criarCaixa(larguraDoCorpo / baias - 0.5, 0.7, 0.06, COR.ripa, xDaBaia, 0.45, zFrente + 0.02, modeloGirado);
          fardo(modeloGirado, xDaBaia, 0.25, zDoCorpo - profundidadeDoCorpo / 2 + 0.7);
        }
        for (const lado of [-1, 1]) { criarCaixa(0.1, 1.6, 0.1, COR.madeira, lado * larguraDoCorpo / 2, 0.8, zFrente + 0.7, modeloGirado); criarEsfera(0.15, 0xffd66b, lado * larguraDoCorpo / 2, 1.7, zFrente + 0.7, modeloGirado); }

    const teclas = { KeyW: false, KeyA: false, KeyS: false, KeyD: false, ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false, Space: false, ControlLeft: false, ControlRight: false, KeyC: false };
    const ALTURA_MAXIMA_DO_ALVO = 45, VELOCIDADE_VERTICAL = 14; // Espaço sobe · Ctrl (ou C) desce
    const LIMITE_DO_MAPA = 75;       // limite reduzido para acompanhar o mapa compacto
    const VELOCIDADE_BASE = 0.6;     // unidades/s para cada unidade de distância da câmera
    const VELOCIDADE_COM_SHIFT = 1.8; // multiplicador ao segurar Shift

    addEventListener('keydown', evento => {
      if (evento.code in teclas) {
        jogadorMexeu = true; teclas[evento.code] = true; evento.preventDefault();
        if (evento.code === 'Space' && document.activeElement && document.activeElement.blur) document.activeElement.blur(); // Espaço não aciona o botão focado
      }
    });
    addEventListener('keyup', evento => { if (evento.code in teclas) { teclas[evento.code] = false; if (evento.code === 'Space') evento.preventDefault(); } });
    addEventListener('blur', () => { for (const chave in teclas) teclas[chave] = false; }); // evita tecla "presa" ao trocar de aba

    const frente = new THREE.Vector3(), direita = new THREE.Vector3(), deslocamento = new THREE.Vector3();

    function atualizarMovimento(deltaTempo, shift) {
      anguloHorizontal += ((teclas.ArrowLeft ? 1 : 0) - (teclas.ArrowRight ? 1 : 0)) * 1.4 * deltaTempo;   // setas: girar e inclinar
      ajustarInclinacao(((teclas.ArrowDown ? 1 : 0) - (teclas.ArrowUp ? 1 : 0)) * 1.2 * deltaTempo);
      const vertical = (teclas.Space ? 1 : 0) - ((teclas.ControlLeft || teclas.ControlRight || teclas.KeyC) ? 1 : 0);
      if (vertical) for (const alvo of [alvoDestinoDaCamera, alvoAtualDaCamera]) // altura do alvo ≥ 0: a câmera nunca desce abaixo do chão
        alvo.y = Math.max(0, Math.min(ALTURA_MAXIMA_DO_ALVO, alvo.y + vertical * VELOCIDADE_VERTICAL * (shift ? VELOCIDADE_COM_SHIFT : 1) * deltaTempo));
      let avanco = (teclas.KeyW ? 1 : 0) - (teclas.KeyS ? 1 : 0);
      let lateral = (teclas.KeyD ? 1 : 0) - (teclas.KeyA ? 1 : 0);
      if (!avanco && !lateral) return;

      // A câmera fica em (sin h, cos h) em relação ao alvo, então "para frente" é o oposto disso
      frente.set(-Math.sin(anguloHorizontal), 0, -Math.cos(anguloHorizontal));
      direita.set(Math.cos(anguloHorizontal), 0, -Math.sin(anguloHorizontal));

      deslocamento.set(0, 0, 0).addScaledVector(frente, avanco).addScaledVector(direita, lateral);
      deslocamento.normalize(); // diagonal não fica mais rápida

      // Quanto mais longe a câmera, mais rápido anda (sensação constante na tela)
      const velocidade = distanciaDaCamera * VELOCIDADE_BASE * (shift ? VELOCIDADE_COM_SHIFT : 1);
      deslocamento.multiplyScalar(velocidade * deltaTempo);

      // Move destino e atual juntos: resposta imediata e sem brigar com o focarCameraNaArea
      for (const alvo of [alvoDestinoDaCamera, alvoAtualDaCamera]) {
        alvo.add(deslocamento);
        alvo.x = Math.max(-LIMITE_DO_MAPA, Math.min(LIMITE_DO_MAPA, alvo.x));
        alvo.z = Math.max(-LIMITE_DO_MAPA, Math.min(LIMITE_DO_MAPA, alvo.z));
      }
    }
    let shiftPressionado = false;
    addEventListener('keydown', evento => { if (evento.key === 'Shift') shiftPressionado = true; });
    addEventListener('keyup', evento => { if (evento.key === 'Shift') shiftPressionado = false; });

    // ======================= CONFIGURAÇÃO DOS ÁUDIOS — ADICIONE SEUS ARQUIVOS AQUI =======================
    // Nenhum arquivo de áudio acompanha o jogo: coloque os seus nestes caminhos (relativos a este HTML) ou edite os caminhos abaixo.
    // Se um arquivo não existir, o jogo continua normalmente: aquele som fica "indisponível" e o painel avisa. Nada é simulado.
    const AUDIO_CONFIG = {
      musica: { arquivo: 'assets/audio/musica-fundo.mp3', volume: 0.5 },                              // trilha sonora de fundo (em loop)
      animais: {
        volume: 0.7,                    // volume inicial da categoria "Animais"
        intervaloEntreSons: [4, 11],    // segundos (mín., máx.) entre dois sons de animais quaisquer
        maxSimultaneos: 2,              // no máximo dois animais fazendo barulho ao mesmo tempo
        tipos: {                        // arquivo · volume relativo · intervalo (s) entre sons do MESMO tipo · alcance (distância da câmera)
          vaca: { arquivo: 'assets/audio/animais/vaca.mp3', volume: 1.0, intervalo: [20, 45], alcance: 80 },        // mugido
          galinha: { arquivo: 'assets/audio/animais/galinha.mp3', volume: 0.8, intervalo: [12, 30], alcance: 60 },  // cacarejo
          ovelha: { arquivo: 'assets/audio/animais/ovelha.mp3', volume: 0.9, intervalo: [18, 40], alcance: 70 },    // balido
          porco: { arquivo: 'assets/audio/animais/porco.mp3', volume: 0.9, intervalo: [20, 45], alcance: 70 },      // grunhido
          cavalo: { arquivo: 'assets/audio/animais/cavalo.mp3', volume: 1.0, intervalo: [25, 55], alcance: 80 },    // relincho
        },
      },
      ambiente: {
        cachoeira: { arquivo: 'assets/audio/ambiente/cachoeira.mp3', volume: 0.6, alcance: 90 },    // som contínuo (loop), mais alto perto da cachoeira
        fonte: { arquivo: 'assets/audio/ambiente/fonte.mp3', volume: 0.5, alcance: 45 },            // som contínuo (loop) do chafariz do lago
      },
      segredos: { pedra: { arquivo: 'assets/audio/segredos/pedra-secreta.mp3', volume: 0.8 } },    // Easter egg: clique na pedra da floresta
    };

    // ======================= SISTEMA DE ÁUDIO =======================
    // Um elemento <audio> por som (criados uma vez e reutilizados). Nada toca antes de uma interação explícita (botão "Ativar áudio").
    const CHAVE_AUDIO = 'farmedu-audio'; // ajustes de áudio ficam separados do progresso do jogo
    const SOM = {
      ativo: false, bloqueado: false, musicaPausada: false, el: {}, indisponivel: {}, proximoAnimal: 0, livreEm: {},
      cat: { musica: { ligado: true, volume: AUDIO_CONFIG.musica.volume }, animais: { ligado: true, volume: AUDIO_CONFIG.animais.volume },
        cachoeira: { ligado: true, volume: AUDIO_CONFIG.ambiente.cachoeira.volume }, fonte: { ligado: true, volume: AUDIO_CONFIG.ambiente.fonte.volume } },
    };
    const NOMES_DO_AUDIO = { musica: 'Música', animais: 'Animais', cachoeira: 'Cachoeira', fonte: 'Fonte' };
    try { const salvo = JSON.parse(localStorage.getItem(CHAVE_AUDIO) || '{}'); for (const chave in SOM.cat) if (salvo[chave]) { if (typeof salvo[chave].ligado === 'boolean') SOM.cat[chave].ligado = salvo[chave].ligado; if (typeof salvo[chave].volume === 'number') SOM.cat[chave].volume = Math.min(1, Math.max(0, salvo[chave].volume)); } } catch (erro) { /* ajustes inválidos: usa os padrões */ }
    const salvarAjustesDeAudio = () => { try { localStorage.setItem(CHAVE_AUDIO, JSON.stringify(SOM.cat)); } catch (erro) { /* sem armazenamento: ignora */ } };
    const aleatorioEntre = ([minimo, maximo]) => minimo + Math.random() * (maximo - minimo);
    const ganhoPorDistancia = (distancia, alcance) => Math.pow(Math.max(0, 1 - Math.max(0, distancia - 6) / alcance), 1.5);
    function criarAudio(chave, arquivo, loop) {
      const audio = new Audio(); audio.preload = 'none'; audio.loop = loop; audio.src = arquivo;
      audio.addEventListener('error', () => { SOM.indisponivel[chave] = true; atualizarPainelDeAudio(); });   // arquivo ausente/ilegível: marca e segue
      ['playing', 'pause', 'ended'].forEach(evento => audio.addEventListener(evento, atualizarPainelDeAudio));
      SOM.el[chave] = audio; return audio;
    }
    criarAudio('musica', AUDIO_CONFIG.musica.arquivo, true);
    for (const tipo in AUDIO_CONFIG.animais.tipos) criarAudio('animal:' + tipo, AUDIO_CONFIG.animais.tipos[tipo].arquivo, false);
    for (const chave in AUDIO_CONFIG.ambiente) criarAudio(chave, AUDIO_CONFIG.ambiente[chave].arquivo, true);
    criarAudio('segredo:pedra', AUDIO_CONFIG.segredos.pedra.arquivo, false);
    function tocarAudio(chave, volume) {
      const audio = SOM.el[chave]; if (!audio || SOM.indisponivel[chave]) return;
      audio.volume = Math.min(1, Math.max(0, volume));
      let progresso; try { progresso = audio.play(); } catch (erro) { SOM.indisponivel[chave] = true; return; }
      if (progresso && progresso.catch) progresso.catch(erro => {
        const nome = erro && erro.name;
        if (nome === 'NotAllowedError') SOM.bloqueado = true;                  // o navegador exigiu um gesto do usuário
        else if (nome !== 'AbortError') SOM.indisponivel[chave] = true;         // arquivo inexistente / formato não suportado
        atualizarPainelDeAudio();
      });
    }
    const estaTocando = chave => !!SOM.el[chave] && !SOM.el[chave].paused && !SOM.indisponivel[chave];
    function aplicarMusica() {
      const audio = SOM.el.musica, deve = SOM.ativo && SOM.cat.musica.ligado && !SOM.musicaPausada && !document.hidden;
      if (deve) { if (audio.paused) tocarAudio('musica', SOM.cat.musica.volume); else audio.volume = SOM.cat.musica.volume; }
      else if (!audio.paused) audio.pause();
    }
    function aplicarAmbiente() {
      for (const chave in AUDIO_CONFIG.ambiente) {
        const audio = SOM.el[chave], deve = SOM.ativo && SOM.cat[chave].ligado && !document.hidden;
        if (deve) { if (audio.paused) tocarAudio(chave, 0); } else if (!audio.paused) audio.pause();
      }
    }
    // fontes sonoras no mundo: o volume do som contínuo cai com a distância da câmera
    const FONTES_SONORAS = { cachoeira: [CACHOEIRA_X, 6, CZ_FRENTE], fonte: [32, 2, 35] };
    setInterval(() => {
      if (!SOM.ativo) return;
      const posicaoCamera = camera.position;
      for (const chave in FONTES_SONORAS) {
        if (!estaTocando(chave)) continue;
        const fonte = FONTES_SONORAS[chave], config = AUDIO_CONFIG.ambiente[chave];
        SOM.el[chave].volume = Math.min(1, SOM.cat[chave].volume * config.volume * ganhoPorDistancia(Math.hypot(posicaoCamera.x - fonte[0], posicaoCamera.y - fonte[1], posicaoCamera.z - fonte[2]), config.alcance));
      }
    }, 150);
    // sons dos animais: ocasionais, com intervalos aleatórios, limite de simultâneos e volume pela distância
    const posicaoTemporaria = new THREE.Vector3();
    function sortearSomDeAnimal() {
      if (!SOM.ativo || !SOM.cat.animais.ligado || document.hidden) return;
      const agora = performance.now() / 1000; if (agora < SOM.proximoAnimal) return;
      const configAnimais = AUDIO_CONFIG.animais;
      SOM.proximoAnimal = agora + aleatorioEntre(configAnimais.intervaloEntreSons);
      if (Object.keys(configAnimais.tipos).filter(tipo => estaTocando('animal:' + tipo)).length >= configAnimais.maxSimultaneos) return;
      for (let i = REGISTRO_SONS_ANIMAIS.length - 1; i >= 0; i--) if (!REGISTRO_SONS_ANIMAIS[i][1].parent) REGISTRO_SONS_ANIMAIS.splice(i, 1); // animais removidos pela evolução
      const candidatos = REGISTRO_SONS_ANIMAIS.filter(([tipo]) => configAnimais.tipos[tipo] && !SOM.indisponivel['animal:' + tipo] && agora >= (SOM.livreEm[tipo] || 0));
      if (!candidatos.length) return;
      const [tipo, grupo] = candidatos[Math.floor(Math.random() * candidatos.length)], config = configAnimais.tipos[tipo];
      grupo.getWorldPosition(posicaoTemporaria);
      const ganho = ganhoPorDistancia(camera.position.distanceTo(posicaoTemporaria), config.alcance);
      if (ganho < 0.05) return;                                              // longe demais para ser ouvido
      SOM.livreEm[tipo] = agora + aleatorioEntre(config.intervalo);
      SOM.el['animal:' + tipo].currentTime = 0;
      tocarAudio('animal:' + tipo, SOM.cat.animais.volume * config.volume * ganho);
    }
    setInterval(sortearSomDeAnimal, 500);
    function tocarSegredo(nome) { // som do Easter egg (o clique já é um gesto do usuário, então o navegador permite tocar)
      const chave = 'segredo:' + nome, audio = SOM.el[chave];
      if (!audio) return;
      if (SOM.indisponivel[chave]) { console.info('[FarmEdu] Som secreto indisponível. Adicione o arquivo em: ' + AUDIO_CONFIG.segredos[nome].arquivo); return; }
      try { audio.currentTime = 0; } catch (erro) { /* ainda sem metadados */ }
      tocarAudio(chave, AUDIO_CONFIG.segredos[nome].volume);
    }
    function ativarAudio() { SOM.ativo = true; SOM.bloqueado = false; SOM.proximoAnimal = performance.now() / 1000 + 3; aplicarMusica(); aplicarAmbiente(); atualizarPainelDeAudio(); }
    document.addEventListener('visibilitychange', () => { aplicarMusica(); aplicarAmbiente(); });

    // painel de áudio (linhas geradas por categoria)
    {
      const html = Object.keys(SOM.cat).map(chave => `<div class="linha-audio"><label><input type="checkbox" id="audio-${chave}-on"> ${NOMES_DO_AUDIO[chave]}</label><input type="range" id="audio-${chave}-vol" min="0" max="100" aria-label="Volume: ${NOMES_DO_AUDIO[chave]}">` +
        (chave === 'musica' ? `<button class="botao" id="audio-musica-play" style="grid-column:1/-1">⏸ Pausar música</button>` : '') + `<small id="audio-${chave}-status"></small></div>`).join('');
      selecionar('#audio-linhas').innerHTML = html;
      for (const chave in SOM.cat) {
        selecionar(`#audio-${chave}-on`).addEventListener('change', evento => { SOM.cat[chave].ligado = evento.target.checked; salvarAjustesDeAudio(); aplicarMusica(); aplicarAmbiente(); atualizarPainelDeAudio(); });
        selecionar(`#audio-${chave}-vol`).addEventListener('input', evento => { SOM.cat[chave].volume = evento.target.value / 100; salvarAjustesDeAudio(); if (chave === 'musica') aplicarMusica(); });
      }
      selecionar('#audio-musica-play').addEventListener('click', () => { SOM.musicaPausada = !SOM.musicaPausada; aplicarMusica(); atualizarPainelDeAudio(); });
      selecionar('#audio-ativar').addEventListener('click', ativarAudio);
    }
    function atualizarPainelDeAudio() {
      selecionar('#audio-ativar').textContent = !SOM.ativo ? 'Ativar áudio' : SOM.bloqueado ? 'O navegador bloqueou: toque para ativar' : '✔ Áudio ativo';
      selecionar('#audio-ativar').classList.toggle('ativo', SOM.ativo && !SOM.bloqueado);
      for (const chave in SOM.cat) {
        selecionar(`#audio-${chave}-on`).checked = SOM.cat[chave].ligado; selecionar(`#audio-${chave}-vol`).value = Math.round(SOM.cat[chave].volume * 100);
        let texto;
        if (!SOM.cat[chave].ligado) texto = 'Desligado';
        else if (!SOM.ativo) texto = 'Aguardando "Ativar áudio"';
        else if (chave === 'animais') { const tipos = Object.keys(AUDIO_CONFIG.animais.tipos), faltam = tipos.filter(tipo => SOM.indisponivel['animal:' + tipo]).length; texto = faltam === tipos.length ? 'Arquivos não encontrados' : faltam ? `Ativo (${faltam} arquivo(s) ausente(s))` : 'Ativo: sons ocasionais'; }
        else if (SOM.indisponivel[chave]) texto = 'Arquivo não encontrado: ' + (chave === 'musica' ? AUDIO_CONFIG.musica.arquivo : AUDIO_CONFIG.ambiente[chave].arquivo);
        else if (chave === 'musica') texto = SOM.musicaPausada ? 'Pausada' : estaTocando('musica') ? 'Tocando (loop)' : 'Carregando…';
        else texto = estaTocando(chave) ? 'Tocando (volume pela distância)' : 'Carregando…';
        selecionar(`#audio-${chave}-status`).textContent = texto;
      }
      const botaoPausar = selecionar('#audio-musica-play'); botaoPausar.textContent = SOM.musicaPausada ? '▶ Tocar música' : '⏸ Pausar música'; botaoPausar.disabled = !SOM.ativo || !SOM.cat.musica.ligado || !!SOM.indisponivel.musica;
    }
    atualizarPainelDeAudio();

    // botões da barra superior: um painel aberto por vez
    {
      const botoes = [['#botao-ceu', '#painel-ceu'], ['#botao-audio', '#painel-audio']];
      botoes.forEach(([seletorBotao, seletorPainel]) => selecionar(seletorBotao).addEventListener('click', () => {
        const abrir = selecionar(seletorPainel).hidden;
        botoes.forEach(([outroSeletorBotao, outroSeletorPainel]) => { selecionar(outroSeletorPainel).hidden = true; selecionar(outroSeletorBotao).classList.remove('ativo'); });
        selecionar(seletorPainel).hidden = !abrir; selecionar(seletorBotao).classList.toggle('ativo', abrir);
      }));
    }

    // ======================= LOOP PRINCIPAL =======================
    const relogio = new THREE.Clock();
    function animarCena() {
      requestAnimationFrame(animarCena);
      const deltaTempo = Math.min(relogio.getDelta(), 0.05), tempo = relogio.elapsedTime;
      atualizarMovimento(deltaTempo, shiftPressionado);
      atualizarCiclo(deltaTempo, tempo);
      atualizarFazendeiros(deltaTempo, tempo);
      atualizarPedraSecreta(deltaTempo);
      for (const animar of animacoesDoCenario) animar(tempo, deltaTempo);
      for (const id in animacoesDaArea) for (const animar of animacoesDaArea[id]) animar(tempo, deltaTempo);
      for (const id in grupoDaArea) {
        const grupo = grupoDaArea[id];
        if (grupo.userData.progressoDoEfeitoDeEvolucao > 0) {
          grupo.userData.progressoDoEfeitoDeEvolucao = Math.max(0, grupo.userData.progressoDoEfeitoDeEvolucao - deltaTempo * 1.5);
          grupo.scale.setScalar(1 + 0.2 * Math.sin(grupo.userData.progressoDoEfeitoDeEvolucao * Math.PI));
        }
      }
      for (const nuvem of nuvens) {
        const dados = nuvem.userData, borda = 105;
        nuvem.position[dados.eixo] += deltaTempo * dados.velocidade;
        if (nuvem.position[dados.eixo] > borda) nuvem.position[dados.eixo] = -borda; // reaparece já invisível (fade), sem salto
        nuvem.position.y = dados.yBase + Math.sin(tempo * 0.1 + dados.fase) * 0.6;
        dados.materialDaNuvem.opacity = CEU.opacNuvem * Math.min(1, Math.max(0, (borda - Math.abs(nuvem.position[dados.eixo])) / 20));
        dados.materialDaNuvem.color.copy(CEU.corNuvem);
      }
      alvoAtualDaCamera.lerp(alvoDestinoDaCamera, 0.06);
      posicionarCamera();
      atualizarCeu(tempo);
      renderizador.render(cena, camera);
    }
    animarCena();

    // ======================= INTERFACE =======================
    let temporizadorDoAviso;
    function mostrarAviso(mensagem) {
      const elemento = selecionar('#aviso');
      elemento.textContent = mensagem; elemento.style.opacity = 1;
      clearTimeout(temporizadorDoAviso);
      temporizadorDoAviso = setTimeout(() => { elemento.style.opacity = 0; }, 2200);
    }
    function evoluirArea(id) {
      const nivel = estado.niveis[id], custo = CUSTO_PARA_PROXIMO_NIVEL[nivel - 1];
      if (nivel >= NIVEL_MAXIMO || estado.xp < custo) return;
      estado.xp -= custo;
      estado.niveis[id]++;
      salvarProgresso();
      reconstruirArea(id);
      focarCameraNaArea(id);
      desenharCards();
      mostrarAviso(AREAS.find(area => area.id === id).nome + ' evoluiu para o nível ' + (nivel + 1) + '! 🎉');
    }
    function desenharCards() {
      const lista = selecionar('#lista-cards'), rolagem = lista.scrollLeft;
      selecionar('#valor-xp').textContent = estado.xp;
      lista.innerHTML = AREAS.map(area => {
        const nivel = estado.niveis[area.id], noNivelMaximo = nivel >= NIVEL_MAXIMO, custo = CUSTO_PARA_PROXIMO_NIVEL[nivel - 1];
        return `<div class="card" onclick="focarCameraNaArea('${area.id}')">
      <div>${area.icone} <b>${area.nome}</b></div>
      <div class="pontos-nivel">${'●'.repeat(nivel) + '○'.repeat(NIVEL_MAXIMO - nivel)}</div>
      <button ${noNivelMaximo || estado.xp < custo ? 'disabled' : ''} onclick="event.stopPropagation(); evoluirArea('${area.id}')">${noNivelMaximo ? 'Nível máximo' : 'Evoluir · ' + custo + ' XP'}</button>
    </div>`;
      }).join('');
      lista.scrollLeft = rolagem;
    }
    // O sistema de atividades deve chamar window.adicionarXP(quantidade) para creditar XP.
    window.adicionarXP = quantidade => { estado.xp += quantidade; salvarProgresso(); desenharCards(); };
    selecionar('#botao-teste-xp').onclick = () => window.adicionarXP(5000);
    desenharCards();
  </script>
</body>
