<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Minha Fazenda 3D</title>
  <style>
    :root {
      --fundo-card: #fffdf5;
      --texto: #3b2a1a;
      --destaque: #4a8f3a;
      --desativado: #a89a82
    }

    @media(prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --fundo-card: #2b3424;
        --texto: #f1e8d0;
        --destaque: #7fc15f;
        --desativado: #6f7a62
      }
    }

    :root[data-theme="dark"] {
      --fundo-card: #2b3424;
      --texto: #f1e8d0;
      --destaque: #7fc15f;
      --desativado: #6f7a62
    }

    html,
    body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #9fd8f5;
      font-family: system-ui, sans-serif
    }

    canvas {
      position: fixed;
      inset: 0;
      touch-action: none
    }

    #barra-topo {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: calc(env(safe-area-inset-top, 0px) + 10px) 12px 8px;
      pointer-events: none
    }

    #barra-topo>* {
      pointer-events: auto;
      background: var(--fundo-card);
      color: var(--texto);
      border-radius: 20px;
      padding: 8px 14px;
      font-size: 15px;
      box-shadow: 0 2px 8px #0003;
      border: 0
    }

    #lista-cards {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 8px 12px calc(env(safe-area-inset-bottom, 0px) + 10px)
    }

    .card {
      flex: 0 0 150px;
      background: var(--fundo-card);
      color: var(--texto);
      border-radius: 14px;
      padding: 10px;
      box-shadow: 0 2px 8px #0003
    }

    .pontos-nivel {
      letter-spacing: 2px;
      color: var(--destaque);
      margin: 4px 0 8px;
      font-size: 13px
    }

    .card button {
      width: 100%;
      min-height: 36px;
      border: 0;
      border-radius: 10px;
      background: var(--destaque);
      color: #fff;
      font-weight: 600;
      font-size: 13px
    }

    .card button:disabled {
      background: var(--desativado);
      opacity: .7
    }

    #aviso {
      position: fixed;
      left: 50%;
      top: 70px;
      transform: translateX(-50%);
      background: var(--fundo-card);
      color: var(--texto);
      padding: 10px 16px;
      border-radius: 20px;
      box-shadow: 0 2px 10px #0004;
      opacity: 0;
      transition: opacity .3s;
      pointer-events: none;
      font-size: 14px;
      text-align: center
    }
  </style>
</head>

<body>
  <div id="barra-topo"><b>⭐ <span id="valor-xp">0</span> XP</b><button id="botao-teste-xp">+5000 XP (teste)</button>
  </div>
  <div id="lista-cards"></div>
  <div id="aviso"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    const selecionar = seletor => document.querySelector(seletor);

    // ======================= CONFIGURAÇÃO DO JOGO =======================
    const AREAS = [
      { id: 'curral', nome: 'Curral das vacas', icone: '🐄', posicao: { x: 9, z: 6 } },
      { id: 'ovelhal', nome: 'Ovelhal', icone: '🐑', posicao: { x: 34, z: 12 } },
      { id: 'casa', nome: 'Casa', icone: '🏠', posicao: { x: -8, z: -9 } },
      { id: 'celeiro', nome: 'Celeiro', icone: '🛖', posicao: { x: 9, z: -8 } },
      { id: 'maquinario', nome: 'Maquinário', icone: '🚜', posicao: { x: -8, z: 6 } },
      { id: 'plantacao', nome: 'Plantação', icone: '🌽', posicao: { x: 13, z: 27 } },
      { id: 'plantacaoGrande', nome: 'Grande plantação', icone: '🌾', posicao: { x: -7, z: 31 } },
      { id: 'galinheiro', nome: 'Galinheiro', icone: '🐔', posicao: { x: 22, z: 6 } },
      { id: 'chiqueiro', nome: 'Chiqueiro', icone: '🐖', posicao: { x: 22, z: -8 } },
      { id: 'estabulo', nome: 'Estábulo', icone: '🐎', posicao: { x: 34, z: -8 } },
      { id: 'ponte', nome: 'Ponte do rio', icone: '🌉', posicao: { x: -17.3, z: -1 } },
    ];
    const NIVEL_MAXIMO = 3;
    const CUSTO_PARA_PROXIMO_NIVEL = [100, 250]; // posição 0 = custo do nível 1 → 2
    const COR = { madeira: 0x8a5a2a, ripa: 0xb07a45, janela: 0xffe08a, vidro: 0xbfe3f2, feno: 0xe8c04a, pneu: 0x222222, telhaCasa: 0xd9532f, branco: 0xf2f2ea };

    // ======================= PROGRESSO (XP E NÍVEIS) =======================
    const CHAVE_SALVAMENTO = 'fazenda3d-progresso-v3';
    let estado = { xp: 0, niveis: Object.fromEntries(AREAS.map(a => [a.id, 1])) };
    try {
      const salvo = JSON.parse(localStorage.getItem(CHAVE_SALVAMENTO));
      if (salvo && salvo.niveis) {
        estado = salvo;
        for (const id in estado.niveis) estado.niveis[id] = Math.min(NIVEL_MAXIMO, Math.max(1, estado.niveis[id] | 0));
      }
    } catch (erro) { }
    // Compatibilidade com saves antigos: as áreas novas começam no nível 1.
    if (!estado.niveis) estado.niveis = {};
    for (const area of AREAS) {
      const nivelSalvo = Number(estado.niveis[area.id]);
      estado.niveis[area.id] = Number.isFinite(nivelSalvo) ? Math.min(NIVEL_MAXIMO, Math.max(1, nivelSalvo | 0)) : 1;
    }
    if (!Number.isFinite(estado.xp)) estado.xp = 0;
    function salvarProgresso() { try { localStorage.setItem(CHAVE_SALVAMENTO, JSON.stringify(estado)); } catch (erro) { } }

    // ======================= CENA 3D BÁSICA =======================
    const renderizador = new THREE.WebGLRenderer({ antialias: true });
    const canvas = renderizador.domElement;
    renderizador.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderizador.shadowMap.enabled = true;
    document.body.prepend(canvas);

    const cena = new THREE.Scene();
    cena.background = new THREE.Color(0x9fd8f5);
    cena.fog = new THREE.Fog(0x9fd8f5, 45, 100);
    const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 200);
    cena.add(new THREE.HemisphereLight(0xffffff, 0x6a8f4a, 0.75));
    const sol = new THREE.DirectionalLight(0xfff2cc, 0.9);
    sol.position.set(12, 22, 10);
    sol.castShadow = true;
    sol.shadow.mapSize.set(1024, 1024);
    Object.assign(sol.shadow.camera, { left: -26, right: 26, top: 26, bottom: -26, near: 1, far: 70 });
    cena.add(sol);

    // ======================= FUNÇÕES AUXILIARES DE MODELAGEM =======================
    const cacheDeMateriais = {};

    function criarTexturaProcedural(cor) {
      const tamanho = 128;
      const canvasTextura = document.createElement('canvas');
      canvasTextura.width = canvasTextura.height = tamanho;
      const ctx = canvasTextura.getContext('2d');

      ctx.fillStyle = '#' + cor.toString(16).padStart(6, '0');
      ctx.fillRect(0, 0, tamanho, tamanho);

      let semente = cor || 1;
      function aleatorio() {
        semente = (semente * 1664525 + 1013904223) >>> 0;
        return semente / 4294967296;
      }

      for (let i = 0; i < 450; i++) {
        const alpha = 0.04 + aleatorio() * 0.13;
        ctx.fillStyle = aleatorio() > 0.5
          ? `rgba(255,255,255,${alpha})`
          : `rgba(0,0,0,${alpha})`;
        ctx.beginPath();
        ctx.arc(aleatorio() * tamanho, aleatorio() * tamanho, 1 + aleatorio() * 5, 0, Math.PI * 2);
        ctx.fill();
      }

      const textura = new THREE.CanvasTexture(canvasTextura);
      textura.wrapS = textura.wrapT = THREE.RepeatWrapping;
      textura.repeat.set(2, 2);
      return textura;
    }

    function material(cor, textura = false) {
      if (!cacheDeMateriais[cor]) {
        cacheDeMateriais[cor] = new THREE.MeshLambertMaterial({
          color: cor
        });
        if(textura) {
          cacheDeMateriais[cor].map = criarTexturaProcedural(cor)
        }
      }

      return cacheDeMateriais[cor];
    }
    function criarCaixa(largura, altura, profundidade, cor, x, y, z, pai) {
      const caixa = new THREE.Mesh(new THREE.BoxGeometry(largura, altura, profundidade), material(cor));
      caixa.position.set(x, y, z);
      caixa.castShadow = caixa.receiveShadow = true;
      pai.add(caixa);
      return caixa;
    }
    function criarCilindro(raioTopo, raioBase, altura, cor, x, y, z, pai, segmentos = 14) {
      const c = new THREE.Mesh(new THREE.CylinderGeometry(raioTopo, raioBase, altura, segmentos), material(cor));
      c.position.set(x, y, z);
      c.castShadow = true;
      pai.add(c);
      return c;
    }
    function criarEsfera(raio, cor, x, y, z, pai, escalaY = 1) {
      const e = new THREE.Mesh(new THREE.SphereGeometry(raio, 8, 6), material(cor));
      e.position.set(x, y, z);
      e.scale.y = escalaY;
      e.castShadow = true;
      pai.add(e);
      return e;
    }
    function criarRoda(raio, largura, x, y, z, pai, aro) {
      const roda = criarCilindro(raio, raio, largura, COR.pneu, x, y, z, pai);
      roda.rotation.z = Math.PI / 2;
      if (aro) criarCilindro(raio * 0.55, raio * 0.55, largura + 0.04, aro, x, y, z, pai).rotation.z = Math.PI / 2;
    }
    // base de grama sob cada área (como nas ilustrações isométricas)
    function base(g, largura, profundidade, cor = 0x8fd05a) { criarCaixa(largura, 0.15, profundidade, cor, 0, 0.02, 0, g); }
    // telhado de duas águas (prisma). largura = vão entre as águas; comprimento = ao longo do cume.
    function telhado(g, largura, comprimento, altura, cor, x, y, z, giro = 0) {
      const r = altura / 1.5;
      const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, comprimento, 3), material(cor));
      m.rotation.x = -Math.PI / 2;
      m.scale.x = largura / (r * 1.732);
      m.position.y = r / 2;
      m.castShadow = true;
      const p = new THREE.Group();
      p.add(m);
      p.position.set(x, y, z);
      p.rotation.y = giro;
      g.add(p);
    }
    function cercaLinha(g, x1, z1, x2, z2) {
      const comp = Math.hypot(x2 - x1, z2 - z1), n = Math.ceil(comp), ang = Math.atan2(x2 - x1, z2 - z1);
      for (let i = 0; i <= n; i++) criarCaixa(0.14, 0.8, 0.14, COR.madeira, x1 + (x2 - x1) * i / n, 0.5, z1 + (z2 - z1) * i / n, g);
      for (const y of [0.68, 0.42]) criarCaixa(0.07, 0.09, comp, COR.ripa, (x1 + x2) / 2, y, (z1 + z2) / 2, g).rotation.y = ang;
    }
    function cerca(g, w, d) {
      cercaLinha(g, -w / 2, -d / 2, w / 2, -d / 2); cercaLinha(g, -w / 2, d / 2, w / 2, d / 2);
      cercaLinha(g, -w / 2, -d / 2, -w / 2, d / 2); cercaLinha(g, w / 2, -d / 2, w / 2, d / 2);
    }
    function arvore (g, x, z, s = 1, y = 0) { // árvore de montanha (3 cones empilhados)
      criarCilindro(0.12 * s, 0.18 * s, 0.9 * s, 0x6b4a2b, x, y + 0.45 * s, z, g, 6);
      [[1.1, 1.5, 1.2], [0.85, 1.3, 2], [0.55, 1.1, 2.8]].forEach(([r, h, yy], i) => {
      const c = new THREE.Mesh(new THREE.ConeGeometry(r * s, h * s, 7), material(i % 2 ? 0x2f7a4a : 0x2a6b40));
      c.position.set(x, y + yy * s, z); c.castShadow = true; g.add(c);
      });
    }

const cacheDePlano = {};
function materialPlano(cor) { // faces "facetadas" (visual low-poly) para montanhas
  return cacheDePlano[cor] || (cacheDePlano[cor] = new THREE.MeshLambertMaterial({ color: cor, flatShading: true }));
}
function pinheiro(g, x, z, s = 1, y = 0) { // árvore de montanha (3 cones empilhados)
  criarCilindro(0.12 * s, 0.18 * s, 0.9 * s, 0x6b4a2b, x, y + 0.45 * s, z, g, 6);
  [[1.1, 1.5, 1.2], [0.85, 1.3, 2], [0.55, 1.1, 2.8]].forEach(([r, h, yy], i) => {
    const c = new THREE.Mesh(new THREE.ConeGeometry(r * s, h * s, 7), material(i % 2 ? 0x2f7a4a : 0x2a6b40));
    c.position.set(x, y + yy * s, z); c.castShadow = true; g.add(c);
  });
}
function capim(g, x, z) {
  for (let i = 0; i < 4; i++) criarCaixa(0.05, 0.55, 0.05, 0x4f9e3a, x + (i - 1.5) * 0.08, 0.27, z + (i % 2) * 0.06, g).rotation.z = (i - 1.5) * 0.18;
}
    function arbusto(g, x, z, flores = true) {
      criarEsfera(0.4, 0x4a9e3a, x, 0.35, z, g, 0.8);
      if (flores) [0xe84a5f, 0xffd23f, 0xff8fb1].forEach((c, i) => criarCaixa(0.12, 0.12, 0.12, c, x + (i - 1) * 0.22, 0.6, z + 0.25, g));
    }
    function pedra(g, x, z, s = 0.4) {
      const p = new THREE.Mesh(new THREE.DodecahedronGeometry(s), material(0xb4b4aa));
      p.position.set(x, s * 0.5, z); p.scale.y = 0.7; p.castShadow = true; g.add(p);
    }
    function criarMontanha(x, z, largura, altura, profundidade, cor) {
      const montanha = new THREE.Mesh(
        new THREE.ConeGeometry(largura, altura, 5),
        material(cor, true)
      );
      montanha.position.set(x, altura / 2 - 0.2, z);
      montanha.scale.z = profundidade / largura;
      montanha.castShadow = true;
      montanha.receiveShadow = true;
      cena.add(montanha);
    }

    function criarLago(x, z, largura, profundidade) {
      const agua = new THREE.Mesh(
        new THREE.CircleGeometry(1, 32),
        new THREE.MeshLambertMaterial({
          color: 0x55bddd,
          transparent: true,
          opacity: 0.88
        })
      );
      agua.rotation.x = -Math.PI / 2;
      agua.position.set(x, 0.07, z);
      agua.scale.set(largura, profundidade, 1);
      cena.add(agua);

      for (let i = 0; i < 36; i++) {
        const angulo = (i / 36) * Math.PI * 2;
        pedra(
          cena,
          x + Math.cos(angulo) * largura * 0.95,
          z + Math.sin(angulo) * profundidade * 0.95,
          0.3
        );
      }
    }

    function criarCachoeira() {
      const rocha = new THREE.Mesh(
        new THREE.ConeGeometry(9, 18, 5),
        material(0x777d70)
      );
      rocha.position.set(-24, 8.8, -36);
      rocha.scale.z = 0.8;
      cena.add(rocha);

      const agua = new THREE.Mesh(
        new THREE.PlaneGeometry(3.2, 9),
        new THREE.MeshLambertMaterial({
          color: 0x7fe5f2,
          transparent: true,
          opacity: 0.82,
          side: THREE.DoubleSide
        })
      );
      agua.position.set(-24, 5.2, -31);
      cena.add(agua);

      criarLago(-24, -25, 4.5, 2.8);
    }

    function barril(g, x, z) { criarCilindro(0.32, 0.32, 0.7, 0x7a4a2a, x, 0.45, z, g, 10); }
    function caixote(g, x, z) { criarCaixa(0.55, 0.45, 0.55, 0xa0703a, x, 0.32, z, g); }
    function fardo(g, x, y, z) { criarCaixa(0.8, 0.5, 0.6, COR.feno, x, y, z, g); }
    function janela(g, x, y, z, lateral) {
      criarCaixa(...(lateral ? [0.1, 0.67, 0.62] : [0.62, 0.67, 0.1]), 0x9a4a2a, x, y, z, g);
      criarCaixa(...(lateral ? [0.14, 0.5, 0.45] : [0.45, 0.5, 0.14]), COR.vidro, x, y, z, g);
    }
    function placa(g, x, z) { criarCaixa(0.1, 1.5, 0.1, COR.madeira, x, 0.75, z, g); criarCaixa(0.6, 0.45, 0.08, 0xc98a4a, x, 1.4, z, g); }

    // ======================= MODELOS REUTILIZÁVEIS =======================
    function criarTrator(pai, x, z, escala, cor, aro) {
      const t = new THREE.Group();
      criarCaixa(1.1, 0.7, 2, cor, 0, 0.95, 0, t);
      criarCaixa(0.9, 0.9, 0.9, COR.vidro, 0, 1.7, -0.45, t);
      criarCaixa(1, 0.08, 1, cor, 0, 2.2, -0.45, t);
      criarCaixa(0.1, 0.6, 0.1, 0x333333, 0.35, 1.6, 0.7, t);
      criarRoda(0.6, 0.4, -0.8, 0.6, -0.5, t, aro); criarRoda(0.6, 0.4, 0.8, 0.6, -0.5, t, aro);
      criarRoda(0.38, 0.3, -0.7, 0.38, 0.8, t, aro); criarRoda(0.38, 0.3, 0.7, 0.38, 0.8, t, aro);
      t.scale.setScalar(escala);
      t.position.set(x, 0, z);
      pai.add(t);
      return t;
    }
    function reboque(g, x, z, giro) {
      const r = new THREE.Group();
      r.position.set(x, 0, z); r.rotation.y = giro; g.add(r);
      criarCaixa(1.6, 0.12, 2.4, 0x8a5a2a, 0, 0.7, 0, r);
      criarCaixa(1.4, 0.05, 2.2, 0xe8e0d0, 0, 0.78, 0, r);
      for (const s of [-1, 1]) { criarCaixa(0.1, 0.5, 2.4, 0xa5703a, s * 0.8, 0.95, 0, r); criarCaixa(1.6, 0.5, 0.1, 0xa5703a, 0, 0.95, s * 1.2, r); }
      criarRoda(0.4, 0.3, -0.9, 0.4, -0.3, r); criarRoda(0.4, 0.3, 0.9, 0.4, -0.3, r);
      criarCaixa(0.1, 0.1, 1.4, 0x555555, 0, 0.55, 1.9, r);
    }
    function arado(g, x, z, giro, cor) {
      const p = new THREE.Group();
      p.position.set(x, 0, z); p.rotation.y = giro; g.add(p);
      criarCaixa(3, 0.12, 0.3, cor, 0, 0.7, 0, p);
      for (let i = 0; i < 8; i++) criarCaixa(0.05, 0.55, 0.05, 0x555555, -1.3 + i * 0.37, 0.4, 0, p);
      criarRoda(0.3, 0.1, 1.6, 0.3, 0, p);
    }
    function abrigo(g, x, z) {
      for (const dx of [-1, 1]) for (const dz of [-0.9, 0.9]) criarCaixa(0.12, 1.5, 0.12, COR.madeira, x + dx, 0.85, z + dz, g);
      telhado(g, 2.7, 2.5, 0.8, 0xc98a3a, x, 1.6, z);
      criarCaixa(1.2, 0.35, 0.7, 0x2f6f6f, x, 0.3, z, g);
    }
    function cocho(g, x, z) { criarCaixa(1.6, 0.4, 0.6, 0x2f6f6f, x, 0.3, z, g); criarCaixa(1.4, 0.05, 0.4, 0x5ec7e0, x, 0.5, z, g); }

    // casinha de galinha elevada, com rampa, janela e caixa de ninhos (a frente fica virada para +Z)
    function casinhaDeGalinha(g, x, z, corParede = 0xc0522f) {
      const casinha = new THREE.Group();
      casinha.position.set(x, 0, z);
      g.add(casinha);
      for (const dx of [-0.6, 0.6]) for (const dz of [-0.45, 0.45]) criarCaixa(0.1, 0.5, 0.1, COR.madeira, dx, 0.25, dz, casinha); // pernas
      criarCaixa(1.6, 1, 1.2, corParede, 0, 1, 0, casinha);                            // corpo
      telhado(casinha, 1.6, 2, 0.6, COR.telhaCasa, 0, 1.5, 0, Math.PI / 2);            // telhado
      criarCaixa(0.4, 0.5, 0.05, 0x3a2a1a, 0.3, 0.95, 0.62, casinha);                  // porta
      criarCaixa(0.4, 0.04, 0.9, COR.ripa, 0.3, 0.4, 0.95, casinha).rotation.x = 0.75; // rampa
      janela(casinha, -0.4, 1.1, 0.62, false);
      criarCaixa(0.35, 0.4, 1, COR.ripa, 1, 1.1, 0, casinha);                          // caixa de ninhos
    }

    // poça de lama oval (dois cilindros achatados, um mais claro por cima)
    function pocaDeLama(g, x, z, raio) {
      criarCilindro(raio, raio, 0.06, 0x5b3a22, x, 0.13, z, g, 20).scale.z = 0.7;
      criarCilindro(raio * 0.6, raio * 0.6, 0.06, 0x70492c, x + raio * 0.1, 0.16, z, g, 16).scale.z = 0.7;
    }

    const RAIO_DA_HITBOX = { galinha: 0.3, ovelha: 0.5, vaca: 0.8, porco: 0.5, cavalo: 0.85 };

    // diz se um animal (círculo de centro x,z) pode ficar nessa posição sem bater em nada
    function posicaoEstaLivre(cercado, animalAtual, x, z, raio) {

        if (Math.hypot(x - pontoMaisProximoX, z - pontoMaisProximoZ) < raio) return false;
      }
      return !cercado.animais.some(outro => outro !== animalAtual && Math.hypot(x - outro.x, z - outro.z) < raio + outro.raio);

function montanha(x, z, R, H) {
  const m = new THREE.Group();
  m.position.set(x, 0, z);
  m.rotation.y = sorte() * 6.28;
  const cone = (r, h, cor, px, pz) => {
    const c = new THREE.Mesh(new THREE.ConeGeometry(r, h, 7), materialPlano(cor));
    c.position.set(px, h / 2, pz);
    m.add(c);
  };
  cone(R * 1.12, H * 0.7, 0x4a8a45, 0, 0);   // floresta na base
  cone(R, H, 0x7b8691, 0, 0);                // corpo rochoso
  const ch = H * 0.3;                         // neve: mesma inclinação do cone, 0.1 acima (sem "briga" de faces)
  const neve = new THREE.Mesh(new THREE.ConeGeometry(ch * R / H, ch, 7), materialPlano(0xf4f7fb));
  neve.position.y = H + 0.1 - ch / 2;
  m.add(neve);
  for (let i = 0; i < 2; i++) {               // picos menores ao redor
    const a = sorte() * 6.28, d = R * (0.6 + sorte() * 0.3), r = R * (0.45 + sorte() * 0.2), h = H * (0.45 + sorte() * 0.25);
    const px = Math.cos(a) * d, pz = Math.sin(a) * d;
    cone(r * 1.1, h * 0.6, 0x4a8a45, px, pz);
    cone(r, h, 0x8a929b, px, pz);
  }
  cena.add(m);
}

function criarFita(curva, largura, y, mat, tile, passos = 160) { // faixa plana que segue a curva
  const pos = [], uv = [], nor = [], idx = [], comp = curva.getLength();
  for (let i = 0; i <= passos; i++) {
    const t = i / passos, p = curva.getPointAt(t), tg = curva.getTangentAt(t), w = largura(t) / 2;
    pos.push(p.x + tg.z * w, y, p.z - tg.x * w, p.x - tg.z * w, y, p.z + tg.x * w);
    uv.push(0, t * comp / tile, 1, t * comp / tile);
    nor.push(0, 1, 0, 0, 1, 0);
    if (i < passos) { const a = i * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  geo.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  geo.setIndex(idx);
  const m = new THREE.Mesh(geo, mat);
  m.receiveShadow = true;
  cena.add(m);

    for (const dy of [-h, 0, h]) x.fillRect(px, py + dy, ww, hh);
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;

        telhado(g, d + 0.5, w + 0.5, 1.6, COR.telhaCasa, 0, h, 0, Math.PI / 2);
        criarCaixa(0.7, 1.2, 0.1, 0x7a4a2a, 0, 0.7, d / 2 + 0.04, g);
        for (const s of [-1, 1]) { janela(g, s * w * 0.3, 1.2, d / 2 + 0.04, false); janela(g, s * (w / 2 + 0.02), 1.2, -d * 0.15, true); }

        // varanda (todos os níveis); grade a partir do nível 2
        const pw = w * 0.8, ph = h - 0.25;
        criarCaixa(pw, 0.12, 1.3, 0xb98a55, 0, 0.1, d / 2 + 0.65, g);
        criarCaixa(pw + 0.3, 0.1, 1.6, COR.telhaCasa, 0, h - 0.1, d / 2 + 0.75, g).rotation.x = 0.25;
        for (const s of [-1, 1]) criarCaixa(0.12, ph, 0.12, 0xf2ead8, s * pw / 2, ph / 2, d / 2 + 1.25, g);
        if (n >= 2) criarCaixa(pw, 0.35, 0.06, 0xf2ead8, 0, 0.45, d / 2 + 1.3, g);

        // chaminé com fumaça
        const chamines = [[w * 0.25, h + 1.1, -d * 0.1, 1.5]];
        if (n === 3) chamines.push([-w * 0.15, h + 0.9, -d / 2 - 1.8, 1.3]);
        for (const [cx, cy, cz, alt] of chamines) criarCaixa(0.55, alt, 0.55, 0xe6dfd0, cx, cy, cz, g);
        const [fx, fy, fz] = chamines[0];
        for (let i = 0; i < 4; i++) {
          const b = new THREE.Mesh(new THREE.SphereGeometry(0.25, 8, 8), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true }));
          g.add(b);
          anim.push(t => { const p = (t * 0.3 + i / 4) % 1; b.position.set(fx + p * 0.8, fy + 1 + p * 2.2, fz); b.scale.setScalar(0.5 + p); b.material.opacity = 0.7 * (1 - p); });
        }
        // água-furtada
        if (n >= 2) for (const xs of (n === 2 ? [0] : [-w * 0.25, w * 0.25])) {
          criarCaixa(0.9, 1, 0.7, 0xdcc08e, xs, h + 0.85, d * 0.25, g);
          telhado(g, 1.2, 1, 0.5, COR.telhaCasa, xs, h + 1.35, d * 0.25);
          janela(g, xs, h + 0.95, d * 0.25 + 0.37, false);
        }
        // jardim, cerca e árvores
        const k = [2, 5, 8][n - 1];
        for (let i = 0; i < k; i++) arbusto(g, (i % 2 ? 1 : -1) * (w / 2 + 0.5), d / 2 - 0.3 + Math.floor(i / 2) * 0.8);
        if (n === 1) {
          cercaLinha(g, S / 2 - 0.4, -1, S / 2 - 0.4, 2.5);
          criarCaixa(0.1, 1, 0.1, COR.madeira, 2.8, 0.5, D / 2 - 0.8, g); criarCaixa(0.3, 0.25, 0.4, 0x2f6fb0, 2.8, 1.05, D / 2 - 0.8, g);
        } else cercaLinha(g, -S / 2 + 0.4, -D / 2 + 1, -S / 2 + 0.4, D / 2 - 1);
        arvore(g, S / 2 - 1, -D / 2 + 1.2, 0.9);
        if (n === 3) {
          // ala dos fundos
          criarCaixa(2.8, h, 3.2, 0xdcc08e, -w * 0.15, h / 2, -d / 2 - 1, g);
          telhado(g, 3.3, 3.5, 1.5, COR.telhaCasa, -w * 0.15, h, -d / 2 - 1);
          janela(g, -w * 0.15 - 1.42, 1.2, -d / 2 - 1, true);
          // lago de pedras
          criarCilindro(1.2, 1.2, 0.1, 0x9a9a90, 3.9, 0.12, 2.6, g, 18);
          criarCilindro(1, 1, 0.1, 0x4aa8c8, 3.9, 0.15, 2.6, g, 18);
          // pérgola
          for (const dx of [-0.9, 0.9]) for (const dz of [-0.9, 0.9]) criarCaixa(0.12, 1.8, 0.12, 0x8a5a2a, 3.9 + dx, 0.9, -2.6 + dz, g);
          for (let i = 0; i < 4; i++) criarCaixa(2.2, 0.08, 0.12, 0xa06a35, 3.9, 1.85, -3.4 + i * 0.55, g);
          arvore(g, -S / 2 + 1.2, -D / 2 + 1.2, 1);
          arvore(g, -S / 2 + 1, D / 2 - 1.5, 0.8);
        }
      },

      // N1 celeiro com janelas · N2 maior, com fardos · N3 silo e telheiro lateral
      celeiro(g, n) {
        const w = [3.4, 3.8, 4.2][n - 1], d = [3.8, 4.4, 4.8][n - 1], h = [2.2, 2.4, 2.6][n - 1];
        const S = n === 3 ? 10.5 : 8;
        base(g, S, 7.5);
        const forma = new THREE.Shape();
        [[-w / 2, 0], [w / 2, 0], [w / 2, h], [w * 0.3, h + 1], [0, h + 1.6], [-w * 0.3, h + 1], [-w / 2, h]].forEach(([x, y], i) => i ? forma.lineTo(x, y) : forma.moveTo(x, y));
        const corpo = new THREE.Mesh(new THREE.ExtrudeGeometry(forma, { depth: d, bevelEnabled: false }), material(0xc0392b));
        corpo.position.z = -d / 2; corpo.castShadow = true; g.add(corpo);
        criarCaixa(w + 0.1, 0.25, d + 0.1, 0x6a7078, 0, 0.12, 0, g);
        // telhado de duas inclinações (gambrel)
        const topo = [[-w / 2, h], [-w * 0.3, h + 1], [0, h + 1.6], [w * 0.3, h + 1], [w / 2, h]].map(([x, y]) => [x * 1.12, y]);
        for (let i = 0; i < 4; i++) {
          const [x1, y1] = topo[i], [x2, y2] = topo[i + 1];
          criarCaixa(Math.hypot(x2 - x1, y2 - y1) + 0.05, 0.16, d + 0.6, 0x4b5060, (x1 + x2) / 2, (y1 + y2) / 2 + 0.08, 0, g).rotation.z = Math.atan2(y2 - y1, x2 - x1);
        }
        for (const s of [-1, 1]) criarCaixa(0.08, h, 0.08, COR.branco, s * w / 2, h / 2, d / 2 + 0.02, g);
        // portão com X e janela do sótão
        const ph = h * 0.8;
        criarCaixa(1.6, ph, 0.1, COR.branco, 0, ph / 2, d / 2 + 0.03, g);
        criarCaixa(1.4, ph - 0.2, 0.12, 0xa82e22, 0, ph / 2, d / 2 + 0.05, g);
        for (const s of [-1, 1]) criarCaixa(0.06, Math.hypot(1.4, ph - 0.2), 0.14, COR.branco, 0, ph / 2, d / 2 + 0.06, g).rotation.z = s * Math.atan(1.4 / (ph - 0.2));
        criarCaixa(0.8, 0.8, 0.1, COR.branco, 0, h + 0.45, d / 2 + 0.04, g);
        criarCaixa(0.6, 0.6, 0.12, 0x7a2a20, 0, h + 0.45, d / 2 + 0.05, g);

        if (n === 1) {
          for (const z of [-0.8, 0.9]) { criarCaixa(0.1, 0.55, 0.45, COR.branco, w / 2 + 0.02, 1, z, g); criarCaixa(0.14, 0.4, 0.3, COR.vidro, w / 2 + 0.02, 1, z, g); }
          barril(g, w / 2 + 0.6, d / 2 - 0.4);
          arbusto(g, w / 2 + 0.5, 0.2, false);
        } else {
          fardo(g, w / 2 + 0.9, 0.25, 0.5); fardo(g, w / 2 + 0.9, 0.25, 1.2); fardo(g, w / 2 + 1, 0.75, 0.85);
          barril(g, w / 2 + 0.5, d / 2 - 0.2); caixote(g, w / 2 + 1.2, -1.4);
        }
        if (n === 3) {
          // silo
          const sx = -w / 2 - 1.1, sa = h + 2.2;
          criarCilindro(0.85, 0.85, sa, 0xc0392b, sx, sa / 2, -0.5, g, 16);
          for (const y of [1.2, 2.6, 4]) criarCilindro(0.87, 0.87, 0.12, COR.branco, sx, y, -0.5, g, 16);
          const cupula = new THREE.Mesh(new THREE.SphereGeometry(0.85, 16, 8, 0, Math.PI * 2, 0, Math.PI / 2), material(0xc4c8cc));
          cupula.position.set(sx, sa, -0.5); g.add(cupula);
          // telheiro lateral com fardos
          criarCaixa(2.6, 0.14, d * 0.8, 0x4b5060, w / 2 + 1.2, h * 0.62, 0.2, g).rotation.z = -0.18;
          for (const z of [-1.5, 1.8]) criarCaixa(0.12, h * 0.55, 0.12, 0xb98a55, w / 2 + 2.4, h * 0.275, z, g);
          fardo(g, w / 2 + 1.2, 0.25, -0.6); fardo(g, w / 2 + 1.2, 0.25, 0.4); fardo(g, w / 2 + 1.3, 0.75, -0.1);
          arvore(g, S / 2 - 0.8, -2.5, 0.9);
        } else {
          arvore(g, -w / 2 - 1.6, -d / 2 + 0.8, 0.9);
          cercaLinha(g, -S / 2 + 0.5, -1, -S / 2 + 0.5, 2.5);
        }
      },

      // N1 cercado com vaca · N2 vaca e ovelhas · N3 fazendinha cheia com cata-vento
      curral(g, n, anim) {
        const w = [6, 7.2, 8.8][n - 1], d = [5, 6, 7.2][n - 1];
        base(g, w + 0.9, d + 0.9, 0x7fc650);
        cerca(g, w, d);
        arvore(g, w / 2 - 0.3, -d / 2 - 0.6, 1);
        abrigo(g, w / 2 - 1.6, -d / 2 + 1.4);
        cocho(g, 0.5, d / 2 - 0.9);
        placa(g, -w / 2 - 0.2, d / 2 - 0.5);
        if (n === 3) {
          abrigo(g, -w / 2 + 1.6, -d / 2 + 1.4);
          cocho(g, -2.4, d / 2 - 0.9);
          const mx = -w / 2 + 1, mz = d / 2 - 1.3;
          criarCilindro(0.12, 0.55, 4.2, COR.madeira, mx, 2.2, mz, g, 4);
          const helice = new THREE.Group();
          helice.position.set(mx, 4.4, mz + 0.35); g.add(helice);
          for (let p = 0; p < 4; p++) { const braco = new THREE.Group(); braco.rotation.z = p * Math.PI / 2; criarCaixa(0.25, 1.4, 0.05, 0xc98a4a, 0, 0.7, 0, braco); helice.add(braco); }
          anim.push(t => { helice.rotation.z = t * 1.2; });
        }
        // ---- hitboxes: [centroX, centroZ, largura, profundidade] ----
        const MOSTRAR_HITBOXES = false; // hitboxes de depuração ocultas no jogo final
        const retangulos = [
          [w / 2 - 1.6, -d / 2 + 1.4, 2.3, 1.9], // abrigo
          [0.5, d / 2 - 0.9, 1.6, 0.6],          // cocho
        ];
        if (n === 3) retangulos.push(
          [-w / 2 + 1.6, -d / 2 + 1.4, 2.3, 1.9], // segundo abrigo
          [-2.4, d / 2 - 0.9, 1.6, 0.6],          // segundo cocho
          [-w / 2 + 1, d / 2 - 1.3, 1.1, 1.1]     // base do cata-vento
        );
        const cercado = {
          limiteX: w / 2 - 0.1, limiteZ: d / 2 - 0.1, animais: [],
          obstaculos: retangulos.map(([x, z, largura, prof]) => ({ minX: x - largura / 2, maxX: x + largura / 2, minZ: z - prof / 2, maxZ: z + prof / 2 })),
        };
        if (MOSTRAR_HITBOXES) retangulos.forEach(([x, z, largura, prof]) => criarCaixa(largura, 0.05, prof, 0xff0000, x, 0.2, z, g));
        const qtd = { vaca: [1, 2, 4][n - 1] }; // ovelhas ficam em um cercado próprio
        for (const tipo in qtd) for (let i = 0; i < qtd[tipo]; i++)
          criarAnimal(g, anim, tipo, cercado);
      },

      // Ovelhal independente: cada nível amplia o pasto e aumenta o rebanho.
      ovelhal(g, n, anim) {
        const w = [6, 7.5, 9][n - 1], d = [5, 6.2, 7.5][n - 1];
        base(g, w + 0.9, d + 0.9, 0x9dce68);
        // Cerca do ovelhal construída em segmentos retos e alinhados aos quatro lados.
        // Isso evita que os trilhos pareçam tortos nas quinas em diferentes níveis.
        const cercaReta = (x1, z1, x2, z2) => {
          const dx = x2 - x1, dz = z2 - z1;
          const horizontal = Math.abs(dx) >= Math.abs(dz);
          const comp = Math.hypot(dx, dz);
          const postes = Math.max(1, Math.ceil(comp / 1.05));
          for (let i = 0; i <= postes; i++) {
            const t = i / postes;
            criarCaixa(0.14, 0.82, 0.14, COR.madeira, x1 + dx * t, 0.43, z1 + dz * t, g);
          }
          for (const y of [0.38, 0.68]) {
            const trilho = criarCaixa(horizontal ? comp : 0.09, 0.09, horizontal ? 0.09 : comp, COR.ripa, (x1+x2)/2, y, (z1+z2)/2, g);
          }
        };
        cercaReta(-w/2, -d/2, w/2, -d/2);
        cercaReta(-w/2, d/2, w/2, d/2);
        cercaReta(-w/2, -d/2, -w/2, d/2);
        cercaReta(w/2, -d/2, w/2, d/2);
        placa(g, -w / 2 - 0.2, d / 2 - 0.5);
        abrigo(g, w / 2 - 1.5, -d / 2 + 1.3);
        cocho(g, -w / 2 + 1.2, d / 2 - 0.8);
        for (let i = 0; i < (n === 1 ? 2 : n === 2 ? 4 : 6); i++) {
          const tufo = criarEsfera(0.17, i % 2 ? 0xf5f0e4 : 0xe7e0d1, -w / 2 + 1.5 + i * (w - 3) / Math.max(1, (n === 1 ? 1 : n === 2 ? 3 : 5)), -0.01, -d / 2 + 0.7, g, 0.55);
          tufo.castShadow = false;
        }
        const cercado = { limiteX: w / 2 - 0.1, limiteZ: d / 2 - 0.1, animais: [], obstaculos: [
          { minX: w / 2 - 2.65, maxX: w / 2 - 0.35, minZ: -d / 2 + 0.35, maxZ: -d / 2 + 2.25 },
          { minX: -w / 2 + 0.4, maxX: -w / 2 + 2.0, minZ: d / 2 - 1.2, maxZ: d / 2 - 0.4 }
        ] };
        for (let i = 0; i < [2, 4, 6][n - 1]; i++) criarAnimal(g, anim, 'ovelha', cercado);
        if (n >= 2) { fardo(g, -w / 2 + 1.3, 0.25, -d / 2 + 1.2); barril(g, w / 2 - 0.7, d / 2 - 0.8); }
        if (n === 3) { abrigo(g, -w / 2 + 1.5, -d / 2 + 1.3); cocho(g, 0, d / 2 - 0.8); }
      },

      // Estábulo evolutivo: amplia as baias e acrescenta cavalos a cada nível.
      estabulo(g, n, anim) {
        const w = [5.8, 7.2, 8.8][n - 1], d = [4.5, 5.4, 6.5][n - 1];
        base(g, w + 1.2, d + 1.2, 0x8fbd56);
        cerca(g, w, d);
        const parede = n === 1 ? 0x9b6738 : 0x87552f;
        const bx = -w / 2 + 1.55, bz = -d / 2 + 1.35;
        criarCaixa(3.1 + (n - 1) * 0.8, 2.25, 2.35, parede, bx, 1.15, bz, g);
        criarCaixa(3.35 + (n - 1) * 0.8, 0.22, 2.6, 0x4c3c32, bx, 2.32, bz, g);
        criarCaixa(3.5 + (n - 1) * 0.8, 0.16, 2.8, 0x9b3f2f, bx, 2.55, bz, g).rotation.z = -0.04;
        for (let i = 0; i < n + 1; i++) {
          const dx = bx - 0.8 + i * 0.55;
          criarCaixa(0.08, 1.2, 0.08, 0xe6d3ad, dx, 0.62, bz + 1.2, g);
        }
        criarCaixa(1.1, 1.35, 0.12, 0x5b3926, bx, 0.72, bz + 1.22, g);
        placa(g, w / 2 - 0.2, d / 2 - 0.5);
        cocho(g, w / 2 - 1.1, d / 2 - 0.8);
        fardo(g, -w / 2 + 1, 0.25, d / 2 - 0.8);
        if (n >= 2) { fardo(g, -w / 2 + 1.6, 0.25, d / 2 - 1.6); barril(g, w / 2 - 0.7, -d / 2 + 0.8); }
        if (n === 3) {
          for (const x of [-1.8, 1.8]) { criarCaixa(0.12, 1.5, 0.12, COR.madeira, x, 0.75, -d / 2 - 0.5, g); criarCaixa(0.12, 1.5, 0.12, COR.madeira, x, 0.75, d / 2 + 0.5, g); }
          criarCaixa(4.2, 0.12, 0.12, COR.madeira, 0, 1.5, -d / 2 - 0.5, g);
        }
        const cercado = { limiteX: w / 2 - 0.45, limiteZ: d / 2 - 0.35, animais: [], obstaculos: [
          { minX: bx - 1.8, maxX: bx + 1.8, minZ: bz - 1.3, maxZ: bz + 1.35 }
        ] };
        for (let i = 0; i < [1, 2, 4][n - 1]; i++) criarAnimal(g, anim, 'cavalo', cercado);
      },

      // N1 galinheiro simples · N2 com poleiro e feno · N3 dois galinheiros
      galinheiro(g, n, anim) {
        const w = [5.5, 6.5, 7.5][n - 1], d = [4.5, 5.2, 6][n - 1];
        base(g, w + 0.9, d + 0.9, 0x9ccf5a);

        barril(g, w / 2 - 0.6, d / 2 - 0.6);

          criarCaixa(0.08, 0.08, 1.8, COR.ripa, -w / 2 + 0.8, 0.9, 0, g);

        const MOSTRAR_HITBOXES = false; // true = mostra retângulos vermelhos no chão para conferir
        const retangulos = [
          [w / 2 - 1.6, -d / 2 + 1.4, 2.3, 1.9], // abrigo
          [0.5, d / 2 - 0.9, 1.6, 0.6],          // cocho
        ];
        if (n === 3) retangulos.push(
          [-w / 2 + 1.6, -d / 2 + 1.4, 2.3, 1.9], // segundo abrigo
          [-2.4, d / 2 - 0.9, 1.6, 0.6],          // segundo cocho
          [-w / 2 + 1, d / 2 - 1.3, 1.1, 1.1]     // base do cata-vento

        const cercado = {
          limiteX: w / 2 - 0.1, limiteZ: d / 2 - 0.1, animais: [],
          obstaculos: retangulos.map(([x, z, largura, prof]) => ({ minX: x - largura / 2, maxX: x + largura / 2, minZ: z - prof / 2, maxZ: z + prof / 2 })),
        };
        if (MOSTRAR_HITBOXES) retangulos.forEach(([x, z, largura, prof]) => criarCaixa(largura, 0.05, prof, 0xff0000, x, 0.2, z, g));

        const qtd = { galinha: [1, 3, 5][n - 1] };
        for (const tipo in qtd) for (let i = 0; i < qtd[tipo]; i++)
          criarAnimal(g, anim, tipo, cercado);
      },

      // N1 chiqueiro com poça de lama · N2 maior, com abrigo · N3 duas poças, feno e barril
      chiqueiro(g, n, anim) {
        const w = [5.5, 6.5, 7.5][n - 1], d = [4.5, 5.2, 6][n - 1];
        base(g, w + 0.9, d + 0.9, 0x8fbf5a);
        cerca(g, w, d);
        placa(g, -w / 2 - 0.2, d / 2 - 0.5);
        arvore(g, w / 2 + 0.7, -d / 2 - 0.4, 0.9);
        cocho(g, -w / 2 + 1.2, d / 2 - 0.8);
        if (n === 3) { pocaDeLama(g, -1.5, 0.2, 1.3); pocaDeLama(g, 1.6, 0.6, 1.1); }
        else pocaDeLama(g, 0, 0.2, n === 1 ? 1.5 : 1.8);
        if (n >= 2) abrigo(g, w / 2 - 1.6, -d / 2 + 1.4);
        if (n === 3) { barril(g, w / 2 - 0.6, d / 2 - 0.6); fardo(g, -w / 2 + 1, 0.25, -d / 2 + 0.8); }
        // ---- hitboxes: [centroX, centroZ, largura, profundidade] ----
        const MOSTRAR_HITBOXES = false; // true = mostra retângulos vermelhos no chão para conferir
        const retangulos = [
          [w / 2 - 1.6, -d / 2 + 1.4, 2.3, 1.9], // abrigo
          [0.5, d / 2 - 0.9, 1.6, 0.6],          // cocho
        ];
        if (n === 3) retangulos.push(
          [-w / 2 + 1.6, -d / 2 + 1.4, 2.3, 1.9], // segundo abrigo
          [-2.4, d / 2 - 0.9, 1.6, 0.6],          // segundo cocho
          [-w / 2 + 1, d / 2 - 1.3, 1.1, 1.1]     // base do cata-vento
        );
        const cercado = {
          limiteX: w / 2 - 0.1, limiteZ: d / 2 - 0.1, animais: [],
          obstaculos: retangulos.map(([x, z, largura, prof]) => ({ minX: x - largura / 2, maxX: x + largura / 2, minZ: z - prof / 2, maxZ: z + prof / 2 })),
        };
        if (MOSTRAR_HITBOXES) retangulos.forEach(([x, z, largura, prof]) => criarCaixa(largura, 0.05, prof, 0xff0000, x, 0.2, z, g));

        const qtd = { porco: [1, 1, 3][n - 1] };
        for (const tipo in qtd) for (let i = 0; i < qtd[tipo]; i++)

      for (const alvo of [alvoDestinoDaCamera, alvoAtualDaCamera]) {

    function evoluirArea(id) {

      reconstruirArea(id);
      focarCameraNaArea(id);
      desenharCards();
      mostrarAviso(AREAS.find(a => a.id === id).nome + ' evoluiu para o nível ' + (nivel + 1) + '! 🎉');
    }
    function desenharCards() {
      const lista = selecionar('#lista-cards'), rolagem = lista.scrollLeft;
      selecionar('#valor-xp').textContent = estado.xp;
      lista.innerHTML = AREAS.map(area => {
        const nivel = estado.niveis[area.id], max = nivel >= NIVEL_MAXIMO, custo = CUSTO_PARA_PROXIMO_NIVEL[nivel - 1];
        return `<div class="card" onclick="focarCameraNaArea('${area.id}')">
      <div>${area.icone} <b>${area.nome}</b></div>
      <div class="pontos-nivel">${'●'.repeat(nivel) + '○'.repeat(NIVEL_MAXIMO - nivel)}</div>
      <button ${max || estado.xp < custo ? 'disabled' : ''} onclick="event.stopPropagation(); evoluirArea('${area.id}')">${max ? 'Nível máximo' : 'Evoluir · ' + custo + ' XP'}</button>
    </div>`;
      }).join('');
      lista.scrollLeft = rolagem;
    }
    // O sistema de atividades deve chamar window.adicionarXP(quantidade) para creditar XP.
    window.adicionarXP = q => { estado.xp += q; salvarProgresso(); desenharCards(); };
    selecionar('#botao-teste-xp').onclick = () => window.adicionarXP(5000);
    desenharCards();
  </script>
</body>

</html>
