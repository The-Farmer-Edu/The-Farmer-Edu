<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balão de Notificação Push</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="phone-notification" id="phoneNotification">
        <div class="app-icon" id="appIcon">💬</div>
        <div class="notification-content">
            <div class="notification-header">
                <span class="app-name" id="appName">The Farmer Edu</span>
                <span class="time-stamp">Agora</span>
            </div>
            <div class="message-sender" id="messageSender">A fazenda está sento atacada !!!</div>
        </div>
        <div class="drag-indicator"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
