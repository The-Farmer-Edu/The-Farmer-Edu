<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Farm Edu - Envio de Atividade</title>

    <!-- CSS local do módulo. O controller serve esses arquivos via /submissoes/file. -->
    <link rel="stylesheet" href="submissoes/file?type=css&file=aluno.css">

    <!-- Bootstrap e ícones para manter o layout visual consistente com o restante do sistema. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://kit.fontawesome.com/7d729e43cb.js" crossorigin="anonymous"></script>
</head>

<body data-pagina="aluno">
    <!-- Cabeçalho principal da tela do aluno: logo, título do módulo e avatar do usuário. -->
    <header>
        <button id="botaoIconi" class="botao-iconi" type="button" aria-expanded="false" aria-controls="menuIconi">
            <img src="submissoes/file?type=img&file=logo_icone.png" alt="iconiEDU" height="55px" width="55px">
        </button>

        <span class="titulo-modulo">MODELAGEM DE SISTEMAS | AI-APW-01-M-25-13150</span>

        <button id="botaoUsuario" class="botao-usuario" type="button" aria-label="Perfil do usuário" aria-expanded="false" aria-controls="menuUsuario">
            <img class="usuario-avatar" src="submissoes/file?type=img&file=icone_user.png" alt="iconiEDU">
        </button>
    </header>

    <!-- Menu lateral/overlay do ícone principal. Ele é do tipo “dropdown” e aparece ao clique. -->
    <div id="menuIconi" class="menu-iconi" role="menu" aria-hidden="true">
        <div class="menu-coluna">
            <button class="menu-item" type="button">
                <i class="fa-regular fa-calendar"></i>
                calendario
            </button>

            <button class="menu-item" type="button">
                <i class="fa-solid fa-medal"></i>
                visão geral
            </button>
        </div>
    </div>

    <!-- Menu do usuário: acessórios de perfil e logout. -->
    <div id="menuUsuario" class="menu-usuario" role="menu" aria-hidden="true">
        <div class="menu-coluna">
            <button class="menu-item" type="button">
                <i class="fa-solid fa-gear"></i>
                configurações
            </button>

            <button class="menu-item" type="button">
                <i class="fa-solid fa-arrow-right-from-bracket"></i>
                logout
            </button>

            <button class="menu-item" type="button">
                <i class="fa-regular fa-envelope"></i>
                meus dados
            </button>
        </div>
    </div>

    <main>
        <!-- Bloco principal para exibir os detalhes da atividade da turma. -->
        <section class="card-principal conteudo">
            <article>
                <div class="titulo">
                    <h1 id="atvTitulo"></h1>
                </div>
                <p id="atvDescricao"></p>
                <h2 class="atv-sub">O que você precisa fazer</h2>
                <ol class="atv-requisitos" id="atvRequisitos"></ol>
                <p class="atv-meta"><b>Linguagem:</b> <span id="atvLinguagem"></span><br>
                    <b>Nota:</b> <span id="atvNota"></span></p>
            </article>

            <article>
                <button id="btnVoltar" class="btn-voltar">⬅ Voltar</button>
            </article>

        </section>

        <!-- Card lateral com dados de entrega e botão para começar a atividade. -->
        <aside>
            <section class="card_trabalhos">
                <article>
                    <div class="titulo">
                        <h3>Seus trabalhos</h3>
                    </div>

                    <div class="status"><span class="ponto"></span> Não entregue</div>
                    <div class="prazo" id="atvPrazo" hidden></div>

                    <p id="texto">Escreva seu código direto na plataforma clicando em "Começar".</p>

                    <form action="iniciarAtv" method="get">
                        <!-- O id da atividade é enviado para a próxima página para carregar a atividade correta. -->
                        <input type="hidden" name="id" id="atvInputId">
                        <button id="comecar" type="submit" class="btn-comecar-principal">Começar</button>
                    </form>

                </article>
            </section>
        </aside>

    </main>

    <!-- Rodapé com mascote: o balão de conversa aparece conforme o JS muda o texto. -->
    <footer>
        <div class="mascote-container">
            <div class="balao" id="balao"></div>
            <button id="btnGalinha">
                <img src="submissoes/file?type=img&file=galinha.png" alt="Mascote" width="200" height="200">
            </button>
        </div>
    </footer>

    <!-- JSON serializado no HTML: o JavaScript usa esse bloco para montar a tela sem outra requisição. -->
    <script type="application/json" id="dadosAtividade"><?= json_encode($dadosAtividade ?? null) ?></script>
    <script src="submissoes/file?type=js&file=main.js"></script>
</body>

</html>
