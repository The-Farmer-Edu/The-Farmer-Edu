<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Farm Edu - Envio de Atividade</title>
    <link rel="stylesheet" href="submissoes/file?type=css&file=base.css">
    <link rel="stylesheet" href="submissoes/file?type=css&file=aluno.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Poppins:wght@500;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <header>
        <div class="brand">


            <button id="botaoIconi" class="botao-iconi" type="button" aria-expanded="false" aria-controls="menuIconi">
                <img src="submissoes/file?type=img&file=logo_icone.png" alt="iconiEDU" height="55px" width="55px">
            </button>


            <span class="nome">The Farm <b>Edu</b></span>
            <span class="modulo">Escrever código</span>
        </div>


        <button id="botaoUsuario" class="botao-usuario" type="button" aria-label="Perfil do usuário">
            <img class="usuario-avatar" src="submissoes/file?type=img&file=icone_user.png" alt="iconiEDU">
        </button>
    </header>


    <div id="menuIconi" class="menu-iconi" role="menu" aria-hidden="true">
        <div class="menu-coluna">
            <button class="menu-item" type="button">
                <i class="fa-regular fa-calendar"></i>
                calendario
            </button>

            <button class="menu-item" type="button">
                <i class="fa-solid fa-medal"></i>
                visão geral
            </button>
        </div>
    </div>

    <div id="menuUsuario" class="menu-usuario" role="menu" aria-hidden="true">
        <div class="menu-coluna">
            <button class="menu-item" type="button">
                <i class="fa-solid fa-gear"></i>
                configurações
            </button>

            <button class="menu-item" type="button">
                <i class="fa-solid fa-arrow-right-from-bracket"></i>
                logout
            </button>

            <button class="menu-item" type="button">
                <i class="fa-regular fa-envelope"></i>
                meus dados
            </button>
        </div>
    </div>

    <main>
        <section class="card-principal conteudo">
            <article>
                <div class="titulo">
                    <h1 id="atvTitulo"></h1>
                </div>
                <p id="atvDescricao"></p>
                <h2 class="atv-sub">O que você precisa fazer</h2>
                <ol class="atv-requisitos" id="atvRequisitos"></ol>
                <p class="atv-meta"><b>Linguagem:</b> <span id="atvLinguagem"></span><br>
                    <b>Nota:</b> <span id="atvNota"></span>
                </p>
            </article>

        </section>
        <aside>
            <section class="card_trabalhos">
                <article>
                    <div class="titulo">
                        <h3>Seus trabalhos</h3>
                    </div>

                    <div class="status"><span class="ponto"></span> Não entregue</div>
                    <div class="prazo" id="atvPrazo" hidden></div>

                    <p id="texto">Anexe seus arquivos aqui clicando em "Começar".</p>

                    <form action="iniciarAtv" method="get">
                        <button id="comecar" type="submit" class="btn-comecar-principal">Começar</button>
                    </form>

                    <!-- Feedback final da IA: bloqueado até o prazo de entrega acabar -->
                    <button id="btnNota" class="btn-nota-ia" type="button" disabled>🔒 Pontuação da IA</button>
                    <p class="nota-aviso" id="notaAviso"></p>
                </article>
            </section>
        </aside>

    </main>

    <footer>
        <article>
            <button class="btn-voltar" id="btnVoltar" aria-label="Voltar">⬅ Voltar</button>
        </article>

        <div class="mascote-container">
            <div class="balao" id="balao"></div>
            <button id="btnGalinha">
                <img src="submissoes/file?type=img&file=galinha.png" alt="Mascote" width="200" height="200">
            </button>
        </div>
    </footer>

    <!-- Pontuação final da IA -->
    <div class="modal-overlay" id="modalNota" role="dialog" aria-modal="true" aria-labelledby="notaTitulo">
        <div class="modal-card nota-card">
            <button type="button" class="nota-fechar" id="notaFechar" aria-label="Fechar">✕</button>
            <h3 id="notaTitulo">Pontuação da IA</h3>
            <div id="notaConteudo"></div>
        </div>
    </div>
</body>

<script src="submissoes/file?type=js&file=main.js"></script>

</html>
